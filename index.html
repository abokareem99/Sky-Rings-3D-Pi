<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>لعبة الطائرة ثلاثية الأبعاد - Pi Network</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            font-family: Arial, sans-serif; 
            user-select: none; 
            background-color: #87ceeb;
            touch-action: none; /* يمنع المتصفح من سحب الصفحة لأعلى وأسفل أثناء اللعب */
        }
        #score { 
            position: absolute; 
            top: 20px; 
            right: 20px; 
            color: white; 
            font-size: 24px; 
            font-weight: bold; 
            z-index: 10; 
            text-shadow: 2px 2px 4px #000; 
        }
        
        /* تنظيم أزرار السرعة والكبح أسفل الشاشة */
        #controls-container {
            position: absolute;
            bottom: 40px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 50px; /* مسافة مريحة بين الزرين */
            z-index: 10;
            pointer-events: none; /* تضمن أن لمس المساحات الفارغة يذهب للتحكم في الطائرة */
        }
        .btn { 
            width: 90px; 
            height: 90px; 
            border-radius: 50%; 
            border: 3px solid #fff; 
            font-size: 18px; 
            font-weight: bold; 
            cursor: pointer; 
            color: white;
            box-shadow: 0 6px 12px rgba(0,0,0,0.4);
            pointer-events: auto; /* تفعيل اللمس للأزرار فقط */
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }
        #btn-speed { background: rgba(46, 204, 113, 0.85); } /* تسريع أخضر */
        #btn-brake { background: rgba(231, 76, 60, 0.85); } /* كبح أحمر */
        .btn:active { transform: scale(0.92); opacity: 0.95; }

        /* لافتة إرشادية للمس الشاشة */
        #touch-hint {
            position: absolute;
            top: 70px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.8);
            font-size: 14px;
            z-index: 5;
            pointer-events: none;
            text-shadow: 1px 1px 2px #000;
        }

        /* زر بدء اللعب والإقلاع */
        #start-btn { 
            position: absolute; 
            top: 50%; 
            left: 50%; 
            transform: translate(-50%, -50%); 
            padding: 16px 36px; 
            font-size: 22px; 
            font-weight: bold; 
            background: #2ecc71; 
            color: white; 
            border: 2px solid #fff; 
            border-radius: 12px; 
            z-index: 20; 
            cursor: pointer; 
            box-shadow: 0 6px 15px rgba(0,0,0,0.4);
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://sdk.minepi.com/pi-sdk.js"></script>
</head>
<body>

    <div id="score">النقاط: <span id="points">0</span></div>
    <div id="touch-hint">اسحب إصبعك في أي مكان على الشاشة لتوجيه الطائرة</div>
    <button id="start-btn" onclick="startGame()">إقلاع وبدء اللعب</button>

    <div id="controls-container">
        <button class="btn" id="btn-brake">كبح</button>
        <button class="btn" id="btn-speed">تسريع</button>
    </div>

    <script>
        // تهيئة Pi SDK البيئة التجريبية
        try { Pi.init({ version: "2.0", sandbox: true }); } catch (e) {}

        // --- 1. إعداد المشهد والضباب ثلاثي الأبعاد ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb); 
        scene.fog = new THREE.FogExp2(0x87ceeb, 0.015); 

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // الإضاءة
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(20, 40, 20);
        scene.add(dirLight);

        // --- 2. بناء الأرضية ومدرج الإقلاع الرمادي ---
        const floorGeo = new THREE.PlaneGeometry(2000, 2000);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x2ecc71 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.position.y = -2;
        scene.add(floor);

        const runwayGeo = new THREE.PlaneGeometry(24, 400);
        const runwayMat = new THREE.MeshStandardMaterial({ color: 0x333333 });
        const runway = new THREE.Mesh(runwayGeo, runwayMat);
        runway.rotation.x = -Math.PI / 2;
        runway.position.set(0, -1.99, -150); 
        scene.add(runway);

        // خطوط المدرج المتقطعة
        for (let i = 0; i > -400; i -= 25) {
            const lineGeo = new THREE.PlaneGeometry(0.6, 6);
            const lineMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
            const line = new THREE.Mesh(lineGeo, lineMat);
            line.rotation.x = -Math.PI / 2;
            line.position.set(0, -1.98, i);
            scene.add(line);
        }

        // --- 3. مجسم الطائرة المركب ---
        const airplane = new THREE.Group();

        const bodyGeo = new THREE.ConeGeometry(0.4, 2.6, 8);
        bodyGeo.rotateX(Math.PI / 2);
        const bodyMat = new THREE.MeshStandardMaterial({ color: 0xd35400 }); 
        const bodyMesh = new THREE.Mesh(bodyGeo, bodyMat);
        airplane.add(bodyMesh);

        const wingGeo = new THREE.BoxGeometry(4.2, 0.08, 0.6);
        const wingMat = new THREE.MeshStandardMaterial({ color: 0xc0392b }); 
        const wingMesh = new THREE.Mesh(wingGeo, wingMat);
        wingMesh.position.set(0, 0, -0.2);
        airplane.add(wingMesh);

        const tailGeo = new THREE.BoxGeometry(0.08, 0.8, 0.4);
        const tailMesh = new THREE.Mesh(tailGeo, wingMat);
        tailMesh.position.set(0, 0.4, 1.1);
        airplane.add(tailMesh);

        airplane.position.set(0, -1.2, 0); 
        scene.add(airplane);

        // توليد الحلقات الصفراء في مسار الطيران للأمام
        const rings = [];
        function createRing(zPos) {
            const ringGeometry = new THREE.TorusGeometry(2.0, 0.2, 8, 24);
            const ringMaterial = new THREE.MeshStandardMaterial({ color: 0xffff00, metalness: 0.3 });
            const ringMesh = new THREE.Mesh(ringGeometry, ringMaterial);
            ringMesh.position.set((Math.random() - 0.5) * 30, Math.random() * 18 + 2, zPos);
            scene.add(ringMesh);
            rings.push(ringMesh);
        }
        
        for(let i = 1; i <= 6; i++) {
            createRing(-60 * i);
        }

        // --- 4. متغيرات اللعبة والتحكم باللمس وحركة الإصبع ---
        let speed = 0;
        let maxSpeed = 0.65;
        let points = 0;
        let isPlaying = false;

        // متغيرات تجميع حساسية السحب باللمس
        let targetTurnX = 0; // الانعطاف المستهدف يمين/يسار
        let targetTurnY = 0; // الارتفاع المستهدف فوق/تحت
        let isTouching = false;
        let touchStartX = 0;
        let touchStartY = 0;

        let accelerating = false;
        let braking = false;

        // ربط أحداث أزرار السرعة أسفل الشاشة
        document.getElementById('btn-speed').addEventListener('touchstart', (e) => { e.preventDefault(); accelerating = true; });
        document.getElementById('btn-speed').addEventListener('touchend', () => accelerating = false);
        document.getElementById('btn-brake').addEventListener('touchstart', (e) => { e.preventDefault(); braking = true; });
        document.getElementById('btn-brake').addEventListener('touchend', () => braking = false);

        // أحداث الماوس للكمبيوتر (للتجربة السريعة)
        document.getElementById('btn-speed').addEventListener('mousedown', () => accelerating = true);
        document.getElementById('btn-speed').addEventListener('mouseup', () => accelerating = false);
        document.getElementById('btn-brake').addEventListener('mousedown', () => braking = true);
        document.getElementById('btn-brake').addEventListener('mouseup', () => braking = false);

        // --- نظام التحكم بلمس وسحب الشاشة المباشر ---
        window.addEventListener('touchstart', (e) => {
            // تجاهل اللمس إذا كان على أزرار السرعة والكبح لعدم تداخل التحكم
            if (e.target.tagName === 'BUTTON') return;
            
            isTouching = true;
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        });

        window.addEventListener('touchmove', (e) => {
            if (!isTouching) return;

            // حساب مسافة حركة الإصبع على الشاشة
            const deltaX = e.touches[0].clientX - touchStartX;
            const deltaY = e.touches[0].clientY - touchStartY;

            // تحويل حركة اللمس إلى قيم توجيه حساسة (تقسيم على 150 للتحكم بنعومة الحركة)
            targetTurnX = deltaX / 150;
            targetTurnY = deltaY / 150;

            // وضع حدود قصوى لسرعة الالتفاف لكي لا تخرج الطائرة عن السيطرة
            targetTurnX = Math.max(Math.min(targetTurnX, 1), -1);
            targetTurnY = Math.max(Math.min(targetTurnY, 1), -1);
        });

        window.addEventListener('touchend', (e) => {
            // إرجاع التوجيه للصفر تلقائياً عند رفع الإصبع عن الشاشة لاستقرار الطائرة
            isTouching = false;
            targetTurnX = 0;
            targetTurnY = 0;
        });

        // محاكاة سحب الماوس للكمبيوتر للتجربة السريعة
        window.addEventListener('mousedown', (e) => {
            if (e.target.tagName === 'BUTTON') return;
            isTouching = true;
            touchStartX = e.clientX;
            touchStartY = e.clientY;
        });
        window.addEventListener('mousemove', (e) => {
            if (!isTouching) return;
            const deltaX = e.clientX - touchStartX;
            const deltaY = e.clientY - touchStartY;
            targetTurnX = Math.max(Math.min(deltaX / 150, 1), -1);
            targetTurnY = Math.max(Math.min(deltaY / 150, 1), -1);
        });
        window.addEventListener('mouseup', () => {
            isTouching = false;
            targetTurnX = 0;
            targetTurnY = 0;
        });

        function startGame() {
            document.getElementById('start-btn').style.display = 'none';
            isPlaying = true;
        }

        // --- 5. محرك ومحاكاة الطيران المستمرة ---
        function animate() {
            requestAnimationFrame(animate);

            if (isPlaying) {
                // تدوير وحساب طاقة الدفع والإقلاع
                if (accelerating) speed = Math.min(speed + 0.005, maxSpeed);
                if (braking) speed = Math.max(speed - 0.008, 0);

                // حركة الطائرة المستمرة للأمام
                airplane.position.z -= speed;

                // تنفيذ الالتفاف والارتفاع بلمس الشاشة (فقط عند وجود سرعة حركة)
                if (speed > 0.02) {
                    // الالتفاف يميناً ويساراً بناءً على السحب الأفقي
                    airplane.position.x += targetTurnX * (speed * 4);
                    airplane.rotation.z = -targetTurnX * 0.6; // إمالة الطائرة أثناء الانعطاف

                    // الارتفاع والهبوط بناءً على السحب العمودي (السحب لأسفل يرفعها لأعلى والعكس لعفوية التحكم)
                    if (airplane.position.y < 30 && airplane.position.y > -1.2) {
                        airplane.position.y -= targetTurnY * (speed * 3);
                    }
                    airplane.rotation.x = targetTurnY * 0.4; // إمالة مقدمة الطائرة صعوداً ونزولاً

                    // تراجع تدريجي لوضع الاستقرار الأفقي عند ترك الشاشة
                    if (!isTouching) {
                        airplane.rotation.z *= 0.85;
                        airplane.rotation.x *= 0.85;
                    }
                }

                // الكاميرا تتبع الطائرة بسلاسة تامة خلفها مباشرة
                camera.position.z = airplane.position.z + 6.5;
                camera.position.x = THREE.MathUtils.lerp(camera.position.x, airplane.position.x, 0.1);
                camera.position.y = THREE.MathUtils.lerp(camera.position.y, airplane.position.y + 1.6, 0.1);
                camera.lookAt(new THREE.Vector3(airplane.position.x, airplane.position.y + 0.4, airplane.position.z - 5));

                // التحقق من اجتياز ومرور الطائرة داخل الحلقات الصفراء
                rings.forEach((ring) => {
                    let distance = airplane.position.distanceTo(ring.position);
                    if (distance < 2.4 && Math.abs(airplane.position.z - ring.position.z) < 0.4) {
                        points += 10;
                        document.getElementById('points').innerText = points;
                        
                        // نقل الحلقة الحالية وتوليدها بعيداً في الأمام لتستمر اللعبة
                        ring.position.z -= 240;
                        ring.position.x = airplane.position.x + (Math.random() - 0.5) * 35;
                        ring.position.y = Math.max(Math.random() * 18, 0);
                    }

                    // توليد حلقة جديدة إذا تجاوزها اللاعب دون الحصول عليها لمنع نفاد الحلقات
                    if (airplane.position.z < ring.position.z - 15) {
                        ring.position.z -= 240;
                        ring.position.x = airplane.position.x + (Math.random() - 0.5) * 35;
                        ring.position.y = Math.max(Math.random() * 18, 0);
                    }
                });
            }

            renderer.render(scene, camera);
        }

        // ضبط الأبعاد التلقائي عند تدوير شاشة الهاتف
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
