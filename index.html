<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محاكي الطيران الواقعي - الباشمهندس عطية</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #bae1ff; user-select: none; }
        
        /* تصميم نظيف وأنيق للعداد الوحيد في الشاشة */
        #score-counter { 
            position: absolute; 
            top: 25px; 
            right: 25px; 
            color: #ffffff; 
            font-size: 28px; 
            font-weight: bold; 
            text-shadow: 2px 2px 8px rgba(0,0,0,0.8); 
            z-index: 10; 
            background: rgba(0, 0, 0, 0.4); 
            padding: 10px 25px; 
            border-radius: 30px; 
            border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(5px);
            letter-spacing: 1px;
        }

        #loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; font-size: 24px; font-weight: bold; text-shadow: 2px 2px 5px #000; z-index: 20; }
        #start-mask { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 15; display: flex; justify-content: center; align-items: center; }
        #start-btn { padding: 18px 45px; font-size: 24px; font-weight: bold; background: #d35400; color: white; border: none; border-radius: 50px; cursor: pointer; box-shadow: 0 8px 20px rgba(0,0,0,0.5); transition: 0.3s; letter-spacing: 1px; }
        #start-btn:hover { background: #e67e22; transform: translateY(-3px); box-shadow: 0 12px 25px rgba(0,0,0,0.6); }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

    <div id="score-counter">النقاط: <span id="points">0</span></div>
    
    <div id="loading">جاري معالجة البيئات الواقعية والمجسمات...</div>
    
    <div id="start-mask" style="display:none;">
        <button id="start-btn" onclick="startGame()">تشغيل المحرك الفخم والإقلاع ✈️</button>
    </div>

    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xa3d2f7); // لون سماء واقعي وعميق
        const fog = new THREE.FogExp2(0xa3d2f7, 0.0008); // ضباب ناعم للمدى البصري البعيد
        scene.fog = fog;

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 4000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.outputEncoding = THREE.sRGBEncoding;
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        // إضاءة شمسية واقعية وظلال ناعمة
        scene.add(new THREE.AmbientLight(0xffffff, 0.5));
        const sunLight = new THREE.DirectionalLight(0xffffff, 1.5);
        sunLight.position.set(300, 500, 200);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 2048; // زيادة دقة الظلال للواقعية
        sunLight.shadow.mapSize.height = 2048;
        sunLight.shadow.camera.near = 0.5;
        sunLight.shadow.camera.far = 1500;
        const d = 400;
        sunLight.shadow.camera.left = -d;
        sunLight.shadow.camera.right = d;
        sunLight.shadow.camera.top = d;
        sunLight.shadow.camera.bottom = -d;
        sunLight.shadow.bias = -0.0005;
        scene.add(sunLight);

        let airplane = null;
        let isPlaying = false;
        let hasTakenOff = false;
        let score = 0;
        let currentSpeed = 1.5;
        const rings = [];
        const environmentObjects = [];
        const keys = { w: false, s: false, a: false, d: false, space: false };

        // نظام هندسة الصوت الواقعي المحاكي للمحركات النفاثة الضخمة
        let audioCtx, engineOsc, engineOsc2, engineFilter, engineGain;

        function initEngineSound() {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            engineOsc = audioCtx.createOscillator();
            engineOsc2 = audioCtx.createOscillator();
            engineFilter = audioCtx.createBiquadFilter();
            engineGain = audioCtx.createGain();

            // الترددات الأساسية لصوت دوي الطائرة العميق
            engineOsc.type = 'sawtooth';
            engineOsc.frequency.setValueAtTime(45, audioCtx.currentTime); 
            
            engineOsc2.type = 'triangle';
            engineOsc2.frequency.setValueAtTime(90, audioCtx.currentTime); 

            engineFilter.type = 'lowpass';
            engineFilter.frequency.setValueAtTime(200, audioCtx.currentTime);

            engineGain.gain.setValueAtTime(0.25, audioCtx.currentTime);

            engineOsc.connect(engineFilter);
            engineOsc2.connect(engineFilter);
            engineFilter.connect(engineGain);
            engineGain.connect(audioCtx.destination);
            
            engineOsc.start();
            engineOsc2.start();
        }

        function updateEngineSound(speedUp) {
            if (!engineOsc) return;
            const targetFreq = speedUp ? 75 : 45;
            const targetFreq2 = speedUp ? 150 : 90;
            const targetFilter = speedUp ? 400 : 200;
            
            engineOsc.frequency.setTargetAtTime(targetFreq, audioCtx.currentTime, 0.2);
            engineOsc2.frequency.setTargetAtTime(targetFreq2, audioCtx.currentTime, 0.2);
            engineFilter.frequency.setTargetAtTime(targetFilter, audioCtx.currentTime, 0.3);
        }

        const terrainGroup = new THREE.Group();
        scene.add(terrainGroup);

        const envColors = {
            desert: 0xdfb175,   // رمال صحراوية حقيقية
            mountain: 0x7a8b99, // صخور رمادية داكنة
            forest: 0x1e5631    // أخضر غاباتي عميق
        };

        let currentEnv = 'desert';

        // دالة توليد الأجسام الجمالية والواقعية في البيئة المحيطة
        function addEnvironmentDecorations(zPos, envType) {
            const count = 25; // زيادة الكثافة لمنظر أكثر حيوية وواقعية
            for(let i=0; i<count; i++) {
                let mesh;
                const side = Math.random() > 0.5 ? 1 : -1;
                const x = (Math.random() * 350 + 90) * side; // توزيع آمن بعيداً عن ممر الطيران الأساسي
                
                if (envType === 'desert') {
                    // تلال وصخور صحراوية مدببة ومتموجة
                    const geo = new THREE.DodecahedronGeometry(Math.random() * 14 + 6);
                    const mat = new THREE.MeshStandardMaterial({ color: 0xc68642, roughness: 0.9, flatShading: true });
                    mesh = new THREE.Mesh(geo, mat);
                    mesh.position.set(x, -8, zPos + (Math.random() * 1000 - 500));
                    mesh.scale.set(1, Math.random() * 2 + 1, 1);
                } else if (envType === 'forest') {
                    // أشجار الغابات الكثيفة مجسمة بارتفاعات مختلفة
                    const tree = new THREE.Group();
                    const trunkGeo = new THREE.CylinderGeometry(1.5, 2.5, 15, 6);
                    const trunkMat = new THREE.MeshStandardMaterial({ color: 0x4a3728, roughness: 0.9 });
                    const trunk = new THREE.Mesh(trunkGeo, trunkMat);
                    trunk.position.y = 7.5;
                    tree.add(trunk);

                    const leavesGeo = new THREE.ConeGeometry(10, 24, 6);
                    const leavesMat = new THREE.MeshStandardMaterial({ color: 0x145a32, roughness: 0.8, flatShading: true });
                    const leaves = new THREE.Mesh(leavesGeo, leavesMat);
                    leaves.position.y = 22;
                    tree.add(leaves);
                    
                    mesh = tree;
                    mesh.position.set(x, -10, zPos + (Math.random() * 1000 - 500));
                } else if (envType === 'mountain') {
                    // كتل صخرية جبلية ضخمة تحيط باللاعب في الأفق
                    const geo = new THREE.ConeGeometry(Math.random() * 40 + 20, Math.random() * 90 + 40, 5);
                    const mat = new THREE.MeshStandardMaterial({ color: 0x566573, roughness: 0.9, flatShading: true });
                    mesh = new THREE.Mesh(geo, mat);
                    mesh.position.set(x * 1.5, Math.random() * 10 - 10, zPos + (Math.random() * 1000 - 500));
                }
                
                if(mesh) {
                    mesh.castShadow = true;
                    mesh.receiveShadow = true;
                    scene.add(mesh);
                    environmentObjects.push(mesh);
                }
            }
        }

        // توليد الغيوم الضخمة في السماء
        function createCloud(zPos) {
            const cloud = new THREE.Group();
            const mat = new THREE.MeshStandardMaterial({ color: 0xfdfefe, roughness: 0.95, flatShading: true });
            const numBlobs = Math.floor(Math.random() * 4) + 4;
            
            for(let i=0; i<numBlobs; i++) {
                const geo = new THREE.SphereGeometry(Math.random() * 15 + 10, 8, 8);
                const blob = new THREE.Mesh(geo, mat);
                blob.position.set(i * 15 - (numBlobs*7), Math.random() * 8, Math.random() * 8);
                cloud.add(blob);
            }
            cloud.position.set((Math.random() - 0.5) * 600, Math.random() * 100 + 150, zPos);
            scene.add(cloud);
            environmentObjects.push(cloud);
        }

        // بناء الأرض والتضاريس المتموجة بشكل حقيقي
        function createTerrainSegment(zPos, colorHex, isRunway = false) {
            const width = 1200;
            const length = 1000;
            const geometry = new THREE.PlaneGeometry(width, length, 24, 24);
            
            const pos = geometry.attributes.position;
            for (let i = 0; i < pos.count; i++) {
                const x = pos.getX(i);
                const y = pos.getY(i);
                // ممر الطيران بالمنتصف مستوٍ تماماً، والتضاريس ترتفع على الأطراف لتعطي عمقاً للجبال والتلال
                if (Math.abs(x) > 120 && !isRunway) {
                    let heightFactor = currentEnv === 'mountain' ? 140 : (currentEnv === 'forest' ? 60 : 30);
                    // معادلة رياضية لجعل تضاريس الأرض متموجة وواقعية وليست مسطحة
                    let wave = Math.sin(x * 0.02) * Math.cos(y * 0.02) * heightFactor;
                    pos.setZ(i, Math.abs(wave));
                }
            }
            geometry.computeVertexNormals();

            const material = new THREE.MeshStandardMaterial({ color: colorHex, roughness: 0.95, flatShading: true });
            const terrain = new THREE.Mesh(geometry, material);
            terrain.rotation.x = -Math.PI / 2;
            terrain.position.set(0, -10, zPos);
            terrain.receiveShadow = true;
            terrainGroup.add(terrain);

            if (isRunway) {
                // مدرج إقلاع واقعي احترافي عريض
                const runwayGeo = new THREE.PlaneGeometry(60, 800);
                const runwayMat = new THREE.MeshStandardMaterial({ color: 0x212121, roughness: 0.8 });
                const runway = new THREE.Mesh(runwayGeo, runwayMat);
                runway.rotation.x = -Math.PI / 2;
                runway.position.set(0, -9.8, zPos + 100);
                runway.receiveShadow = true;
                scene.add(runway);

                const lineGeo = new THREE.PlaneGeometry(1.8, 40);
                const lineMat = new THREE.MeshBasicMaterial({ color: 0xffcc00 });
                for(let l = 0; l < 10; l++) {
                    const line = new THREE.Mesh(lineGeo, lineMat);
                    line.rotation.x = -Math.PI / 2;
                    line.position.set(0, -9.7, zPos + 350 - (l * 80));
                    scene.add(line);
                }
            } else {
                addEnvironmentDecorations(zPos, currentEnv);
                if(Math.random() > 0.3) createCloud(zPos);
            }
        }

        // إنشاء القطع الأولى للعالم
        createTerrainSegment(0, envColors.desert, true);
        createTerrainSegment(-1000, envColors.desert);
        createTerrainSegment(-2000, envColors.desert);

        // تحميل الطائرة العملاقة وتكبير حجمها (3.0 لمظهر مهيب وقوي)
        const loader = new THREE.GLTFLoader();
        loader.load('airplane.glb', 
            (gltf) => {
                airplane = gltf.scene;
                airplane.scale.set(3.0, 3.0, 3.0); 
                airplane.position.set(0, -9.8, 300);
                airplane.rotation.set(0, Math.PI, 0);
                
                airplane.traverse((child) => {
                    if (child.isMesh) {
                        child.castShadow = true;
                        child.receiveShadow = true;
                    }
                });
                
                scene.add(airplane);
                document.getElementById('loading').style.display = 'none';
                document.getElementById('start-mask').style.display = 'flex';

                camera.position.set(0, 0, 345);
                camera.lookAt(airplane.position);
            },
            undefined,
            (error) => {
                document.getElementById('loading').innerText = "خطأ في تحميل الطائرة، يرجى التحقق من الملف";
                console.error(error);
            }
        );

        // إنشاء حلقات مذهبة مضيئة لجمع النقاط
        function createRing(zPos) {
            const geometry = new THREE.TorusGeometry(13, 1.4, 16, 40);
            const material = new THREE.MeshStandardMaterial({ 
                color: 0xffd700, 
                metalness: 0.9, 
                roughness: 0.1,
                emissive: 0xd4af37,
                emissiveIntensity: 0.2 
            });
            const ring = new THREE.Mesh(geometry, material);
            ring.position.set((Math.random() - 0.5) * 180, Math.random() * 65 + 25, zPos);
            ring.castShadow = true;
            scene.add(ring);
            rings.push(ring);
        }

        for (let i = 1; i <= 20; i++) {
            createRing(-i * 160);
        }

        window.addEventListener('keydown', (e) => { const key = e.key.toLowerCase(); if(key in keys || key===' ') keys[key===' '?'space':key] = true; });
        window.addEventListener('keyup', (e) => { const key = e.key.toLowerCase(); if(key in keys || key===' ') keys[key===' '?'space':key] = false; });

        function startGame() {
            document.getElementById('start-mask').style.display = 'none';
            initEngineSound();
            isPlaying = true;
        }

        let distanceTraveled = 0;
        let lastTerrainZ = -2000;

        function animate() {
            requestAnimationFrame(animate);

            if (isPlaying && airplane) {
                const speedMultiplier = keys.space ? 4.2 : 2.2;
                currentSpeed += (speedMultiplier - currentSpeed) * 0.1;
                updateEngineSound(keys.space);

                airplane.position.z -= currentSpeed;
                distanceTraveled = Math.abs(airplane.position.z);

                // ميكانيكية الإقلاع التفاعلية من المدرج
                if (!hasTakenOff) {
                    if (keys.w) {
                        airplane.position.y += 0.22;
                        airplane.rotation.x = 0.1; // ميلان خفيف للمقدمة للأعلى عند الإقلاع
                        if (airplane.position.y > -1) {
                            hasTakenOff = true;
                        }
                    } else {
                        airplane.rotation.x = 0;
                    }
                } else {
                    if (keys.w) airplane.position.y += 0.55;
                    if (keys.s) airplane.position.y -= 0.55;
                    
                    if(airplane.position.y < -7) airplane.position.y = -7;

                    if (keys.a) { 
                        airplane.position.x -= 0.9; 
                        airplane.rotation.z = THREE.MathUtils.lerp(airplane.rotation.z, 0.45, 0.08); 
                    }
                    if (keys.d) { 
                        airplane.position.x += 0.9; 
                        airplane.rotation.z = THREE.MathUtils.lerp(airplane.rotation.z, -0.45, 0.08); 
                    }
                    if (!keys.a && !keys.d) {
                        airplane.rotation.z = THREE.MathUtils.lerp(airplane.rotation.z, 0, 0.08);
                    }
                }

                // حركة تتبع سينمائية انسيابية جداً للكاميرا خلف الطائرة الضخمة
                camera.position.x = THREE.MathUtils.lerp(camera.position.x, airplane.position.x, 0.07);
                camera.position.y = THREE.MathUtils.lerp(camera.position.y, airplane.position.y + 7.5, 0.07);
                camera.position.z = airplane.position.z + 45; 
                camera.lookAt(new THREE.Vector3(airplane.position.x, airplane.position.y + 1.5, airplane.position.z - 45));

                // تحديث الشمس مع الطائرة لضمان جودة وحركة الظلال على الأرض
                sunLight.position.set(airplane.position.x + 300, airplane.position.y + 500, airplane.position.z + 200);

                // التحول السلس والأوتوماتيكي بين الأجواء الجمالية الثلاثة بناءً على المسافة
                if (distanceTraveled > 3500 && currentEnv === 'desert') {
                    currentEnv = 'mountain';
                    scene.background.setHex(0x8ba3b5);
                    fog.color.setHex(0x8ba3b5);
                } else if (distanceTraveled > 7500 && currentEnv === 'mountain') {
                    currentEnv = 'forest';
                    scene.background.setHex(0x7ecbb3);
                    fog.color.setHex(0x7ecbb3);
                }

                // توليد وإعادة تدوير التضاريس اللانهائية
                if (airplane.position.z < lastTerrainZ + 1500) {
                    lastTerrainZ -= 1000;
                    const activeColor = envColors[currentEnv];
                    createTerrainSegment(lastTerrainZ, activeColor);
                }

                // دوران وفحص الحلقات
                for (let i = rings.length - 1; i >= 0; i--) {
                    const ring = rings[i];
                    ring.rotation.y += 0.015; // دوران الحلقة
                    
                    const dist = airplane.position.distanceTo(ring.position);

                    if (dist < 20 && Math.abs(airplane.position.z - ring.position.z) < 8) { 
                        scene.remove(ring);
                        rings.splice(i, 1);
                        score += 10;
                        document.getElementById('points').innerText = score;
                        
                        const lowestZ = rings.reduce((min, r) => r.position.z < min ? r.position.z : min, airplane.position.z);
                        createRing(lowestZ - 160);
                    } 
                    else if (airplane.position.z < ring.position.z - 80) {
                        scene.remove(ring);
                        rings.splice(i, 1);
                        const lowestZ = rings.reduce((min, r) => r.position.z < min ? r.position.z : min, airplane.position.z);
                        createRing(lowestZ - 160);
                    }
                }

                // تنظيف الرامات وحذف الكائنات البعيدة أولاً بأول
                for (let i = environmentObjects.length - 1; i >= 0; i--) {
                    const obj = environmentObjects[i];
                    if (obj.position.z > airplane.position.z + 120) {
                        scene.remove(obj);
                        environmentObjects.splice(i, 1);
                    }
                }
            }
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
