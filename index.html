<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محاكي الطيران الاحترافي المتقدم</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-green: #00ff66;
            --neon-blue: #00d2ff;
            --neon-orange: #ff9f43;
            --panel-bg: rgba(6, 11, 25, 0.85);
            --panel-border: rgba(0, 210, 255, 0.25);
        }

        body { 
            margin: 0; overflow: hidden; 
            font-family: 'Cairo', sans-serif; 
            background-color: #050b14; 
            user-select: none; -webkit-user-select: none;
        }
        
        /* قناع القائمة الرئيسية باستخدام خلفية الطائرة السينمائية المستوحاة من الصورة */
        #start-menu-ui {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 15; display: flex; flex-direction: column; justify-content: space-between;
            padding: 30px 20px; box-sizing: border-box;
            background: linear-gradient(to bottom, rgba(5, 11, 20, 0.4) 0%, rgba(5, 11, 20, 0.85) 100%);
            pointer-events: none;
        }
        .menu-top { display: flex; justify-content: space-between; align-items: flex-start; pointer-events: auto; width: 100%; }
        .main-title { font-size: 2rem; font-weight: 900; margin: 0; color: #ffffff; text-shadow: 0 4px 12px rgba(0, 0, 0, 0.9); line-height: 1.2; }
        .balance-box { background: rgba(0,0,0,0.75); border: 1px solid var(--neon-green); padding: 8px 16px; border-radius: 8px; color: #fff; font-weight: 700; font-size: 14px; backdrop-filter: blur(5px); box-shadow: 0 0 10px rgba(0, 255, 102, 0.2); }

        .menu-bottom { display: flex; flex-direction: column; align-items: center; width: 100%; pointer-events: auto; }
        
        .fleet-slider {
            display: flex; overflow-x: auto; gap: 12px; width: 100%; max-width: 550px;
            padding: 12px; background: var(--panel-bg); border: 1px solid var(--panel-border);
            border-radius: 14px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            margin-bottom: 20px; box-sizing: border-box; direction: rtl;
        }
        .fleet-slider::-webkit-scrollbar { height: 5px; }
        .fleet-slider::-webkit-scrollbar-thumb { background: var(--neon-blue); border-radius: 3px; }
        
        .plane-card {
            flex: 0 0 auto; width: 130px; background: rgba(255, 255, 255, 0.03);
            border: 2px solid rgba(255, 255, 255, 0.1); border-radius: 10px;
            padding: 12px 8px; text-align: center; cursor: pointer; transition: 0.2s ease-in-out;
        }
        .plane-card.active { border-color: var(--neon-green); background: rgba(0, 255, 102, 0.15); box-shadow: 0 0 15px rgba(0, 255, 102, 0.35); }
        .plane-card h4 { margin: 0 0 8px 0; font-size: 13px; color: #fff; line-height: 1.3; font-weight: 700; }
        .plane-price { font-size: 13px; font-weight: 900; }

        .start-btn { 
            padding: 14px 60px; font-size: 18px; font-family: 'Cairo', sans-serif; font-weight: 900; 
            background: linear-gradient(90deg, #00d2ff, #0056b3); color: white; border: none; 
            border-radius: 30px; cursor: pointer; box-shadow: 0 5px 25px rgba(0, 210, 255, 0.45); 
            transition: transform 0.2s;
        }
        .start-btn:hover { transform: scale(1.03); }
        .start-btn:disabled { background: #3d434e; color: #888; cursor: not-allowed; box-shadow: none; }

        /* شاشات الـ HUD والتحكم أثناء اللعب */
        #top-nav-hud {
            position: absolute; top: 15px; left: 15px; right: 15px;
            display: none; justify-content: space-between; z-index: 10; pointer-events: none;
        }
        .hud-ticker {
            background: var(--panel-bg); border: 1px solid var(--panel-border);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            border-radius: 6px; padding: 6px 14px; color: #ffffff;
            font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 6px;
        }
        #hud-points { color: #ffd32a; }
        #hud-time { color: #ff4757; }

        #bottom-instrument-dash {
            position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%);
            width: 92%; max-width: 500px; height: 70px;
            background: var(--panel-bg); border: 1px solid var(--panel-border);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            border-radius: 12px; z-index: 12; display: none;
            grid-template-columns: 1fr 80px 1fr; align-items: center; padding: 0 15px; box-sizing: border-box;
        }
        .dash-sector { display: flex; flex-direction: column; justify-content: center; gap: 4px; }
        .sector-left { text-align: right; border-left: 1px solid rgba(0, 210, 255, 0.15); padding-left: 10px; }
        .sector-right { text-align: left; border-right: 1px solid rgba(0, 210, 255, 0.15); padding-right: 10px; }
        .instrument-readout { font-size: 12px; color: #a4b0be; font-weight: 700; display: flex; justify-content: space-between; }
        .instrument-readout span:last-child { color: var(--neon-green); font-family: monospace; font-size: 14px; }

        .radar-core {
            width: 55px; height: 55px; border: 2px solid var(--neon-green); border-radius: 50%;
            margin: 0 auto; position: relative; background: rgba(0, 255, 102, 0.05);
            display: flex; align-items: center; justify-content: center; box-shadow: 0 0 12px rgba(0, 255, 102, 0.25);
        }
        .radar-sweep {
            position: absolute; width: 100%; height: 100%; border-radius: 50%;
            background: conic-gradient(from 0deg, rgba(0,255,102,0.25) 0deg, transparent 90deg);
            animation: radar-rotate 2s linear infinite;
        }
        @keyframes radar-rotate { from { transform: rotate(0deg); } to { transform: rotate(-360deg); } }

        #loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: var(--neon-blue); font-size: 16px; font-weight: 800; z-index: 20; }

        #gameover-mask {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); backdrop-filter: blur(10px); z-index: 25;
            display: none; flex-direction: column; justify-content: center; align-items: center;
        }

        #touch-controls { display: none; }
        #joystick-zone {
            position: absolute; bottom: 110px; left: 30px; width: 100px; height: 100px;
            background: rgba(0, 210, 255, 0.05); border: 2px solid rgba(0, 210, 255, 0.3); border-radius: 50%; z-index: 100;
        }
        #joystick-knob {
            position: absolute; top: 35px; left: 35px; width: 30px; height: 30px;
            background: var(--neon-blue); border-radius: 50%; box-shadow: 0 0 15px var(--neon-blue); pointer-events: none;
        }
        #speed-btn {
            position: absolute; bottom: 110px; right: 30px; width: 80px; height: 80px;
            background: rgba(255, 71, 87, 0.2); border: 2px solid rgba(255, 71, 87, 0.6);
            border-radius: 50%; color: #ff4757; font-weight: 900; font-size: 16px;
            display: flex; justify-content: center; align-items: center; z-index: 100;
            box-shadow: 0 0 15px rgba(255, 71, 87, 0.2);
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

    <div id="start-menu-ui" style="display:none;">
        <div class="menu-top">
            <h1 class="main-title">محاكي الطيران<br><span style="color:var(--neon-blue); font-size: 1.4rem;">المتقدم</span></h1>
            <div class="balance-box">🪙 <span id="menu-total-points">0</span></div>
        </div>
        
        <div class="menu-bottom">
            <div class="fleet-slider" id="fleet-slider"></div>
            <button id="start-btn" class="start-btn" onclick="startGame()">إقلاع للطيران 🛫</button>
        </div>
    </div>

    <div id="top-nav-hud">
        <div id="hud-time" class="hud-ticker">⏱️ <span id="time-left">30</span>ث</div>
        <div id="hud-points" class="hud-ticker">🪙 <span id="points">0</span></div>
    </div>
    
    <div id="bottom-instrument-dash">
        <div class="dash-sector sector-left">
            <div class="instrument-readout"><span>السرعة</span><span id="dash-speed">0</span></div>
            <div class="instrument-readout"><span>المحرك</span><span id="dash-engine" style="color:var(--neon-blue)">READY</span></div>
        </div>
        <div class="radar-core"><div class="radar-sweep"></div></div>
        <div class="dash-sector sector-right">
            <div class="instrument-readout"><span>الارتفاع</span><span id="dash-alt">0</span></div>
            <div class="instrument-readout"><span>البيئة</span><span id="dash-env" style="color:var(--neon-orange)">مدرج</span></div>
        </div>
    </div>
    
    <div id="touch-controls">
        <div id="joystick-zone"><div id="joystick-knob"></div></div>
        <div id="speed-btn">تيربو 🚀</div>
    </div>

    <div id="loading">جاري تحميل المدرج والطائرات والمناظر...</div>
    
    <div id="gameover-mask">
        <h1 style="color: #ff4757; font-size: 2.3rem; margin:0 0 20px 0;">انتهت الجولة</h1>
        <div style="background: rgba(0,0,0,0.8); border: 2px solid var(--neon-green); padding: 15px 40px; border-radius: 12px; margin-bottom: 30px;">
            <span style="font-size: 18px; color: #fff;">النقاط المكتسبة: <span id="final-score" style="color:#ffd32a; font-size: 24px; font-weight:900;">0</span></span>
        </div>
        <button class="start-btn" style="background: var(--neon-green); color: #000; box-shadow: none;" onclick="restartGame()">العودة للحظيرة</button>
    </div>

    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xa5b1c2); // لون السماء الأولي المتناسق مع خلفية المطار القديم والغيوم
        const fog = new THREE.FogExp2(0xa5b1c2, 0.0003);
        scene.fog = fog;

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 5000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // إضاءة غنية لإظهار تفاصيل الطائرة بشكل سينمائي
        scene.add(new THREE.AmbientLight(0xffffff, 0.8));
        const sunLight = new THREE.DirectionalLight(0xffffff, 1.4);
        sunLight.position.set(400, 600, 200);
        scene.add(sunLight);

        let totalPoints = parseInt(localStorage.getItem('flight_totalPoints')) || 0;
        document.getElementById('menu-total-points').innerText = totalPoints;

        let basePassengerModel = null; 
        let baseFighterModel = null;     
        let currentActiveAirplane = null; 
        
        let isPlaying = false;
        let score = 0; let timeLeft = 30; let currentSpeed = 0; 
        let timerInterval = null;
        const rings = [];
        const keys = { space: false };
        const joyState = { x: 0, y: 0, active: false };

        const planeVelocity = { x: 0, y: 0 };
        const targetRotation = { x: 0, z: 0 };

        const fleet = [
            { id: 0, type: 'passenger', name: 'ركاب كلاسيك بيضاء', unlockCost: 0, colorHex: null },
            { id: 1, type: 'passenger', name: 'ركاب الجناح الأحمر', unlockCost: 30, colorHex: 0xff3333 },
            { id: 2, type: 'passenger', name: 'الصقر الأزرق النفاث', unlockCost: 60, colorHex: 0x3366ff },
            { id: 3, type: 'passenger', name: 'زمردة الأجواء الخضراء', unlockCost: 100, colorHex: 0x2ecc71 },
            { id: 4, type: 'fighter', name: 'مقاتلة الاعتراض F16', unlockCost: 200, colorHex: null },
            { id: 5, type: 'fighter', name: 'شبح التخفي السوداء', unlockCost: 280, colorHex: 0x111111 }
        ];
        let currentSelectionIndex = 0;

        let audioCtx, engineOsc, engineGain;
        function initEngineSound() {
            if (audioCtx) return;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            engineOsc = audioCtx.createOscillator();
            let filter = audioCtx.createBiquadFilter(); engineGain = audioCtx.createGain();
            engineOsc.type = 'sawtooth'; engineOsc.frequency.setValueAtTime(55, audioCtx.currentTime); 
            filter.type = 'lowpass'; filter.frequency.setValueAtTime(250, audioCtx.currentTime);
            engineGain.gain.setValueAtTime(0.15, audioCtx.currentTime);
            engineOsc.connect(filter); filter.connect(engineGain); engineGain.connect(audioCtx.destination);
            engineOsc.start();
        }

        const ENV_TYPES = {
            RUNWAY: { name: 'المدرج الدولي', groundColor: 0x4b6584, fogColor: 0xa5b1c2, objType: 'airport' },
            FOREST: { name: 'غابة استوائية', groundColor: 0x1e3f20, fogColor: 0x2f3640, objType: 'tree' },
            DESERT: { name: 'صحراء قاحلة', groundColor: 0xeccc68, fogColor: 0xf1f2f6, objType: 'rock' },
            SNOW: { name: 'الجليد القطبي', groundColor: 0xffffff, fogColor: 0xdcdde1, objType: 'ice' },
            RIVER: { name: 'وادي الأنهار', groundColor: 0x20bf6b, fogColor: 0x74b9ff, objType: 'water_rock' }
        };

        const terrainSegments = [];
        let segmentIndex = 0;
        const segmentLength = 1200; 

        function getEnvForZ(zPos) {
            const absZ = Math.abs(zPos);
            if (absZ < 1200) return ENV_TYPES.RUNWAY;
            if (absZ < 3600) return ENV_TYPES.FOREST;
            if (absZ < 6000) return ENV_TYPES.DESERT;
            if (absZ < 8400) return ENV_TYPES.SNOW;
            return ENV_TYPES.RIVER;
        }

        function createTerrainSegment(zPos) {
            const env = getEnvForZ(zPos);
            const group = new THREE.Group();
            group.position.z = zPos;

            const geometry = new THREE.PlaneGeometry(2000, segmentLength, 4, 4);
            const material = new THREE.MeshStandardMaterial({ color: env.groundColor, roughness: 0.9 });
            const ground = new THREE.Mesh(geometry, material);
            ground.rotation.x = -Math.PI / 2;
            group.add(ground);

            // بناء بيئة المدرج والمطار الفعلي في أول قطعة
            if (env === ENV_TYPES.RUNWAY) {
                const runway = new THREE.Mesh(new THREE.PlaneGeometry(120, segmentLength), new THREE.MeshStandardMaterial({ color: 0x2d3436, roughness: 0.6 }));
                runway.rotation.x = -Math.PI / 2; runway.position.y = 0.2;
                group.add(runway);
                
                const line = new THREE.Mesh(new THREE.PlaneGeometry(4, segmentLength), new THREE.MeshBasicMaterial({ color: 0xffffff }));
                line.rotation.x = -Math.PI / 2; line.position.y = 0.3;
                group.add(line);

                // إضافة برج مراقبة وهناجر خلفية لمحاكاة لقطة المطار الفعلي
                const tower = new THREE.Group();
                const base = new THREE.Mesh(new THREE.CylinderGeometry(15, 20, 90, 8), new THREE.MeshStandardMaterial({color: 0xd1d8e0}));
                base.position.y = 45;
                const cabin = new THREE.Mesh(new THREE.CylinderGeometry(25, 18, 20, 8), new THREE.MeshStandardMaterial({color: 0x2c3e50, transparent: true, opacity: 0.8}));
                cabin.position.y = 100;
                tower.add(base, cabin);
                tower.position.set(160, 0, -300);
                group.add(tower);
            } else {
                // توليد المعالم الطبيعية المختلفة (أشجار، جبال، صخور)
                for (let i = 0; i < 45; i++) {
                    let objMesh;
                    const xSide = (Math.random() > 0.5 ? 1 : -1) * (Math.random() * 800 + 90); 
                    const zItem = (Math.random() - 0.5) * segmentLength;

                    if (env.objType === 'tree') {
                        objMesh = new THREE.Group();
                        const trunk = new THREE.Mesh(new THREE.CylinderGeometry(2, 3, 15), new THREE.MeshStandardMaterial({color: 0x5c3d2e}));
                        trunk.position.y = 7.5;
                        const leaves = new THREE.Mesh(new THREE.ConeGeometry(14, 28, 5), new THREE.MeshStandardMaterial({color: 0x1b4d3e}));
                        leaves.position.y = 24;
                        objMesh.add(trunk, leaves);
                    } else if (env.objType === 'rock') {
                        objMesh = new THREE.Mesh(new THREE.DodecahedronGeometry(Math.random() * 25 + 10), new THREE.MeshStandardMaterial({color: 0xd35400}));
                        objMesh.position.y = 5;
                    } else if (env.objType === 'ice') {
                        objMesh = new THREE.Mesh(new THREE.ConeGeometry(Math.random() * 35 + 15, 60, 4), new THREE.MeshStandardMaterial({color: 0xf5f6fa, roughness: 0.3}));
                        objMesh.position.y = 30;
                    } else {
                        objMesh = new THREE.Mesh(new THREE.SphereGeometry(Math.random() * 40 + 10, 5, 5), new THREE.MeshStandardMaterial({color: 0x7f8c8d}));
                        objMesh.position.y = 12;
                    }

                    objMesh.position.set(xSide, 0, zItem);
                    group.add(objMesh);
                }
            }

            scene.add(group);
            terrainSegments.push({ group, zPos });
        }

        for(let i=0; i<4; i++) {
            createTerrainSegment(-i * segmentLength);
        }

        function wrapModelForward(modelMesh, scale) {
            const group = new THREE.Group();
            modelMesh.rotation.y = Math.PI; 
            group.add(modelMesh);
            group.scale.set(scale, scale, scale);
            return group;
        }

        function buildMockPassenger() {
            const group = new THREE.Group();
            const body = new THREE.Mesh(new THREE.CylinderGeometry(2, 2, 22, 12), new THREE.MeshStandardMaterial({color: 0xffffff, roughness: 0.4}));
            body.rotation.x = Math.PI / 2;
            const wing = new THREE.Mesh(new THREE.BoxGeometry(32, 0.5, 5), new THREE.MeshStandardMaterial({color: 0x3498db}));
            wing.position.set(0, -0.5, -2);
            const tail = new THREE.Mesh(new THREE.BoxGeometry(1, 6, 4), new THREE.MeshStandardMaterial({color: 0xff3333}));
            tail.position.set(0, 3, 9);
            group.add(body, wing, tail);
            return wrapModelForward(group, 2.5);
        }
        function buildMockFighter() {
            const group = new THREE.Group();
            const body = new THREE.Mesh(new THREE.ConeGeometry(2.5, 18, 4), new THREE.MeshStandardMaterial({color: 0x2c3e50}));
            body.rotation.x = Math.PI / 2;
            const wing = new THREE.Mesh(new THREE.BoxGeometry(20, 0.4, 6), new THREE.MeshStandardMaterial({color: 0x34495e}));
            wing.position.set(0, 0, -1);
            group.add(body, wing);
            return wrapModelForward(group, 2.5);
        }

        const loader = new THREE.GLTFLoader();
        loader.load('airplane.glb', (gltf) => { basePassengerModel = wrapModelForward(gltf.scene, 2.8); checkInit(); }, undefined, () => { basePassengerModel = buildMockPassenger(); checkInit(); });
        loader.load('Fighter.glb.glb', (gltf) => { baseFighterModel = wrapModelForward(gltf.scene, 2.8); checkInit(); }, undefined, () => { baseFighterModel = buildMockFighter(); checkInit(); });

        let loadedModels = 0;
        function checkInit() {
            loadedModels++;
            if(loadedModels >= 2) { 
                document.getElementById('loading').style.display = 'none';
                document.getElementById('start-menu-ui').style.display = 'flex';
                buildFleetUI();
                updateShopUI();
                positionCameraForMenu();
            }
        }

        function buildFleetUI() {
            const slider = document.getElementById('fleet-slider');
            slider.innerHTML = '';
            fleet.forEach((plane, index) => {
                const card = document.createElement('div');
                card.className = 'plane-card' + (index === currentSelectionIndex ? ' active' : '');
                card.onclick = () => selectPlane(index);
                
                const isUnlocked = totalPoints >= plane.unlockCost;
                const priceHtml = isUnlocked 
                    ? `<div class="plane-price" style="color:var(--neon-green)">✔️ جاهزة</div>`
                    : `<div class="plane-price" style="color:#ff4757">🔒 ${plane.unlockCost} 🪙</div>`;
                    
                card.innerHTML = `<h4>${plane.name}</h4>${priceHtml}`;
                slider.appendChild(card);
            });
        }

        function selectPlane(index) {
            currentSelectionIndex = index;
            buildFleetUI();
            updateShopUI();
        }

        function updateShopUI() {
            const planeData = fleet[currentSelectionIndex];
            const startBtn = document.getElementById('start-btn');

            if (totalPoints >= planeData.unlockCost) {
                startBtn.disabled = false;
                startBtn.style.background = "linear-gradient(90deg, #00d2ff, #0056b3)";
                startBtn.innerText = "تشغيل النفاث والاقلاع عبر الجو 🛫";
            } else {
                startBtn.disabled = true;
                startBtn.style.background = "#3d434e";
                startBtn.innerText = "رصيد غير كافٍ 🔒";
            }
            renderPlaneInMenu(planeData);
        }

        function renderPlaneInMenu(planeData) {
            if (currentActiveAirplane) scene.remove(currentActiveAirplane);
            let baseModel = planeData.type === 'passenger' ? basePassengerModel : baseFighterModel;
            if (!baseModel) return;
            currentActiveAirplane = baseModel.clone();

            if (planeData.colorHex !== null) {
                currentActiveAirplane.traverse(c => {
                    if (c.isMesh && c.material) { c.material = c.material.clone(); c.material.color.setHex(planeData.colorHex); }
                });
            }
            currentActiveAirplane.position.set(0, 2, 0); 
            scene.add(currentActiveAirplane);
        }

        // إعطاء الكاميرا زاوية مائلة وسينمائية تحاكي لقطة المطار الفعلي تماماً بدلاً من الزاوية البعيدة السابقة
        function positionCameraForMenu() {
            camera.position.set(-35, 12, -45); 
            camera.lookAt(0, 5, 10);
        }

        function createRing(zPos) {
            const geometry = new THREE.TorusGeometry(16, 1.8, 10, 24);
            const ring = new THREE.Mesh(geometry, new THREE.MeshStandardMaterial({ color: 0xffd700, emissive: 0xffb300, emissiveIntensity: 0.6 }));
            ring.position.set((Math.random() - 0.5) * 220, Math.random() * 85 + 30, zPos);
            scene.add(ring); rings.push(ring);
        }

        const joyZone = document.getElementById('joystick-zone');
        const joyKnob = document.getElementById('joystick-knob');
        let joyCenter = { x: 0, y: 0 };
        function handleTouchMove(e) {
            e.preventDefault(); if(!joyState.active) return;
            const touch = e.touches[0];
            let dx = touch.clientX - joyCenter.x; let dy = touch.clientY - joyCenter.y;
            let dist = Math.sqrt(dx*dx + dy*dy);
            if(dist > 35) { dx = (dx / dist) * 35; dy = (dy / dist) * 35; }
            joyKnob.style.transform = `translate(${dx}px, ${dy}px)`;
            joyState.x = dx / 35; joyState.y = dy / 35; 
        }
        joyZone.addEventListener('touchstart', (e) => {
            e.preventDefault(); joyState.active = true;
            const rect = joyZone.getBoundingClientRect(); joyCenter = { x: rect.left + rect.width/2, y: rect.top + rect.height/2 }; handleTouchMove(e);
        }, {passive: false});
        joyZone.addEventListener('touchmove', handleTouchMove, {passive: false});
        joyZone.addEventListener('touchend', (e) => {
            e.preventDefault(); joyState.active = false; joyState.x = 0; joyState.y = 0; joyKnob.style.transform = `translate(0px, 0px)`;
        });
        const speedBtn = document.getElementById('speed-btn');
        speedBtn.addEventListener('touchstart', (e) => { e.preventDefault(); keys.space = true; }, {passive: false});
        speedBtn.addEventListener('touchend', (e) => { e.preventDefault(); keys.space = false; });

        function startGame() {
            document.getElementById('start-menu-ui').style.display = 'none';
            document.getElementById('top-nav-hud').style.display = 'flex';
            document.getElementById('bottom-instrument-dash').style.display = 'grid'; 
            document.getElementById('touch-controls').style.display = 'block'; 
            
            initEngineSound();
            if(audioCtx) engineGain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            
            rings.forEach(r => scene.remove(r)); rings.length = 0;
            for (let i = 1; i <= 15; i++) { createRing(currentActiveAirplane.position.z - (i * 240)); }

            isPlaying = true; score = 0; document.getElementById('points').innerText = score;
            timeLeft = 30; document.getElementById('time-left').innerText = timeLeft;
            
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if(isPlaying) {
                    timeLeft--; document.getElementById('time-left').innerText = timeLeft;
                    if(timeLeft <= 0) { endGame(); }
                }
            }, 1000);
        }

        function endGame() {
            isPlaying = false; 
            if(audioCtx) engineGain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.1); 
            clearInterval(timerInterval);
            
            document.getElementById('touch-controls').style.display = 'none';
            document.getElementById('top-nav-hud').style.display = 'none';
            document.getElementById('bottom-instrument-dash').style.display = 'none';
            
            totalPoints += score;
            localStorage.setItem('flight_totalPoints', totalPoints);
            document.getElementById('menu-total-points').innerText = totalPoints;
            document.getElementById('final-score').innerText = score;
            document.getElementById('gameover-mask').style.display = 'flex';
        }

        function restartGame() {
            document.getElementById('gameover-mask').style.display = 'none';
            currentSpeed = 0; 
            currentActiveAirplane.position.set(0, 2, 0);
            planeVelocity.x = 0; planeVelocity.y = 0;
            targetRotation.x = 0; targetRotation.z = 0;
            
            terrainSegments.forEach(s => scene.remove(s.group));
            terrainSegments.length = 0;
            segmentIndex = 0;
            for(let i=0; i<4; i++) {
                createTerrainSegment(-i * segmentLength);
            }

            updateShopUI(); 
            positionCameraForMenu();
            buildFleetUI();
            document.getElementById('start-menu-ui').style.display = 'flex';
        }

        function animate() {
            requestAnimationFrame(animate);

            // دوران الكاميرا بشكل سينمائي حول الطائرة والمطار والمدرج في شاشة البداية لتطابق اللقطة المطلوبة
            if (!isPlaying && currentActiveAirplane) {
                camera.position.x = -40 + Math.sin(Date.now() * 0.0003) * 15;
                camera.position.z = -55 + Math.cos(Date.now() * 0.0002) * 10;
                camera.position.y = 14 + Math.sin(Date.now() * 0.0004) * 2;
                camera.lookAt(0, 4, 15);
            }

            if (isPlaying && currentActiveAirplane) {
                let isFighter = fleet[currentSelectionIndex].type === 'fighter';
                let speedMultiplier = keys.space ? (isFighter ? 22.0 : 18.0) : (isFighter ? 14.0 : 11.0);
                
                currentSpeed += (speedMultiplier - currentSpeed) * 0.04;
                if (engineOsc) engineOsc.frequency.setTargetAtTime(keys.space ? 130 : 75, audioCtx.currentTime, 0.1);

                currentActiveAirplane.position.z -= currentSpeed;

                const currentEnv = getEnvForZ(currentActiveAirplane.position.z);
                document.getElementById('dash-speed').innerText = (currentSpeed * 22).toFixed(0);
                document.getElementById('dash-alt').innerText = Math.max(0, ((currentActiveAirplane.position.y - 2) * 10)).toFixed(0);
                document.getElementById('dash-env').innerText = currentEnv.name;

                scene.background.lerp(new THREE.Color(currentEnv.fogColor), 0.02);
                fog.color.lerp(new THREE.Color(currentEnv.fogColor), 0.02);

                // فيزياء التحكم الثقيلة والمخمدة لامتصاص الخفة الزائدة
                let targetVelY = joyState.y * 1.8; 
                let targetVelX = joyState.x * 2.2; 

                planeVelocity.y += (targetVelY - planeVelocity.y) * 0.06;
                planeVelocity.x += (targetVelX - planeVelocity.x) * 0.06;

                currentActiveAirplane.position.y += planeVelocity.y;
                currentActiveAirplane.position.x += planeVelocity.x;

                if(currentActiveAirplane.position.y < 2) currentActiveAirplane.position.y = 2;
                if(currentActiveAirplane.position.y > 220) currentActiveAirplane.position.y = 220;

                targetRotation.x = joyState.y * -0.25;
                targetRotation.z = joyState.x * -0.5;

                currentActiveAirplane.rotation.x = THREE.MathUtils.lerp(currentActiveAirplane.rotation.x, targetRotation.x, 0.08);
                currentActiveAirplane.rotation.z = THREE.MathUtils.lerp(currentActiveAirplane.rotation.z, targetRotation.z, 0.08);
                currentActiveAirplane.rotation.y = THREE.MathUtils.lerp(currentActiveAirplane.rotation.y, Math.PI + (joyState.x * -0.15), 0.08);

                // تتبع الكاميرا الديناميكي المرن من الخلف
                camera.position.x = THREE.MathUtils.lerp(camera.position.x, currentActiveAirplane.position.x, 0.05);
                camera.position.y = THREE.MathUtils.lerp(camera.position.y, currentActiveAirplane.position.y + 10, 0.05);
                camera.position.z = THREE.MathUtils.lerp(camera.position.z, currentActiveAirplane.position.z + 50, 0.05);
                camera.lookAt(currentActiveAirplane.position.x, currentActiveAirplane.position.y + 2, currentActiveAirplane.position.z - 60);

                // توليد وتدوير قطع الأرض والبيئات بشكل لانهائي
                const leadSegment = terrainSegments[0];
                if (currentActiveAirplane.position.z < leadSegment.zPos - segmentLength) {
                    const oldSegment = terrainSegments.shift();
                    scene.remove(oldSegment.group);
                    
                    segmentIndex++;
                    const newZ = -(segmentIndex + 3) * segmentLength;
                    createTerrainSegment(newZ);
                }

                // فحص الحلقات
                for (let i = rings.length - 1; i >= 0; i--) {
                    const ring = rings[i];
                    const dist = currentActiveAirplane.position.distanceTo(ring.position);

                    if (dist < 28 && Math.abs(currentActiveAirplane.position.z - ring.position.z) < 12) { 
                        scene.remove(ring); rings.splice(i, 1);
                        score += 10; timeLeft += 4;
                        document.getElementById('points').innerText = score; document.getElementById('time-left').innerText = timeLeft;
                        const lowestZ = rings.reduce((min, r) => r.position.z < min ? r.position.z : min, currentActiveAirplane.position.z);
                        createRing(lowestZ - 240);
                    } 
                    else if (ring.position.z > currentActiveAirplane.position.z + 60) {
                        scene.remove(ring); rings.splice(i, 1);
                        const lowestZ = rings.reduce((min, r) => r.position.z < min ? r.position.z : min, currentActiveAirplane.position.z);
                        createRing(lowestZ - 240);
                    }
                }
            }
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
