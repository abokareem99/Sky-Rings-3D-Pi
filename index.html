<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>لعبة الطائرة ثلاثية الأبعاد - Pi Network</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            font-family: Arial, sans-serif; 
            user-select: none; 
            background-color: #87ceeb;
        }
        #score { 
            position: absolute; 
            top: 20px; 
            right: 20px; 
            color: white; 
            font-size: 24px; 
            font-weight: bold; 
            z-index: 10; 
            text-shadow: 2px 2px 4px #000; 
        }
        
        /* واجهة التحكم */
        #ui-container {
            position: absolute;
            bottom: 30px;
            width: 100%;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 10;
            padding: 0 20px;
            box-sizing: border-box;
        }

        /* أزرار الاتجاهات (يسار الشاشة) */
        .dpad {
            display: grid;
            grid-template-columns: repeat(3, 60px);
            grid-template-rows: repeat(3, 60px);
            gap: 5px;
        }
        .dbtn {
            background: rgba(255, 255, 255, 0.6);
            border: 2px solid #333;
            border-radius: 10px;
            font-size: 20px;
            font-weight: bold;
            color: #333;
            cursor: pointer;
        }
        .dbtn:active { background: #fff; }

        /* أزرار السرعة (يمين الشاشة) */
        .speed-controls {
            display: flex;
            gap: 20px;
        }
        .btn { 
            width: 80px; 
            height: 80px; 
            border-radius: 50%; 
            border: 3px solid #333; 
            font-size: 16px; 
            font-weight: bold; 
            cursor: pointer; 
            color: white;
        }
        #btn-speed { background: rgba(46, 204, 113, 0.8); }
        #btn-brake { background: rgba(231, 76, 60, 0.8); }
        .btn:active { opacity: 0.9; transform: scale(0.95); }

        /* زر بدء اللعب */
        #start-btn { 
            position: absolute; 
            top: 50%; 
            left: 50%; 
            transform: translate(-50%, -50%); 
            padding: 15px 30px; 
            font-size: 20px; 
            font-weight: bold; 
            background: #2ecc71; 
            color: white; 
            border: none; 
            border-radius: 8px; 
            z-index: 20; 
            cursor: pointer; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://sdk.minepi.com/pi-sdk.js"></script>
</head>
<body>

    <div id="score">النقاط: <span id="points">0</span></div>
    <button id="start-btn" onclick="startGame()">إقلاع وبدء اللعب</button>

    <div id="ui-container">
        <div class="dpad">
            <td></td>
            <button class="dbtn" id="up">▲</button>
            <td></td>
            <button class="dbtn" id="left">◀</button>
            <td></td>
            <button class="dbtn" id="right">▶</button>
            <td></td>
            <button class="dbtn" id="down">▼</button>
            <td></td>
        </div>

        <div class="speed-controls">
            <button class="btn" id="btn-speed">تسريع</button>
            <button class="btn" id="btn-brake">كبح</button>
        </div>
    </div>

    <script>
        // تهيئة Pi SDK
        try { Pi.init({ version: "2.0", sandbox: true }); } catch (e) {}

        // --- 1. إعداد المشهد ثلاثي الأبعاد ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb); // لون السماء
        scene.fog = new THREE.FogExp2(0x87ceeb, 0.015); // ضباب لإعطاء عمق للمدى

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // الإضاءة
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(20, 40, 20);
        scene.add(dirLight);

        // --- 2. إنشاء مدرج الإقلاع والأرضية ---
        // الأرضية الخضراء الممتدة
        const floorGeo = new THREE.PlaneGeometry(1000, 1000);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x2ecc71 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.position.y = -2;
        scene.add(floor);

        // مدرج الإقلاع (Runway) الرمادي
        const runwayGeo = new THREE.PlaneGeometry(20, 300);
        const runwayMat = new THREE.MeshStandardMaterial({ color: 0x333333 });
        const runway = new THREE.Mesh(runwayGeo, runwayMat);
        runway.rotation.x = -Math.PI / 2;
        runway.position.set(0, -1.99, -100); // ممتد للأمام
        scene.add(runway);

        // خطوط المدرج البيضاء
        for (let i = 0; i > -300; i -= 20) {
            const lineGeo = new THREE.PlaneGeometry(0.5, 5);
            const lineMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
            const line = new THREE.Mesh(lineGeo, lineMat);
            line.rotation.x = -Math.PI / 2;
            line.position.set(0, -1.98, i);
            scene.add(line);
        }

        // --- 3. تصميم الطائرة المركب (جسم + أجنحة + ذيل) ---
        const airplane = new THREE.Group();

        // جسم الطائرة الرئيسي
        const bodyGeo = new THREE.ConeGeometry(0.4, 2.5, 8);
        bodyGeo.rotateX(Math.PI / 2);
        const bodyMat = new THREE.MeshStandardMaterial({ color: 0xd35400 }); // لون برتقالي غامق
        const bodyMesh = new THREE.Mesh(bodyGeo, bodyMat);
        airplane.add(bodyMesh);

        // الأجنحة الرئيسية
        const wingGeo = new THREE.BoxGeometry(4, 0.1, 0.6);
        const wingMat = new THREE.MeshStandardMaterial({ color: 0xc0392b }); // أجنحة حمراء
        const wingMesh = new THREE.Mesh(wingGeo, wingMat);
        wingMesh.position.set(0, 0, -0.2);
        airplane.add(wingMesh);

        // الذيل الخلفي
        const tailGeo = new THREE.BoxGeometry(0.1, 0.8, 0.4);
        const tailMesh = new THREE.Mesh(tailGeo, wingMat);
        tailMesh.position.set(0, 0.4, 1);
        airplane.add(tailMesh);

        airplane.position.set(0, -1.2, 0); // تبدأ واقفة على المدرج
        scene.add(airplane);

        // مجموعات الحلقات (أهداف المرور) في السماء
        const rings = [];
        function createRing(zPos) {
            const ringGeometry = new THREE.TorusGeometry(1.8, 0.2, 8, 24);
            const ringMaterial = new THREE.MeshStandardMaterial({ color: 0xffff00, metalness: 0.5 });
            const ringMesh = new THREE.Mesh(ringGeometry, ringMaterial);
            // توزيع الحلقات بارتفاعات مناسبة في السماء فوق المدرج
            ringMesh.position.set((Math.random() - 0.5) * 20, Math.random() * 15 + 2, zPos);
            scene.add(ringMesh);
            rings.push(ringMesh);
        }
        
        // توليد أول 5 حلقات في طريق الطائرة
        for(let i = 1; i <= 5; i++) {
            createRing(-50 * i);
        }

        // --- 4. متغيرات التحكم والحركة ---
        let speed = 0;
        let maxSpeed = 0.6;
        let points = 0;
        let isPlaying = false;

        // متغيرات التوجيه المدخلة من الأزرار
        let moveLeft = false, moveRight = false, moveUp = false, moveDown = false;
        let accelerating = false, braking = false;

        // ربط أحداث الأزرار (توجيه وحركة)
        const setupControl = (id, pressCallback, releaseCallback) => {
            const el = document.getElementById(id);
            el.addEventListener('touchstart', (e) => { e.preventDefault(); pressCallback(); });
            el.addEventListener('touchend', (e) => { e.preventDefault(); releaseCallback(); });
            el.addEventListener('mousedown', pressCallback);
            el.addEventListener('mouseup', releaseCallback);
        };

        setupControl('left', () => moveLeft = true, () => moveLeft = false);
        setupControl('right', () => moveRight = true, () => moveRight = false);
        setupControl('up', () => moveUp = true, () => moveUp = false);
        setupControl('down', () => moveDown = true, () => moveDown = false);
        setupControl('btn-speed', () => accelerating = true, () => accelerating = false);
        setupControl('btn-brake', () => braking = true, () => braking = false);

        function startGame() {
            document.getElementById('start-btn').style.display = 'none';
            isPlaying = true;
        }

        // --- 5. حلقة التحديث والمحرك الرئيسي للعبة ---
        function animate() {
            requestAnimationFrame(animate);

            if (isPlaying) {
                // نظام السرعة (الإقلاع)
                if (accelerating) speed = Math.min(speed + 0.004, maxSpeed);
                if (braking) speed = Math.max(speed - 0.008, 0);

                // تحريك الطائرة للأمام بشكل مستمر بناءً على السرعة الحالية
                airplane.position.z -= speed;

                // التوجيه يميناً ويساراً ولأعلى ولأسفل (فقط إذا كانت الطائرة تتحرك)
                if (speed > 0.02) {
                    if (moveLeft) { 
                        airplane.position.x -= 0.15; 
                        airplane.rotation.z = Math.min(airplane.rotation.z + 0.05, 0.4); // ميلان الطائرة لليسار
                    }
                    if (moveRight) { 
                        airplane.position.x += 0.15; 
                        airplane.rotation.z = Math.max(airplane.rotation.z - 0.05, -0.4); // ميلان الطائرة لليمين
                    }
                    // إرجاع الطائرة لوضعها الأفقي عند ترك أزرار اليمين واليسار
                    if (!moveLeft && !moveRight) airplane.rotation.z *= 0.9;

                    if (moveUp) {
                        // الصعود لأعلى (فقط إذا تخطت سرعة معينة للإقلاع من المدرج)
                        if(airplane.position.y < 25) airplane.position.y += 0.12;
                        airplane.rotation.x = Math.max(airplane.rotation.x - 0.03, -0.2);
                    }
                    if (moveDown) {
                        // الهبوط لأسفل ومنع الغوص تحت الأرض
                        if(airplane.position.y > -1.2) airplane.position.y -= 0.12;
                        airplane.rotation.x = Math.min(airplane.rotation.x + 0.03, 0.2);
                    }
                    if (!moveUp && !moveDown) airplane.rotation.x *= 0.9;
                }

                // الكاميرا تلحق الطائرة من الخلف بسلاسة وثبات
                camera.position.z = airplane.position.z + 6;
                camera.position.x = THREE.MathUtils.lerp(camera.position.x, airplane.position.x, 0.1);
                camera.position.y = THREE.MathUtils.lerp(camera.position.y, airplane.position.y + 1.8, 0.1);
                camera.lookAt(new THREE.Vector3(airplane.position.x, airplane.position.y + 0.5, airplane.position.z - 5));

                // فحص التصادم والمرور داخل الحلقات
                rings.forEach((ring) => {
                    let distance = airplane.position.distanceTo(ring.position);
                    // إذا مرت الطائرة بدقة داخل حدود الحلقة
                    if (distance < 2.2 && Math.abs(airplane.position.z - ring.position.z) < 0.4) {
                        points += 10;
                        document.getElementById('points').innerText = points;
                        
                        // نقل الحلقة وتوليدها من جديد في مكان أبعد بالأمام
                        ring.position.z -= 200;
                        ring.position.x = airplane.position.x + (Math.random() - 0.5) * 25;
                        ring.position.y = Math.max(Math.random() * 15, 0);
                    }

                    // إعادة توليد الحلقة إذا تجاوزها اللاعب دون المرور بها لكي لا تنتهي الحلقات
                    if (airplane.position.z < ring.position.z - 10) {
                        ring.position.z -= 200;
                        ring.position.x = airplane.position.x + (Math.random() - 0.5) * 25;
                        ring.position.y = Math.max(Math.random() * 15, 0);
                    }
                });
            }

            renderer.render(scene, camera);
        }

        // ضبط الشاشة عند تغيير أبعاد الهاتف
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
