<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة الطائرة ثلاثية الأبعاد - نسخة المتصفح والسيرفر</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: Arial, sans-serif; background-color: #87ceeb; user-select: none; }
        #info-panel { position: absolute; top: 20px; left: 20px; background: rgba(0,0,0,0.7); color: white; padding: 15px; border-radius: 8px; font-size: 16px; line-height: 1.6; z-index: 10; direction: ltr; text-align: left; }
        #top-bar { position: absolute; top: 20px; right: 20px; color: white; font-size: 24px; font-weight: bold; text-shadow: 2px 2px 4px #000; z-index: 10; }
        #loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; font-size: 24px; font-weight: bold; text-shadow: 2px 2px 5px #000; z-index: 20; }
        #start-mask { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); z-index: 15; display: flex; justify-content: center; align-items: center; }
        #start-btn { padding: 15px 40px; font-size: 22px; font-weight: bold; background: #2ecc71; color: white; border: none; border-radius: 8px; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

    <div id="info-panel">
        <strong>التحكم في الطائرة (Keyboard Controls):</strong><br>
        • W / S : توجيه لأعلى ولأسفل (Pitch)<br>
        • A / D : دوران وميلان لليمين واليسار (Roll)<br>
        • Space (المسطرة) : تسريع نفاث (Boost)<br>
        <span id="console-log" style="color: #2ecc71;">الحالة: جاري الاتصال بالسيرفر...</span>
    </div>

    <div id="top-bar">النقاط: <span id="points">0</span></div>
    <div id="loading">جاري جلب وتحميل مجسم الطائرة 3D من السيرفر...</div>
    
    <div id="start-mask" style="display:none;">
        <button id="start-btn" onclick="startGame()">إقلاع وبدء الطيران ✈️</button>
    </div>

    <script>
        function logStatus(msg, isError = false) {
            const el = document.getElementById('console-log');
            el.innerText = "الحالة: " + msg;
            el.style.color = isError ? "#e74c3c" : "#2ecc71";
            console.log(msg);
        }

        // 1. إعداد المشهد والبيئة
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb);
        scene.fog = new THREE.FogExp2(0x87ceeb, 0.0015);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.outputEncoding = THREE.sRGBEncoding; // لتظهر ألوان المجسم الحقيقية بشكل صحيح
        document.body.appendChild(renderer.domElement);

        // إضاءة قوية متوازنة
        scene.add(new THREE.AmbientLight(0xffffff, 0.8));
        const sunLight = new THREE.DirectionalLight(0xffffff, 1.2);
        sunLight.position.set(100, 200, 100);
        scene.add(sunLight);

        // 2. إدارة حركة الكيبورد للكمبيوتر
        let airplane = null;
        let isPlaying = false;
        let score = 0;
        let currentSpeed = 1.8;
        const rings = [];
        const keys = { w: false, s: false, a: false, d: false, space: false };

        window.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();
            if(key === ' ') keys.space = true;
            if(key in keys) keys[key] = true;
        });
        window.addEventListener('keyup', (e) => {
            const key = e.key.toLowerCase();
            if(key === ' ') keys.space = false;
            if(key in keys) keys[key] = false;
        });

        // 3. استدعاء الطائرة بمسار مباشر متوافق مع Vercel
        logStatus("جاري تحميل ملف airplane.glb...");
        const loader = new THREE.GLTFLoader();
        
        // المسار النسبي المباشر الذي يقرأ الملف المرفوع بجانبه تماماً
        loader.load('./airplane.glb', 
            (gltf) => {
                airplane = gltf.scene;
                
                // ضبط الحجم والزاوية المناسبة للمجسم ثلاثي الأبعاد
                airplane.scale.set(1.5, 1.5, 1.5);
                airplane.position.set(0, 0, 0);
                airplane.rotation.set(0, Math.PI, 0); // توجيه مقدمة الطائرة للأمام نحو الحلقات
                
                scene.add(airplane);
                
                document.getElementById('loading').style.display = 'none';
                document.getElementById('start-mask').style.display = 'flex';
                logStatus("تم تحميل الطائرة الـ 3D بنجاح من السيرفر!");

                // تثبيت الكاميرا خلف الطائرة بمسافة ممتازة لرؤيتها بوضوح
                camera.position.set(0, 6, 22);
                camera.lookAt(airplane.position);
            },
            undefined,
            (error) => {
                logStatus("خطأ: لم يتم العثور على ملف airplane.glb بالسيرفر! تأكد من الاسم والرفع.", true);
                document.getElementById('loading').innerText = "خطأ في قراءة ملف المجسم ثلاثي الأبعاد";
                console.error(error);
            }
        );

        // 4. بناء بيئة الحلقات الذهبية
        function createRing(zPos) {
            const geometry = new THREE.TorusGeometry(9, 0.7, 16, 50);
            const material = new THREE.MeshStandardMaterial({ color: 0xffd700, metalness: 0.8, roughness: 0.2 });
            const ring = new THREE.Mesh(geometry, material);
            
            ring.position.set(
                (Math.random() - 0.5) * 120,
                (Math.random() - 0.5) * 80,
                zPos
            );
            scene.add(ring);
            rings.push(ring);
        }

        for (let i = 1; i <= 25; i++) {
            createRing(-i * 140);
        }

        function startGame() {
            document.getElementById('start-mask').style.display = 'none';
            isPlaying = true;
            logStatus("بدأ الطيران! تحكم باستخدام أزرار الكيبورد.");
        }

        // 5. حلقة التحديث والمحاكاة المستمرة
        function animate() {
            requestAnimationFrame(animate);

            if (isPlaying && airplane) {
                // التحكم بالسرعة
                const targetSpeed = keys.space ? 4.0 : 1.8;
                currentSpeed += (targetSpeed - currentSpeed) * 0.1;

                // تحريك الطائرة بناءً على ضغطات أزرار الكيبورد
                if (keys.w) airplane.position.y += 0.35; 
                if (keys.s) airplane.position.y -= 0.35; 
                if (keys.a) { 
                    airplane.position.x -= 0.45; 
                    airplane.rotation.z = THREE.MathUtils.lerp(airplane.rotation.z, 0.4, 0.1); 
                }
                if (keys.d) { 
                    airplane.position.x += 0.45; 
                    airplane.rotation.z = THREE.MathUtils.lerp(airplane.rotation.z, -0.4, 0.1); 
                }

                // العودة للوضع الأفقي تلقائياً
                if (!keys.a && !keys.d) {
                    airplane.rotation.z = THREE.MathUtils.lerp(airplane.rotation.z, 0, 0.1);
                }

                // التقدم المستمر للأمام نحو الحلقات (-Z)
                airplane.position.z -= currentSpeed;

                // تتبع مرن وسلس للكاميرا خلف مجسم الطائرة
                camera.position.x = THREE.MathUtils.lerp(camera.position.x, airplane.position.x, 0.1);
                camera.position.y = THREE.MathUtils.lerp(camera.position.y, airplane.position.y + 4.5, 0.1);
                camera.position.z = airplane.position.z + 22;
                camera.lookAt(new THREE.Vector3(airplane.position.x, airplane.position.y + 1, airplane.position.z - 20));

                // التحقق من جمع الحلقات وتحديث النقاط
                for (let i = rings.length - 1; i >= 0; i--) {
                    const ring = rings[i];
                    const dist = airplane.position.distanceTo(ring.position);

                    if (dist < 13 && Math.abs(airplane.position.z - ring.position.z) < 6) {
                        scene.remove(ring);
                        rings.splice(i, 1);
                        score += 10;
                        document.getElementById('points').innerText = score;
                        
                        const lowestZ = rings.reduce((min, r) => r.position.z < min ? r.position.z : min, airplane.position.z);
                        createRing(lowestZ - 140);
                    }
                    else if (airplane.position.z < ring.position.z - 40) {
                        scene.remove(ring);
                        rings.splice(i, 1);
                        const lowestZ = rings.reduce((min, r) => r.position.z < min ? r.position.z : min, airplane.position.z);
                        createRing(lowestZ - 140);
                    }
                }
            }

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
