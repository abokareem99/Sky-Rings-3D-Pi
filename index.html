<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محاكي الطيران الاحترافي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-green: #00ff66;
            --neon-blue: #00d2ff;
            --neon-orange: #ff9f43;
            --panel-bg: rgba(6, 11, 25, 0.75);
            --panel-border: rgba(0, 210, 255, 0.15);
        }

        body { 
            margin: 0; overflow: hidden; 
            font-family: 'Cairo', sans-serif; 
            background-color: #02050c; 
            user-select: none; -webkit-user-select: none;
        }
        
        /* شريط الحالة العلوي أثناء اللعب */
        #top-nav-hud {
            position: absolute; top: 15px; left: 15px; right: 15px;
            display: none; justify-content: space-between; z-index: 10; pointer-events: none;
        }
        .hud-ticker {
            background: var(--panel-bg); border: 1px solid var(--panel-border);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            border-radius: 6px; padding: 6px 12px; color: #ffffff;
            font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 6px;
        }
        #hud-points { color: #ffd32a; }
        #hud-time { color: #ff4757; }

        /* شريط الأجهزة السفلي (الرادار والعدادات) */
        #bottom-instrument-dash {
            position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 500px; height: 70px;
            background: var(--panel-bg); border: 1px solid var(--panel-border);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            border-radius: 12px; z-index: 12; display: none;
            grid-template-columns: 1fr 80px 1fr; align-items: center; padding: 0 15px; box-sizing: border-box;
        }
        .dash-sector { display: flex; flex-direction: column; justify-content: center; gap: 4px; }
        .sector-left { text-align: right; border-left: 1px solid rgba(0, 210, 255, 0.1); padding-left: 10px; }
        .sector-right { text-align: left; border-right: 1px solid rgba(0, 210, 255, 0.1); padding-right: 10px; }
        .instrument-readout { font-size: 11px; color: #8fa0b5; font-weight: 700; display: flex; justify-content: space-between; }
        .instrument-readout span:last-child { color: var(--neon-green); font-family: monospace; font-size: 13px; }

        /* الرادار الدائري */
        .radar-core {
            width: 60px; height: 60px; border: 2px solid var(--neon-green); border-radius: 50%;
            margin: 0 auto; position: relative; background: rgba(0, 255, 102, 0.05);
            display: flex; align-items: center; justify-content: center; box-shadow: 0 0 15px rgba(0, 255, 102, 0.2);
        }
        .radar-sweep {
            position: absolute; width: 100%; height: 100%; border-radius: 50%;
            background: conic-gradient(from 0deg, rgba(0,255,102,0.2) 0deg, transparent 90deg);
            animation: radar-rotate 2s linear infinite;
        }
        @keyframes radar-rotate { from { transform: rotate(0deg); } to { transform: rotate(-360deg); } }

        /* الشاشة الرئيسية الشفافة */
        #start-menu-ui {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 15; display: flex; flex-direction: column; justify-content: space-between;
            padding: 40px 20px 20px 20px; box-sizing: border-box;
            background: radial-gradient(circle at top, rgba(0,0,0,0.0) 0%, rgba(0,0,0,0.5) 100%);
            pointer-events: none;
        }
        .menu-top { display: flex; justify-content: space-between; align-items: flex-start; pointer-events: auto; }
        .main-title { font-size: 2.2rem; font-weight: 900; margin: 0; color: #ffffff; text-shadow: 0 4px 15px rgba(0, 0, 0, 0.8); line-height: 1.1; }
        .balance-box { background: rgba(0,0,0,0.6); border: 1px solid var(--neon-green); padding: 8px 15px; border-radius: 8px; color: #fff; font-weight: 700; font-size: 14px; backdrop-filter: blur(5px); }

        .menu-bottom { display: flex; flex-direction: column; align-items: center; width: 100%; pointer-events: auto; }
        
        /* قائمة الطائرات المنزلقة (متجر الطائرات السفلي) */
        .fleet-slider {
            display: flex; overflow-x: auto; gap: 12px; width: 100%; max-width: 600px;
            padding: 12px; background: rgba(6, 11, 25, 0.85); border: 1px solid var(--panel-border);
            border-radius: 12px; backdrop-filter: blur(8px); margin-bottom: 20px; box-sizing: border-box;
            direction: rtl;
        }
        .fleet-slider::-webkit-scrollbar { height: 6px; }
        .fleet-slider::-webkit-scrollbar-thumb { background: var(--neon-blue); border-radius: 3px; }
        
        .plane-card {
            flex: 0 0 auto; width: 130px; background: rgba(255, 255, 255, 0.03);
            border: 2px solid rgba(255, 255, 255, 0.1); border-radius: 8px;
            padding: 12px 8px; text-align: center; cursor: pointer; transition: 0.2s;
        }
        .plane-card.active { border-color: var(--neon-green); background: rgba(0, 255, 102, 0.12); box-shadow: 0 0 12px rgba(0, 255, 102, 0.3); }
        .plane-card h4 { margin: 0 0 8px 0; font-size: 12px; color: #fff; line-height: 1.3; font-weight: 700; }
        .plane-price { font-size: 13px; font-weight: 900; }

        .start-btn { 
            padding: 14px 70px; font-size: 18px; font-family: 'Cairo', sans-serif; font-weight: 900; 
            background: linear-gradient(90deg, #00d2ff, #0056b3); color: white; border: none; 
            border-radius: 30px; cursor: pointer; box-shadow: 0 5px 20px rgba(0, 210, 255, 0.4); 
            transition: transform 0.2s;
        }
        .start-btn:hover { transform: scale(1.05); }
        .start-btn:disabled { background: #3d434e; color: #888; cursor: not-allowed; box-shadow: none; }

        #loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: var(--neon-blue); font-size: 15px; font-weight: 800; z-index: 20; }

        /* شاشة النهاية */
        #gameover-mask {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); backdrop-filter: blur(10px); z-index: 25;
            display: none; flex-direction: column; justify-content: center; align-items: center;
        }

        /* أدوات اللمس */
        #touch-controls { display: none; }
        #joystick-zone {
            position: absolute; bottom: 100px; left: 30px; width: 100px; height: 100px;
            background: rgba(0, 210, 255, 0.05); border: 2px solid rgba(0, 210, 255, 0.3); border-radius: 50%; z-index: 100;
        }
        #joystick-knob {
            position: absolute; top: 35px; left: 35px; width: 30px; height: 30px;
            background: var(--neon-blue); border-radius: 50%; box-shadow: 0 0 15px var(--neon-blue); pointer-events: none;
        }
        #speed-btn {
            position: absolute; bottom: 100px; right: 30px; width: 75px; height: 75px;
            background: rgba(255, 71, 87, 0.15); border: 2px solid rgba(255, 71, 87, 0.6);
            border-radius: 50%; color: #ff4757; font-weight: 800; font-size: 15px;
            display: flex; justify-content: center; align-items: center; z-index: 100;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

    <div id="start-menu-ui" style="display:none;">
        <div class="menu-top">
            <h1 class="main-title">محاكي الطيران<br><span style="color:var(--neon-blue); font-size: 1.5rem;">المتقدم</span></h1>
            <div class="balance-box">🪙 <span id="menu-total-points">0</span></div>
        </div>
        
        <div class="menu-bottom">
            <div class="fleet-slider" id="fleet-slider"></div>
            
            <button id="start-btn" class="start-btn" onclick="startGame()">إقلاع للطيران 🛫</button>
        </div>
    </div>

    <div id="top-nav-hud">
        <div id="hud-time" class="hud-ticker">⏱️ <span id="time-left">30</span>ث</div>
        <div id="hud-points" class="hud-ticker">🪙 <span id="points">0</span></div>
    </div>
    
    <div id="bottom-instrument-dash">
        <div class="dash-sector sector-left">
            <div class="instrument-readout"><span>السرعة</span><span id="dash-speed">0</span></div>
            <div class="instrument-readout"><span>المحرك</span><span id="dash-engine" style="color:var(--neon-blue)">READY</span></div>
        </div>
        <div class="radar-core"><div class="radar-sweep"></div></div>
        <div class="dash-sector sector-right">
            <div class="instrument-readout"><span>الارتفاع</span><span id="dash-alt">0</span></div>
            <div class="instrument-readout"><span>الوضع</span><span style="color:var(--neon-orange)">AUTO</span></div>
        </div>
    </div>
    
    <div id="touch-controls">
        <div id="joystick-zone"><div id="joystick-knob"></div></div>
        <div id="speed-btn">تيربو 🚀</div>
    </div>

    <div id="loading">جاري تحميل المدرج والطائرات...</div>
    
    <div id="gameover-mask">
        <h1 style="color: #ff4757; font-size: 2.5rem; margin:0 0 20px 0;">انتهت الجولة</h1>
        <div style="background: rgba(0,0,0,0.8); border: 2px solid var(--neon-green); padding: 15px 40px; border-radius: 12px; margin-bottom: 30px;">
            <span style="font-size: 18px; color: #fff;">النقاط المكتسبة: <span id="final-score" style="color:#ffd32a; font-size: 24px; font-weight:900;">0</span></span>
        </div>
        <button class="start-btn" style="background: var(--neon-green); color: #000; box-shadow: none;" onclick="restartGame()">العودة للحظيرة</button>
    </div>

    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x60a3bc); 
        const fog = new THREE.FogExp2(0x60a3bc, 0.0004);
        scene.fog = fog;

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 4000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.7));
        const sunLight = new THREE.DirectionalLight(0xffffff, 1.0);
        sunLight.position.set(200, 500, 200);
        scene.add(sunLight);

        let totalPoints = parseInt(localStorage.getItem('flight_totalPoints')) || 0;
        document.getElementById('menu-total-points').innerText = totalPoints;

        let basePassengerModel = null; 
        let baseFighterModel = null;     
        let currentActiveAirplane = null; 
        
        let isPlaying = false;
        let score = 0; let timeLeft = 30; let currentSpeed = 0; 
        let timerInterval = null;
        const rings = [];
        const keys = { w: false, s: false, a: false, d: false, space: false };
        const joyState = { x: 0, y: 0, active: false };

        // أسطول الطائرات المعروضة للشراء بالنقاط
        const fleet = [
            { id: 0, type: 'passenger', name: 'ركاب كلاسيك بيضاء', unlockCost: 0, colorHex: null },
            { id: 1, type: 'passenger', name: 'ركاب الجناح الأحمر', unlockCost: 30, colorHex: 0xff3333 },
            { id: 2, type: 'passenger', name: 'الصقر الأزرق النفاث', unlockCost: 60, colorHex: 0x3366ff },
            { id: 3, type: 'passenger', name: 'زمردة الأجواء الخضراء', unlockCost: 100, colorHex: 0x2ecc71 },
            { id: 4, type: 'fighter', name: 'مقاتلة الاعتراض F16', unlockCost: 200, colorHex: null },
            { id: 5, type: 'fighter', name: 'شبح التخفي السوداء', unlockCost: 280, colorHex: 0x111111 }
        ];
        let currentSelectionIndex = 0;

        let audioCtx, engineOsc, engineGain;
        function initEngineSound() {
            if (audioCtx) return;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            engineOsc = audioCtx.createOscillator();
            let filter = audioCtx.createBiquadFilter(); engineGain = audioCtx.createGain();
            engineOsc.type = 'sawtooth'; engineOsc.frequency.setValueAtTime(55, audioCtx.currentTime); 
            filter.type = 'lowpass'; filter.frequency.setValueAtTime(250, audioCtx.currentTime);
            engineGain.gain.setValueAtTime(0.15, audioCtx.currentTime);
            engineOsc.connect(filter); filter.connect(engineGain); engineGain.connect(audioCtx.destination);
            engineOsc.start();
        }

        const terrainGroup = new THREE.Group(); scene.add(terrainGroup);
        function createTerrainSegment(zPos, isRunway = false) {
            const geometry = new THREE.PlaneGeometry(1500, 1000, 8, 8);
            const terrain = new THREE.Mesh(geometry, new THREE.MeshStandardMaterial({ color: 0x3ea055, roughness: 0.9 })); 
            terrain.rotation.x = -Math.PI / 2; terrain.position.set(0, -10, zPos); terrainGroup.add(terrain);

            if (isRunway) {
                const runway = new THREE.Mesh(new THREE.PlaneGeometry(100, 1000), new THREE.MeshStandardMaterial({ color: 0x2d3436, roughness: 0.7 }));
                runway.rotation.x = -Math.PI / 2; runway.position.set(0, -9.8, zPos); scene.add(runway);
                const lines = new THREE.Mesh(new THREE.PlaneGeometry(5, 1000), new THREE.MeshBasicMaterial({color: 0xffffff}));
                lines.rotation.x = -Math.PI / 2; lines.position.set(0, -9.7, zPos); scene.add(lines);
            }
        }
        createTerrainSegment(0, true); createTerrainSegment(-1000, true); createTerrainSegment(-2000, true); createTerrainSegment(-3000, true);

        // الحاوية البرمجية لضمان توجيه الطائرة الصحيح للأمام (-Z)
        function wrapModelForward(modelMesh, scale) {
            const group = new THREE.Group();
            modelMesh.rotation.y = Math.PI; // تم تعديلها إلى Math.PI لقلب المجسم 180 درجة ليواجه الأمام دائماً
            group.add(modelMesh);
            group.scale.set(scale, scale, scale);
            return group;
        }

        function buildMockPassenger() {
            const body = new THREE.Mesh(new THREE.CylinderGeometry(1.8, 1.8, 16, 8), new THREE.MeshStandardMaterial({color: 0xffffff}));
            body.rotation.x = Math.PI / 2; 
            return wrapModelForward(body, 3.5);
        }
        function buildMockFighter() {
            const body = new THREE.Mesh(new THREE.ConeGeometry(2.2, 15, 4), new THREE.MeshStandardMaterial({color: 0x2c3e50}));
            body.rotation.x = Math.PI / 2; 
            return wrapModelForward(body, 3.5);
        }

        const loader = new THREE.GLTFLoader();
        loader.load('airplane.glb', (gltf) => { basePassengerModel = wrapModelForward(gltf.scene, 3.8); checkInit(); }, undefined, () => { basePassengerModel = buildMockPassenger(); checkInit(); });
        loader.load('Fighter.glb.glb', (gltf) => { baseFighterModel = wrapModelForward(gltf.scene, 3.8); checkInit(); }, undefined, () => { baseFighterModel = buildMockFighter(); checkInit(); });

        let loadedModels = 0;
        function checkInit() {
            loadedModels++;
            if(loadedModels >= 2) { 
                document.getElementById('loading').style.display = 'none';
                document.getElementById('start-menu-ui').style.display = 'flex';
                buildFleetUI();
                updateShopUI();
                positionCameraForMenu();
            }
        }

        // إنشاء وعرض كروت الطائرات
        function buildFleetUI() {
            const slider = document.getElementById('fleet-slider');
            slider.innerHTML = '';
            fleet.forEach((plane, index) => {
                const card = document.createElement('div');
                card.className = 'plane-card' + (index === currentSelectionIndex ? ' active' : '');
                card.onclick = () => selectPlane(index);
                
                const isUnlocked = totalPoints >= plane.unlockCost;
                const priceHtml = isUnlocked 
                    ? `<div class="plane-price" style="color:var(--neon-green)">✔️ ممتلكة</div>`
                    : `<div class="plane-price" style="color:#ff4757">🔒 ${plane.unlockCost} 🪙</div>`;
                    
                card.innerHTML = `<h4>${plane.name}</h4>${priceHtml}`;
                slider.appendChild(card);
            });
        }

        function selectPlane(index) {
            currentSelectionIndex = index;
            buildFleetUI();
            updateShopUI();
        }

        function updateShopUI() {
            const planeData = fleet[currentSelectionIndex];
            const startBtn = document.getElementById('start-btn');

            if (totalPoints >= planeData.unlockCost) {
                startBtn.disabled = false;
                startBtn.style.background = "linear-gradient(90deg, #00d2ff, #0056b3)";
                startBtn.innerText = "إقلاع للطيران 🛫";
            } else {
                startBtn.disabled = true;
                startBtn.style.background = "#3d434e";
                startBtn.innerText = "رصيد غير كافٍ 🔒";
            }
            renderPlaneInMenu(planeData);
        }

        function renderPlaneInMenu(planeData) {
            if (currentActiveAirplane) scene.remove(currentActiveAirplane);
            let baseModel = planeData.type === 'passenger' ? basePassengerModel : baseFighterModel;
            if (!baseModel) return;
            currentActiveAirplane = baseModel.clone();

            if (planeData.colorHex !== null) {
                currentActiveAirplane.traverse(c => {
                    if (c.isMesh && c.material) { c.material = c.material.clone(); c.material.color.setHex(planeData.colorHex); }
                });
            }
            currentActiveAirplane.position.set(0, -5, 0); 
            scene.add(currentActiveAirplane);
        }

        // وضع الكاميرا في شاشة القائمة لاستعراض المقدمة
        function positionCameraForMenu() {
            camera.position.set(25, 5, -35);
            camera.lookAt(0, -2, 0);
        }

        function createRing(zPos) {
            const geometry = new THREE.TorusGeometry(15, 1.5, 10, 24);
            const ring = new THREE.Mesh(geometry, new THREE.MeshStandardMaterial({ color: 0xffd700, emissive: 0xffb300, emissiveIntensity: 0.4 }));
            ring.position.set((Math.random() - 0.5) * 150, Math.random() * 60 + 20, zPos);
            scene.add(ring); rings.push(ring);
        }

        const joyZone = document.getElementById('joystick-zone');
        const joyKnob = document.getElementById('joystick-knob');
        let joyCenter = { x: 0, y: 0 };
        function handleTouchMove(e) {
            e.preventDefault(); if(!joyState.active) return;
            const touch = e.touches[0];
            let dx = touch.clientX - joyCenter.x; let dy = touch.clientY - joyCenter.y;
            let dist = Math.sqrt(dx*dx + dy*dy);
            if(dist > 35) { dx = (dx / dist) * 35; dy = (dy / dist) * 35; }
            joyKnob.style.transform = `translate(${dx}px, ${dy}px)`;
            joyState.x = dx / 35; joyState.y = dy / 35; 
        }
        joyZone.addEventListener('touchstart', (e) => {
            e.preventDefault(); joyState.active = true;
            const rect = joyZone.getBoundingClientRect(); joyCenter = { x: rect.left + rect.width/2, y: rect.top + rect.height/2 }; handleTouchMove(e);
        }, {passive: false});
        joyZone.addEventListener('touchmove', handleTouchMove, {passive: false});
        joyZone.addEventListener('touchend', (e) => {
            e.preventDefault(); joyState.active = false; joyState.x = 0; joyState.y = 0; joyKnob.style.transform = `translate(0px, 0px)`;
        });
        const speedBtn = document.getElementById('speed-btn');
        speedBtn.addEventListener('touchstart', (e) => { e.preventDefault(); keys.space = true; }, {passive: false});
        speedBtn.addEventListener('touchend', (e) => { e.preventDefault(); keys.space = false; });

        function startGame() {
            document.getElementById('start-menu-ui').style.display = 'none';
            document.getElementById('top-nav-hud').style.display = 'flex';
            document.getElementById('bottom-instrument-dash').style.display = 'grid'; 
            document.getElementById('touch-controls').style.display = 'block'; 
            
            initEngineSound();
            if(audioCtx) engineGain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            
            rings.forEach(r => scene.remove(r)); rings.length = 0;
            for (let i = 1; i <= 20; i++) { createRing(currentActiveAirplane.position.z - (i * 200)); }

            isPlaying = true; score = 0; document.getElementById('points').innerText = score;
            timeLeft = 30; document.getElementById('time-left').innerText = timeLeft;
            
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if(isPlaying) {
                    timeLeft--; document.getElementById('time-left').innerText = timeLeft;
                    if(timeLeft <= 0) { endGame(); }
                }
            }, 1000);
        }

        function endGame() {
            isPlaying = false; 
            if(audioCtx) engineGain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.1); 
            clearInterval(timerInterval);
            
            document.getElementById('touch-controls').style.display = 'none';
            document.getElementById('top-nav-hud').style.display = 'none';
            document.getElementById('bottom-instrument-dash').style.display = 'none';
            
            totalPoints += score;
            localStorage.setItem('flight_totalPoints', totalPoints);
            document.getElementById('menu-total-points').innerText = totalPoints;
            document.getElementById('final-score').innerText = score;
            document.getElementById('gameover-mask').style.display = 'flex';
        }

        function restartGame() {
            document.getElementById('gameover-mask').style.display = 'none';
            currentSpeed = 0; 
            updateShopUI(); 
            positionCameraForMenu();
            buildFleetUI();
            document.getElementById('start-menu-ui').style.display = 'flex';
        }

        let lastTerrainZ = -3000;

        function animate() {
            requestAnimationFrame(animate);

            // استعراض الكاميرا حول الطائرة في شاشة القائمة بشكل متناسق مع الاتجاه الجديد
            if (!isPlaying && currentActiveAirplane) {
                camera.position.x = Math.sin(Date.now() * 0.0004) * 25;
                camera.position.z = -32 + Math.cos(Date.now() * 0.0004) * 12;
                camera.position.y = 5 + Math.sin(Date.now() * 0.0005) * 1.5;
                camera.lookAt(0, -3, 0);
            }

            // طور اللعب الفعلي للأمام
            if (isPlaying && currentActiveAirplane) {
                let isFighter = fleet[currentSelectionIndex].type === 'fighter';
                let speedMultiplier = keys.space ? (isFighter ? 20.0 : 16.0) : (isFighter ? 12.0 : 9.0);
                
                currentSpeed += (speedMultiplier - currentSpeed) * 0.05;
                if (engineOsc) engineOsc.frequency.setTargetAtTime(keys.space ? 120 : 70, audioCtx.currentTime, 0.1);

                // الطائرة تطير للأمام باتجاه عمق المحاكاة بشكل ممتاز
                currentActiveAirplane.position.z -= currentSpeed;

                document.getElementById('dash-speed').innerText = (currentSpeed * 22).toFixed(0);
                document.getElementById('dash-alt').innerText = Math.max(0, ((currentActiveAirplane.position.y + 5) * 10)).toFixed(0);
                document.getElementById('dash-engine').innerText = keys.space ? "BOOST" : "CRUISE";

                let inputY = joyState.y; let inputX = joyState.x;

                currentActiveAirplane.position.y += 2.0 * inputY; 
                currentActiveAirplane.position.x += 2.5 * inputX; 

                if(currentActiveAirplane.position.y < -5) currentActiveAirplane.position.y = -5;
                if(currentActiveAirplane.position.y > 200) currentActiveAirplane.position.y = 200;

                // تم تعديل إشارة الدوران حول محور X (inputY * -0.3) لتتناسب مع الاتجاه الأمامي المعدل للطائرة
                currentActiveAirplane.rotation.x = THREE.MathUtils.lerp(currentActiveAirplane.rotation.x, inputY * -0.3, 0.1);
                currentActiveAirplane.rotation.z = THREE.MathUtils.lerp(currentActiveAirplane.rotation.z, -0.6 * inputX, 0.1);

                // ملاحقة وتتبع الكاميرا الخلفية أثناء الطيران
                camera.position.x = THREE.MathUtils.lerp(camera.position.x, currentActiveAirplane.position.x, 0.1);
                camera.position.y = THREE.MathUtils.lerp(camera.position.y, currentActiveAirplane.position.y + 10, 0.1);
                camera.position.z = currentActiveAirplane.position.z + 40; 
                camera.lookAt(currentActiveAirplane.position.x, currentActiveAirplane.position.y, currentActiveAirplane.position.z - 50);

                if (currentActiveAirplane.position.z < lastTerrainZ + 1500) {
                    lastTerrainZ -= 1000; createTerrainSegment(lastTerrainZ, true);
                }

                for (let i = rings.length - 1; i >= 0; i--) {
                    const ring = rings[i];
                    const dist = currentActiveAirplane.position.distanceTo(ring.position);

                    if (dist < 25 && Math.abs(currentActiveAirplane.position.z - ring.position.z) < 10) { 
                        scene.remove(ring); rings.splice(i, 1);
                        score += 10; timeLeft += 4;
                        document.getElementById('points').innerText = score; document.getElementById('time-left').innerText = timeLeft;
                        const lowestZ = rings.reduce((min, r) => r.position.z < min ? r.position.z : min, currentActiveAirplane.position.z);
                        createRing(lowestZ - 200);
                    } 
                    else if (ring.position.z > currentActiveAirplane.position.z + 50) {
                        scene.remove(ring); rings.splice(i, 1);
                        const lowestZ = rings.reduce((min, r) => r.position.z < min ? r.position.z : min, currentActiveAirplane.position.z);
                        createRing(lowestZ - 200);
                    }
                }
            }
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
