<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطوير لعبة الطائرة ثلاثية الأبعاد - نسخة الكمبيوتر</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: Arial, sans-serif; background-color: #87ceeb; user-select: none; }
        #info-panel { position: absolute; top: 20px; left: 20px; background: rgba(0,0,0,0.7); color: white; padding: 15px; border-radius: 8px; font-size: 16px; line-height: 1.6; z-index: 10; direction: ltr; text-align: left; }
        #top-bar { position: absolute; top: 20px; right: 20px; color: white; font-size: 24px; font-weight: bold; text-shadow: 2px 2px 4px #000; z-index: 10; }
        #loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; font-size: 24px; font-weight: bold; text-shadow: 2px 2px 5px #000; z-index: 20; }
        #start-mask { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); z-index: 15; display: flex; justify-content: center; align-items: center; }
        #start-btn { padding: 15px 40px; font-size: 22px; font-weight: bold; background: #2ecc71; color: white; border: none; border-radius: 8px; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

    <div id="info-panel">
        <strong>Controls (التحكم):</strong><br>
        • W / S : Pitch (Up / Down)<br>
        • A / D : Roll (Left / Right)<br>
        • Space : Boost Speed (تسريع)<br>
        <span id="console-log" style="color: #2ecc71;">Status: Initializing...</span>
    </div>

    <div id="top-bar">النقاط: <span id="points">0</span></div>
    <div id="loading">جاري تحميل مجسم الطائرة...</div>
    
    <div id="start-mask" style="display:none;">
        <button id="start-btn" onclick="startGame()">إيقاظ المحرك والبدء</button>
    </div>

    <script>
        // دالة مخصصة لطباعة الحالة في واجهة اللعبة والمراقبة
        function logStatus(msg, isError = false) {
            const el = document.getElementById('console-log');
            el.innerText = "Status: " + msg;
            el.style.color = isError ? "#e74c3c" : "#2ecc71";
            console.log(msg);
        }

        // 1. إعداد المشهد والإضاءة
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb);
        scene.fog = new THREE.FogExp2(0x87ceeb, 0.0015);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // إضاءة محيطية قوية وإضاءة موجهة لإبراز تفاصيل الطائرة الخارجية
        scene.add(new THREE.AmbientLight(0xffffff, 0.9));
        const sunLight = new THREE.DirectionalLight(0xffffff, 1.0);
        sunLight.position.set(100, 200, 100);
        scene.add(sunLight);

        // 2. متغيرات الحركة والمفاتيح
        let airplane = null;
        let isPlaying = false;
        let score = 0;
        let currentSpeed = 2.0;
        const rings = [];
        
        const keys = { w: false, s: false, a: false, d: false, space: false };

        window.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();
            if(key === ' ') keys.space = true;
            if(key in keys) keys[key] = true;
        });
        window.addEventListener('keyup', (e) => {
            const key = e.key.toLowerCase();
            if(key === ' ') keys.space = false;
            if(key in keys) keys[key] = false;
        });

        // 3. تحميل الطائرة بالأبعاد الدقيقة للمجسم الحقيقي المرفوع
        logStatus("Loading airplane.glb...");
        const loader = new THREE.GLTFLoader();
        
        loader.load('airplane.glb', 
            (gltf) => {
                airplane = gltf.scene;
                
                // الأبعاد التلقائية المتوافقة 100% مع حجم ملفك الأصلي دون تكبير مفرط
                airplane.scale.set(1, 1, 1);
                airplane.position.set(0, 0, 0);
                
                // توجيه الطائرة لتنظر بشكل صحيح إلى داخل الحلقات (محور -Z)
                airplane.rotation.set(0, Math.PI, 0);
                
                scene.add(airplane);
                
                document.getElementById('loading').style.display = 'none';
                document.getElementById('start-mask').style.display = 'flex';
                logStatus("Airplane loaded successfully!");

                // الكاميرا خلف الطائرة مباشرة لرؤيتها بوضوح قبل الحركة
                camera.position.set(0, 5, 18);
                camera.lookAt(airplane.position);
            },
            undefined,
            (error) => {
                logStatus("Error reading GLB file! Check CORS or file name.", true);
                document.getElementById('loading').innerText = "خطأ: تأكد من تشغيل الخادم المحلي (Local Server)";
                console.error(error);
            }
        );

        // 4. بناء بيئة الحلقات الذهبية
        function createRing(zPos) {
            const geometry = new THREE.TorusGeometry(8, 0.6, 16, 60);
            const material = new THREE.MeshStandardMaterial({ color: 0xffd700, metalness: 0.7, roughness: 0.2 });
            const ring = new THREE.Mesh(geometry, material);
            
            ring.position.set(
                (Math.random() - 0.5) * 120,
                (Math.random() - 0.5) * 80,
                zPos
            );
            scene.add(ring);
            rings.push(ring);
        }

        // توليد الحلقات في خط مستقيم ممتد للأمام
        for (let i = 1; i <= 30; i++) {
            createRing(-i * 150);
        }

        function startGame() {
            document.getElementById('start-mask').style.display = 'none';
            isPlaying = true;
            logStatus("Flight started. Use W, A, S, D keys.");
        }

        // 5. حلقة المحاكاة والتحكم الرياضي
        function animate() {
            requestAnimationFrame(animate);

            if (isPlaying && airplane) {
                // التحكم بالسرعة
                const targetSpeed = keys.space ? 4.5 : 2.0;
                currentSpeed += (targetSpeed - currentSpeed) * 0.1;

                // تحريك الطائرة ديناميكياً بناءً على الكيبورد
                if (keys.w) airplane.position.y += 0.4; // صعود
                if (keys.s) airplane.position.y -= 0.4; // هبوط
                if (keys.a) { 
                    airplane.position.x -= 0.5; // حركة يسار
                    airplane.rotation.z = THREE.MathUtils.lerp(airplane.rotation.z, 0.4, 0.1); 
                }
                if (keys.d) { 
                    airplane.position.x += 0.5; // حركة يمين
                    airplane.rotation.z = THREE.MathUtils.lerp(airplane.rotation.z, -0.4, 0.1); 
                }

                // إرجاع الطائرة للوضع الأفقي تلقائياً عند ترك الأزرار
                if (!keys.a && !keys.d) {
                    airplane.rotation.z = THREE.MathUtils.lerp(airplane.rotation.z, 0, 0.1);
                }

                // الحركة المستمرة للأمام نحو الحلقات (-Z)
                airplane.position.z -= currentSpeed;

                // تتبع الكاميرا السلس والمرن خلف جسم الطائرة
                camera.position.x = THREE.MathUtils.lerp(camera.position.x, airplane.position.x, 0.1);
                camera.position.y = THREE.MathUtils.lerp(camera.position.y, airplane.position.y + 4, 0.1);
                camera.position.z = airplane.position.z + 18;
                camera.lookAt(new THREE.Vector3(airplane.position.x, airplane.position.y, airplane.position.z - 20));

                // فحص الاصطدامات واحتساب النقاط
                for (let i = rings.length - 1; i >= 0; i--) {
                    const ring = rings[i];
                    const dist = airplane.position.distanceTo(ring.position);

                    if (dist < 12 && Math.abs(airplane.position.z - ring.position.z) < 6) {
                        scene.remove(ring);
                        rings.splice(i, 1);
                        score += 10;
                        document.getElementById('points').innerText = score;
                        
                        // توليد حلقة جديدة في نهاية الطابور
                        const lowestZ = rings.reduce((min, r) => r.position.z < min ? r.position.z : min, airplane.position.z);
                        createRing(lowestZ - 150);
                    }
                    // إزالة الحلقات التي أصبحت خلف الطائرة لتوفير أداء كارت الشاشة
                    else if (airplane.position.z < ring.position.z - 50) {
                        scene.remove(ring);
                        rings.splice(i, 1);
                        const lowestZ = rings.reduce((min, r) => r.position.z < min ? r.position.z : min, airplane.position.z);
                        createRing(lowestZ - 150);
                    }
                }
            }

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
