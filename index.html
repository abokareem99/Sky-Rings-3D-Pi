<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Air Masters - Pi Hangar</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <script src="https://sdk.minepi.com/pi-sdk.js"></script>
    <script>Pi.init({ version: "2.0", sandbox: true });</script>
    
    <style>
        :root {
            /* ألوان باي الرسمية مع تدرجات تقنية */
            --pi-purple: #8a2be2;
            --pi-purple-dark: #4a0d87;
            --pi-gold: #ffd700;
            --pi-gold-dim: #b89b00;
            
            --bg-tech: rgba(10, 5, 20, 0.85);
            --border-tech: 1px solid rgba(138, 43, 226, 0.4);
            --alert-red: #ff4b2b;
            --success-green: #00ff88;
        }

        body { 
            margin: 0;
            overflow: hidden; 
            font-family: 'Share Tech Mono', monospace; 
            background-color: #05020a; 
            user-select: none;
            -webkit-user-select: none;
            color: #fff;
        }

        /* تأثير الشاشة التكتيكية (Scanlines) */
        .scanlines {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.15) 50%, rgba(0,0,0,0.15));
            background-size: 100% 4px;
            z-index: 999; pointer-events: none; opacity: 0.5;
        }
        
        #hud-container {
            position: absolute; top: 70px; left: 20px; right: 20px;
            display: flex; justify-content: space-between; z-index: 10; pointer-events: none;
        }

        /* اللوحات الزجاجية التقنية */
        .tech-panel {
            background: linear-gradient(135deg, rgba(15, 10, 25, 0.9) 0%, rgba(25, 15, 45, 0.9) 100%);
            border: var(--border-tech);
            border-left: 3px solid var(--pi-purple);
            padding: 8px 15px;
            font-size: 12px;
            letter-spacing: 1px;
            text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5), inset 0 0 15px rgba(138, 43, 226, 0.1);
            backdrop-filter: blur(8px);
        }

        .hud-card { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
        .gold-text { color: var(--pi-gold); font-size: 15px; font-weight: bold; text-shadow: 0 0 8px rgba(255, 215, 0, 0.4); }
        .purple-text { color: #d0a1ff; font-size: 10px; }
        
        .overlay-mask { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            z-index: 15; display: flex; flex-direction: column; 
        }

        #start-mask {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: #05020a;
            background-image: url("game-bg.jpg"); 
            background-size: auto 60%; background-position: center 45%; background-repeat: no-repeat;
            display: flex; flex-direction: column; justify-content: space-between; align-items: center;
        }

        /* الأشرطة العلوية والسفلية - تصميم Cockpit */
        .pi-top-banner {
            width: 100%; height: 50px;
            background: rgba(5, 2, 10, 0.95);
            border-bottom: 1px solid var(--pi-purple);
            box-shadow: 0 5px 20px rgba(138, 43, 226, 0.3);
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 25px; box-sizing: border-box; z-index: 20;
            font-size: 11px; letter-spacing: 2px;
        }

        .pi-top-banner .left-text { color: var(--pi-purple); }
        .pi-top-banner .right-text { color: #888; }
        .pi-top-banner .right-text span { color: var(--pi-gold); text-shadow: 0 0 5px var(--pi-gold); font-size: 14px;}

        .pi-bottom-status {
            width: 100%; padding: 10px 25px; box-sizing: border-box;
            background: rgba(5, 2, 10, 0.9); border-top: 1px solid rgba(255, 215, 0, 0.2);
            font-size: 10px; color: #666; letter-spacing: 1px;
            display: flex; justify-content: space-between; z-index: 20;
        }
        .pi-bottom-status .status-linked { color: var(--success-green); text-shadow: 0 0 5px rgba(0, 255, 136, 0.4); }

        /* نافذة الحظيرة (المتجر) */
        #shop-carousel { 
            display: none; align-items: center; justify-content: space-between; 
            width: 320px; margin-top: 60px;
            animation: glitchFade 0.3s ease-out;
        }
        
        @keyframes glitchFade { 
            0% { opacity: 0; transform: scale(0.98) translateY(10px); filter: hue-rotate(90deg); } 
            100% { opacity: 1; transform: scale(1) translateY(0); filter: hue-rotate(0); } 
        }
        
        .carousel-btn { 
            background: transparent; color: var(--pi-purple); border: 1px solid var(--pi-purple); 
            width: 30px; height: 30px; font-size: 12px; cursor: pointer; transition: 0.2s;
            clip-path: polygon(25% 0%, 100% 0%, 75% 100%, 0% 100%); /* شكل زر تكتيكي */
        }
        .carousel-btn.left { clip-path: polygon(0 0, 75% 0, 100% 100%, 25% 100%); }
        .carousel-btn:hover { background: var(--pi-purple); color: #fff; box-shadow: 0 0 10px var(--pi-purple); }
        
        .plane-info { flex-grow: 1; text-align: center; }
        .plane-name { font-family: 'Rajdhani', sans-serif; font-size: 18px; color: #fff; margin: 0 0 2px 0; font-weight: 700; letter-spacing: 1px;}
        .plane-status { font-size: 10px; color: #888; margin: 0; }

        /* الأزرار المستقبلية (Cyber Buttons) */
        .btn-area-bottom { width: 100%; display: flex; flex-direction: column; align-items: center; margin-bottom: 25px; z-index: 20; }
        .action-container-main { display: flex; gap: 15px; justify-content: center; width: 100%; max-width: 450px; }

        .cyber-btn {
            background: rgba(138, 43, 226, 0.1);
            border: 1px solid var(--pi-purple);
            color: #fff;
            font-family: 'Share Tech Mono', monospace;
            font-size: 12px; letter-spacing: 2px; text-transform: uppercase;
            padding: 12px 0; flex: 1; cursor: pointer; transition: all 0.2s ease;
            clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
            position: relative; overflow: hidden;
        }
        .cyber-btn::before {
            content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: 0.5s;
        }
        .cyber-btn:hover::before { left: 100%; }
        .cyber-btn:hover:not(:disabled) { background: var(--pi-purple); box-shadow: 0 0 20px rgba(138, 43, 226, 0.6); }
        .cyber-btn:active:not(:disabled) { transform: scale(0.98); }
        .cyber-btn:disabled { background: rgba(255,255,255,0.05); border-color: rgba(255,255,255,0.1); color: #555; cursor: not-allowed; }
        
        .cyber-btn.secondary { background: rgba(5, 2, 10, 0.8); border-color: rgba(255, 215, 0, 0.3); color: var(--pi-gold); }
        .cyber-btn.secondary:hover { background: rgba(255, 215, 0, 0.1); border-color: var(--pi-gold); box-shadow: 0 0 15px rgba(255, 215, 0, 0.3); color: #fff;}

        /* شاشة النهاية */
        #gameover-mask { background: rgba(5, 2, 10, 0.95); justify-content: center; align-items: center; }
        .game-over-panel { padding: 35px; text-align: center; border-top: 3px solid var(--alert-red); border-left: none; min-width: 300px;}
        .glitch-text { font-family: 'Rajdhani', sans-serif; font-size: 28px; color: var(--alert-red); margin: 0 0 5px 0; letter-spacing: 2px; }

        /* شاشة التحميل */
        #loading { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: #05020a; z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .loading-text { color: var(--pi-purple); font-size: 14px; margin-bottom: 15px; letter-spacing: 4px; animation: blink 1s infinite;}
        .loading-bar-container { width: 200px; height: 2px; background: rgba(255,255,255,0.1); }
        .loading-bar { width: 0%; height: 100%; background: var(--pi-purple); box-shadow: 0 0 10px var(--pi-purple); animation: fill-bar 2s ease-out forwards; }
        
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
        @keyframes fill-bar { 0% { width: 0%; } 80% { width: 85%; } 100% { width: 100%; } }

        /* عناصر التحكم للموبايل */
        #touch-controls { display: none; }
        #joystick-zone { position: absolute; bottom: 30px; left: 30px; width: 100px; height: 100px; border: 1px solid rgba(138, 43, 226, 0.3); border-radius: 50%; z-index: 100; backdrop-filter: blur(4px); }
        #joystick-knob { position: absolute; top: 25px; left: 25px; width: 50px; height: 50px; background: rgba(138, 43, 226, 0.5); border-radius: 50%; box-shadow: 0 0 15px rgba(138,43,226,0.4); pointer-events: none; }
        #speed-btn { position: absolute; bottom: 40px; right: 30px; width: 60px; height: 60px; background: rgba(255, 215, 0, 0.1); border: 1px solid var(--pi-gold); color: var(--pi-gold); font-size: 11px; z-index: 100; backdrop-filter: blur(4px); display: flex; justify-content: center; align-items: center; cursor: pointer; border-radius: 50%; letter-spacing: 1px;}

        @media (max-width: 768px) {
            .action-container-main { flex-direction: column; gap: 10px; width: 85vw; }
            .cyber-btn { padding: 14px 0; }
            .pi-top-banner { padding: 0 15px; font-size: 9px; }
            .pi-bottom-status { padding: 10px 15px; font-size: 8px; }
        }
    </style>
</head>
<body>
    <div class="scanlines"></div>

    <div id="hud-container" style="display: none;">
        <div>
            <div class="tech-panel hud-card"><span class="purple-text">SYS.TIME:</span> <span id="time-left" class="gold-text">30</span>S</div>
            <div class="tech-panel hud-card"><span class="purple-text">WALLET:</span> <span id="total-points" class="gold-text" style="font-size: 13px;">0</span> π</div>
        </div>
        <div>
            <div class="tech-panel hud-card"><span class="purple-text">YIELD:</span> <span id="points" class="gold-text" style="font-size: 18px;">0</span></div>
        </div>
    </div>
    
    <div id="touch-controls">
        <div id="joystick-zone"><div id="joystick-knob"></div></div>
        <div id="speed-btn">ENGAGE</div>
    </div>

    <div id="loading">
        <div class="loading-text">SYSTEM BOOTING</div>
        <div class="loading-bar-container"><div class="loading-bar"></div></div>
    </div>
    
    <div id="start-mask" class="overlay-mask" style="display:none;">
        <div class="pi-top-banner">
            <div class="left-text">SECURE_LINK // PILOT: ABU KAREEM</div>
            <div class="right-text"><span style="color:var(--pi-gold);">π</span> NET ACTIVE</div>
        </div>

        <div id="shop-carousel" class="tech-panel" style="display:none; margin-top: 80px;"> 
            <button class="carousel-btn left" onclick="prevPlane()">◀</button>
            <div class="plane-info">
                <h3 id="cp-name" class="plane-name">LOADING ASSET...</h3>
                <p id="cp-status" class="plane-status">-</p>
            </div>
            <button class="carousel-btn" onclick="nextPlane()">▶</button>
        </div>

        <div class="btn-area-bottom">
            <div class="action-container-main">
                <button id="start-btn" class="cyber-btn" onclick="startGame()">INITIATE LAUNCH</button>
                <button id="hangar-btn" class="cyber-btn secondary" onclick="toggleHangar()">ACCESS HANGAR</button>
            </div>
        </div>

        <div class="pi-bottom-status">
            <div>NET.STATE: <span class="status-linked">AUTHORIZED</span></div>
            <div>ASSET VAULT: <span style="color: var(--pi-gold);">LOCKED (JUL 2027)</span></div>
        </div>
    </div>

    <div id="gameover-mask" class="overlay-mask" style="display:none;">
        <div class="tech-panel game-over-panel">
            <h1 class="glitch-text">SIMULATION TERMINATED</h1>
            <p style="color: #666; font-size: 10px; margin-bottom: 25px;">FLIGHT DATA UPLOADED TO MAINNET</p>
            
            <div style="background: rgba(0,0,0,0.5); padding: 15px; border: 1px solid rgba(255,215,0,0.2); margin-bottom: 25px; border-radius: 4px;">
                <p style="margin: 0; color: var(--pi-gold); font-size: 10px;">SESSION YIELD</p>
                <h2 style="font-size: 2.5rem; margin: 5px 0; color: #fff;">+<span id="final-score">0</span> <span style="font-size: 1.2rem; color: var(--pi-purple);">π</span></h2>
            </div>
            
            <button class="cyber-btn" style="width: 100%;" onclick="restartGame()">SYSTEM REBOOT</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xa3d2f7);
        const fog = new THREE.FogExp2(0xa3d2f7, 0.0008);
        scene.fog = fog;

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 4000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.outputEncoding = THREE.sRGBEncoding;
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        
        renderer.domElement.style.visibility = 'hidden';
        document.body.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.5));
        const sunLight = new THREE.DirectionalLight(0xffffff, 1.5);
        sunLight.position.set(300, 500, 200);
        sunLight.castShadow = true;
        scene.add(sunLight);

        let totalPoints = parseInt(localStorage.getItem('flight_totalPoints')) || 0;
        document.getElementById('total-points').innerText = totalPoints;

        let basePassengerModel = null; 
        let baseFighterModel = null;     
        let currentActiveAirplane = null; 
        
        let isPlaying = false;
        let hasTakenOff = false;
        let score = 0;
        let timeLeft = 30;
        let currentSpeed = 1.5;
        let timerInterval = null;
        const rings = [];
        const environmentObjects = [];
        
        const keys = { w: false, s: false, a: false, d: false, space: false };
        const joyState = { x: 0, y: 0, active: false };
        const fleet = [
            { id: 0, type: 'passenger', name: 'B737 CRUISER', unlockCost: 0, colorHex: null },
            { id: 1, type: 'passenger', name: 'CRIMSON WING', unlockCost: 50, colorHex: 0xff3333 },
            { id: 2, type: 'passenger', name: 'COBALT RAY', unlockCost: 100, colorHex: 0x3366ff },
            { id: 3, type: 'passenger', name: 'JADE FALCON', unlockCost: 150, colorHex: 0x33ff33 },
            { id: 4, type: 'passenger', name: 'GOLDEN CONDOR', unlockCost: 200, colorHex: 0xffd700 },
            { id: 5, type: 'fighter', name: 'G650 PHANTOM', unlockCost: 300, colorHex: null },
            { id: 6, type: 'fighter', name: 'NIGHTSHADE', unlockCost: 400, colorHex: 0x222222 },
            { id: 7, type: 'fighter', name: 'DESERT MIRAGE', unlockCost: 500, colorHex: 0xcc9955 },
            { id: 8, type: 'fighter', name: 'R44 APEX', unlockCost: 600, colorHex: 0x003366 },
            { id: 9, type: 'fighter', name: 'OMEGA PROTOCOL', unlockCost: 750, colorHex: 0x8b0000 }
        ];
        let currentSelectionIndex = 0;

        function toggleHangar() {
            const carousel = document.getElementById('shop-carousel');
            carousel.style.display = (carousel.style.display === 'none' || carousel.style.display === '') ? 'flex' : 'none';
        }

        let audioCtx, engineOsc, engineOsc2, noiseNode, noiseFilter, engineFilter, engineGain, noiseGain;
        
        function initEngineSound() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            if (engineOsc) return; 

            engineOsc = audioCtx.createOscillator(); engineOsc.type = 'sawtooth'; engineOsc.frequency.setValueAtTime(55, audioCtx.currentTime);
            engineOsc2 = audioCtx.createOscillator(); engineOsc2.type = 'sawtooth'; engineOsc2.frequency.setValueAtTime(55.6, audioCtx.currentTime);
            
            engineFilter = audioCtx.createBiquadFilter(); engineFilter.type = 'lowpass'; engineFilter.frequency.setValueAtTime(280, audioCtx.currentTime);
            engineGain = audioCtx.createGain(); engineGain.gain.setValueAtTime(0.18, audioCtx.currentTime);
            
            engineOsc.connect(engineFilter); engineOsc2.connect(engineFilter); engineFilter.connect(engineGain); engineGain.connect(audioCtx.destination);
            
            let bufferSize = 2 * audioCtx.sampleRate; let noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            let output = noiseBuffer.getChannelData(0); for (let i = 0; i < bufferSize; i++) output[i] = Math.random() * 2 - 1; 
            
            noiseNode = audioCtx.createBufferSource(); noiseNode.buffer = noiseBuffer; noiseNode.loop = true;
            noiseFilter = audioCtx.createBiquadFilter(); noiseFilter.type = 'bandpass'; noiseFilter.frequency.setValueAtTime(380, audioCtx.currentTime); noiseFilter.Q.setValueAtTime(1.2, audioCtx.currentTime);
            noiseGain = audioCtx.createGain(); noiseGain.gain.setValueAtTime(0.07, audioCtx.currentTime);
            
            noiseNode.connect(noiseFilter); noiseFilter.connect(noiseGain); noiseGain.connect(audioCtx.destination);
            
            engineOsc.start(); engineOsc2.start(); noiseNode.start();
        }

        function updateEngineSound(speedUp) {
            if (!audioCtx || !engineOsc) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            let isFighter = fleet[currentSelectionIndex].type === 'fighter';
            let baseFreq = isFighter ? 70 : 55;
            const targetFreq = speedUp ? (baseFreq * 1.6) : baseFreq;
            const targetFilter = speedUp ? 550 : 280;
            const targetNoiseFilter = speedUp ? 750 : 380;
            const targetNoiseGain = speedUp ? 0.14 : 0.07;
            
            engineOsc.frequency.setTargetAtTime(targetFreq, audioCtx.currentTime, 0.15);
            engineOsc2.frequency.setTargetAtTime(targetFreq + 0.6, audioCtx.currentTime, 0.15);
            engineFilter.frequency.setTargetAtTime(targetFilter, audioCtx.currentTime, 0.2);
            
            if (noiseFilter) {
                noiseFilter.frequency.setTargetAtTime(targetNoiseFilter, audioCtx.currentTime, 0.2);
                noiseGain.gain.setTargetAtTime(targetNoiseGain, audioCtx.currentTime, 0.15);
            }
        }

        function stopEngineSound() { 
            if(engineGain) engineGain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.15); 
            if(noiseGain) noiseGain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.15);
            setTimeout(() => { engineOsc = null; engineOsc2 = null; noiseNode = null; }, 200);
        }

        const terrainGroup = new THREE.Group(); scene.add(terrainGroup);
        const envColors = { desert: 0xdfb175, mountain: 0x7a8b99, forest: 0x1e5631 };
        let currentEnv = 'desert';

        function addEnvironmentDecorations(zPos, envType) {
            const count = 20;
            for(let i=0; i<count; i++) {
                let mesh; const side = Math.random() > 0.5 ? 1 : -1; const x = (Math.random() * 350 + 90) * side;
                if (envType === 'desert') {
                    mesh = new THREE.Mesh(new THREE.DodecahedronGeometry(Math.random() * 14 + 6), new THREE.MeshStandardMaterial({ color: 0xc68642, roughness: 0.9, flatShading: true }));
                    mesh.position.set(x, -8, zPos + (Math.random() * 1000 - 500)); mesh.scale.set(1, Math.random() * 2 + 1, 1);
                } else if (envType === 'forest') {
                    const tree = new THREE.Group();
                    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(1.5, 2.5, 15, 6), new THREE.MeshStandardMaterial({ color: 0x4a3728 })); trunk.position.y = 7.5; tree.add(trunk);
                    const leaves = new THREE.Mesh(new THREE.ConeGeometry(10, 24, 6), new THREE.MeshStandardMaterial({ color: 0x145a32, flatShading:true })); leaves.position.y = 22; tree.add(leaves);
                    mesh = tree; mesh.position.set(x, -10, zPos + (Math.random() * 1000 - 500));
                } else if (envType === 'mountain') {
                    mesh = new THREE.Mesh(new THREE.ConeGeometry(Math.random() * 40 + 20, Math.random() * 90 + 40, 5), new THREE.MeshStandardMaterial({ color: 0x566573, flatShading:true }));
                    mesh.position.set(x * 1.5, Math.random() * 10 - 10, zPos + (Math.random() * 1000 - 500));
                }
                if(mesh) { mesh.castShadow = true; mesh.receiveShadow = true; scene.add(mesh); environmentObjects.push(mesh); }
            }
        }

        function createTerrainSegment(zPos, colorHex, isRunway = false) {
            const width = 1200; const length = 1000;
            const geometry = new THREE.PlaneGeometry(width, length, 16, 16);
            const pos = geometry.attributes.position;
            for (let i = 0; i < pos.count; i++) {
                const x = pos.getX(i); const y = pos.getY(i);
                if (Math.abs(x) > 120 && !isRunway) {
                    let heightFactor = currentEnv === 'mountain' ? 140 : (currentEnv === 'forest' ? 60 : 30);
                    pos.setZ(i, Math.abs(Math.sin(x * 0.02) * Math.cos(y * 0.02) * heightFactor));
                }
            }
            geometry.computeVertexNormals();
            const terrain = new THREE.Mesh(geometry, new THREE.MeshStandardMaterial({ color: colorHex, roughness: 0.95, flatShading: true }));
            terrain.rotation.x = -Math.PI / 2; terrain.position.set(0, -10, zPos); terrain.receiveShadow = true; terrainGroup.add(terrain);

            if (isRunway) {
                const runway = new THREE.Mesh(new THREE.PlaneGeometry(60, 800), new THREE.MeshStandardMaterial({ color: 0x212121 }));
                runway.rotation.x = -Math.PI / 2; runway.position.set(0, -9.8, zPos + 100); runway.receiveShadow = true; scene.add(runway);
            } else { addEnvironmentDecorations(zPos, currentEnv); }
        }

        createTerrainSegment(0, envColors.desert, true); createTerrainSegment(-1000, envColors.desert); createTerrainSegment(-2000, envColors.desert);

        const loader = new THREE.GLTFLoader();
        loader.load('airplane.glb', (gltf) => {
            basePassengerModel = gltf.scene; basePassengerModel.scale.set(3.5, 3.5, 3.5);
            basePassengerModel.traverse(c => { if(c.isMesh) { c.castShadow = true; c.receiveShadow = true; } }); checkAllLoaded();
        }, undefined, (err) => {
            const geom = new THREE.BoxGeometry(5,2,10); const mat = new THREE.MeshStandardMaterial({color: 0xffffff});
            basePassengerModel = new THREE.Mesh(geom, mat); checkAllLoaded();
        });

        loader.load('Fighter.glb.glb', (gltf) => { 
            baseFighterModel = gltf.scene; baseFighterModel.scale.set(1.0, 1.0, 1.0);
            baseFighterModel.traverse(c => { if(c.isMesh) { c.castShadow = true; c.receiveShadow = true; c.frustumCulled = false; } }); checkAllLoaded();
        }, undefined, (err) => {
            const geom = new THREE.ConeGeometry(4, 14, 16); const mat = new THREE.MeshStandardMaterial({color: 0x555555});
            baseFighterModel = new THREE.Mesh(geom, mat); baseFighterModel.rotation.x = Math.PI/2; checkAllLoaded();
        });
        
        let loadedCount = 0;
        function checkAllLoaded() {
            loadedCount++;
            if(loadedCount >= 2) { document.getElementById('loading').style.display = 'none'; document.getElementById('start-mask').style.display = 'flex'; updateShopUI(); }
        }

        function nextPlane() { currentSelectionIndex = (currentSelectionIndex + 1) % fleet.length; updateShopUI(); }
        function prevPlane() { currentSelectionIndex = (currentSelectionIndex - 1 + fleet.length) % fleet.length; updateShopUI(); }

        function updateShopUI() {
            const planeData = fleet[currentSelectionIndex];
            document.getElementById('cp-name').innerText = planeData.name;
            const statusEl = document.getElementById('cp-status');
            const startBtn = document.getElementById('start-btn');
            
            if (totalPoints >= planeData.unlockCost) {
                statusEl.innerText = "STATUS: DEPLOYMENT READY"; 
                statusEl.style.color = "var(--success-green)"; 
                startBtn.disabled = false; startBtn.innerText = "INITIATE LAUNCH";
            } else {
                statusEl.innerText = `STATUS: LOCKED (REQ. ${planeData.unlockCost} π)`; 
                statusEl.style.color = "var(--alert-red)"; 
                startBtn.disabled = true; startBtn.innerText = "FUNDS REQUIRED";
            }
        }

        function spawnSelectedPlane(planeData) {
            if (currentActiveAirplane) scene.remove(currentActiveAirplane);
            let baseModel = planeData.type === 'passenger' ? basePassengerModel : baseFighterModel;
            
            currentActiveAirplane = baseModel.clone();
            currentActiveAirplane.traverse(c => {
                if (c.isMesh) {
                    c.castShadow = true; c.receiveShadow = true; c.frustumCulled = false;
                    if (c.material) {
                        c.material = c.material.clone();
                        if (planeData.colorHex !== null) { c.material.color.setHex(planeData.colorHex); }
                        c.material.needsUpdate = true;
                    }
                }
            });
            currentActiveAirplane.position.set(0, -9.8, 300); currentActiveAirplane.rotation.set(0, Math.PI, 0); scene.add(currentActiveAirplane);
        }

        function createRing(zPos) {
            const geometry = new THREE.TorusGeometry(13, 1.4, 16, 40);
            const ring = new THREE.Mesh(geometry, new THREE.MeshStandardMaterial({ color: 0xffd700, metalness: 0.9 }));
            ring.position.set((Math.random() - 0.5) * 180, Math.random() * 65 + 25, zPos);
            scene.add(ring); rings.push(ring);
        }
        for (let i = 1; i <= 20; i++) { createRing(-i * 160); }

        window.addEventListener('keydown', (e) => {
            if(e.key === 'w' || e.key === 'ArrowUp') keys.w = true; if(e.key === 's' || e.key === 'ArrowDown') keys.s = true;
            if(e.key === 'a' || e.key === 'ArrowLeft') keys.a = true; if(e.key === 'd' || e.key === 'ArrowRight') keys.d = true;
            if(e.key === ' ') { if(isPlaying) e.preventDefault(); keys.space = true; }
        });
        window.addEventListener('keyup', (e) => {
            if(e.key === 'w' || e.key === 'ArrowUp') keys.w = false; if(e.key === 's' || e.key === 'ArrowDown') keys.s = false;
            if(e.key === 'a' || e.key === 'ArrowLeft') keys.a = false; if(e.key === 'd' || e.key === 'ArrowRight') keys.d = false;
            if(e.key === ' ') keys.space = false;
        });

        const joyZone = document.getElementById('joystick-zone'); const joyKnob = document.getElementById('joystick-knob');
        let joyCenter = { x: 0, y: 0 }; const maxJoyRadius = 25;
        function handleTouchMove(e) {
            e.preventDefault(); if(!joyState.active) return; const touch = e.touches[0];
            let dx = touch.clientX - joyCenter.x; let dy = touch.clientY - joyCenter.y;
            let dist = Math.sqrt(dx*dx + dy*dy);
            if(dist > maxJoyRadius) { dx = (dx / dist) * maxJoyRadius; dy = (dy / dist) * maxJoyRadius; }
            joyKnob.style.transform = `translate(${dx}px, ${dy}px)`; joyState.x = dx / maxJoyRadius; joyState.y = dy / maxJoyRadius;
        }
        joyZone.addEventListener('touchstart', (e) => {
            e.preventDefault(); joyState.active = true; const rect = joyZone.getBoundingClientRect();
            joyCenter = { x: rect.left + rect.width/2, y: rect.top + rect.height/2 }; handleTouchMove(e);
        }, {passive: false});
        joyZone.addEventListener('touchmove', handleTouchMove, {passive: false});
        joyZone.addEventListener('touchend', () => { joyState.active = false; joyState.x = 0; joyState.y = 0; joyKnob.style.transform = 'translate(0px, 0px)'; });
        
        const speedBtn = document.getElementById('speed-btn');
        speedBtn.addEventListener('touchstart', (e) => { e.preventDefault(); keys.space = true; }, {passive: false});
        speedBtn.addEventListener('touchend', () => { keys.space = false; });

        function startGame() {
            document.getElementById('start-mask').style.display = 'none'; document.getElementById('hud-container').style.display = 'flex';
            renderer.domElement.style.visibility = 'visible';
            if (window.innerWidth <= 768) { document.getElementById('touch-controls').style.display = 'block'; }
            
            spawnSelectedPlane(fleet[currentSelectionIndex]); initEngineSound();
            
            isPlaying = true; score = 0; document.getElementById('points').innerText = score; timeLeft = 30; document.getElementById('time-left').innerText = timeLeft;
            
            clearInterval(timerInterval);
            timerInterval = setInterval(() => { if(isPlaying) { timeLeft--; document.getElementById('time-left').innerText = timeLeft; if(timeLeft <= 0) endGame(); } }, 1000);
        }

        function endGame() {
            isPlaying = false; stopEngineSound(); clearInterval(timerInterval);
            document.getElementById('hud-container').style.display = 'none'; document.getElementById('touch-controls').style.display = 'none';
            totalPoints += score; localStorage.setItem('flight_totalPoints', totalPoints);
            document.getElementById('total-points').innerText = totalPoints; document.getElementById('final-score').innerText = score;
            document.getElementById('gameover-mask').style.display = 'flex';
        }

        function restartGame() {
            document.getElementById('gameover-mask').style.display = 'none'; hasTakenOff = false; currentSpeed = 1.5;
            document.getElementById('shop-carousel').style.display = 'none'; renderer.domElement.style.visibility = 'hidden'; document.getElementById('touch-controls').style.display = 'none';
            if(currentActiveAirplane) { scene.remove(currentActiveAirplane); currentActiveAirplane = null; }
            updateShopUI(); rings.forEach(r => scene.remove(r)); rings.length = 0;
            for (let i = 1; i <= 20; i++) { createRing(-i * 160); }
            document.getElementById('start-mask').style.display = 'flex';
        }

        let distanceTraveled = 0; let lastTerrainZ = -2000;

        function animate() {
            requestAnimationFrame(animate);
            if (isPlaying && currentActiveAirplane) {
                let isFighter = fleet[currentSelectionIndex].type === 'fighter';
                let speedMultiplier = keys.space ? (isFighter ? 5.5 : 4.2) : (isFighter ? 2.8 : 2.2);
                currentSpeed += (speedMultiplier - currentSpeed) * 0.1;
                updateEngineSound(keys.space);

                currentActiveAirplane.position.z -= currentSpeed; distanceTraveled = Math.abs(currentActiveAirplane.position.z);
                
                let inputY = 0; let inputX = 0;
                if (keys.w) inputY += 1; if (keys.s) inputY -= 1; if (keys.a) inputX -= 1; if (keys.d) inputX += 1;
                if (joyState.active) { inputX += joyState.x; inputY += joyState.y; }
                inputX = Math.max(-1, Math.min(1, inputX)); inputY = Math.max(-1, Math.min(1, inputY));

                if (!hasTakenOff) {
                    if (inputY > 0) {
                        currentActiveAirplane.position.y += 0.25 * inputY; currentActiveAirplane.rotation.x = 0.1;
                        if (currentActiveAirplane.position.y > -1) hasTakenOff = true;
                    } else { currentActiveAirplane.rotation.x = 0; }
                } else {
                    currentActiveAirplane.position.y += 0.65 * inputY;
                    if(currentActiveAirplane.position.y < -7) currentActiveAirplane.position.y = -7;
                    if(currentActiveAirplane.position.y > 150) currentActiveAirplane.position.y = 150;
                    currentActiveAirplane.position.x += 1.2 * inputX;
                    currentActiveAirplane.rotation.z = (inputX !== 0) ? THREE.MathUtils.lerp(currentActiveAirplane.rotation.z, -0.45 * inputX, 0.08) : THREE.MathUtils.lerp(currentActiveAirplane.rotation.z, 0, 0.08);
                }

                camera.position.x = THREE.MathUtils.lerp(camera.position.x, currentActiveAirplane.position.x, 0.07);
                camera.position.y = THREE.MathUtils.lerp(camera.position.y, currentActiveAirplane.position.y + 7.5, 0.07);
                camera.position.z = currentActiveAirplane.position.z + 45;
                camera.lookAt(new THREE.Vector3(currentActiveAirplane.position.x, currentActiveAirplane.position.y + 1.5, currentActiveAirplane.position.z - 45));
                sunLight.position.set(currentActiveAirplane.position.x + 300, currentActiveAirplane.position.y + 500, currentActiveAirplane.position.z + 200);

                if (distanceTraveled > 3500 && currentEnv === 'desert') {
                    currentEnv = 'mountain'; scene.background.setHex(0x8ba3b5); fog.color.setHex(0x8ba3b5);
                } else if (distanceTraveled > 7500 && currentEnv === 'mountain') {
                    currentEnv = 'forest'; scene.background.setHex(0x7ecbb3); fog.color.setHex(0x7ecbb3);
                }

                if (currentActiveAirplane.position.z < lastTerrainZ + 1500) { lastTerrainZ -= 1000; createTerrainSegment(lastTerrainZ, envColors[currentEnv]); }

                for (let i = rings.length - 1; i >= 0; i--) {
                    const ring = rings[i]; ring.rotation.y += 0.015; const dist = currentActiveAirplane.position.distanceTo(ring.position);
                    if (dist < 20 && Math.abs(currentActiveAirplane.position.z - ring.position.z) < 8) {
                        scene.remove(ring); rings.splice(i, 1); score += 10; timeLeft += 3;
                        document.getElementById('points').innerText = score; document.getElementById('time-left').innerText = timeLeft;
                        createRing(rings.reduce((min, r) => r.position.z < min ? r.position.z : min, currentActiveAirplane.position.z) - 160);
                    } else if (currentActiveAirplane.position.z < ring.position.z - 80) {
                        scene.remove(ring); rings.splice(i, 1); createRing(rings.reduce((min, r) => r.position.z < min ? r.position.z : min, currentActiveAirplane.position.z) - 160);
                    }
                }
                for (let i = environmentObjects.length - 1; i >= 0; i--) {
                    if (environmentObjects[i].position.z > currentActiveAirplane.position.z + 120) { scene.remove(environmentObjects[i]); environmentObjects.splice(i, 1); }
                }
            }
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); });
    </script>
</body>
</html>
