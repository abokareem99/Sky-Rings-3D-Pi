<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>لعبة الطائرة ثلاثية الأبعاد - Sky Rings 3D</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            font-family: Arial, sans-serif; 
            user-select: none; 
            background-color: #87ceeb;
            touch-action: none; 
        }
        #score { 
            position: absolute; 
            top: 20px; 
            right: 20px; 
            color: white; 
            font-size: 24px; 
            font-weight: bold; 
            z-index: 10; 
            text-shadow: 2px 2px 4px #000; 
        }
        
        #speed-container {
            position: absolute;
            bottom: 40px;
            right: 30px;
            display: flex;
            flex-direction: column;
            gap: 20px; 
            z-index: 10;
        }
        .btn { 
            width: 85px; 
            height: 85px; 
            border-radius: 50%; 
            border: 3px solid #fff; 
            font-size: 18px; 
            font-weight: bold; 
            cursor: pointer; 
            color: white;
            box-shadow: 0 6px 12px rgba(0,0,0,0.4);
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }
        #btn-speed { background: rgba(46, 204, 113, 0.9); } 
        #btn-brake { background: rgba(231, 76, 60, 0.9); } 
        .btn:active { transform: scale(0.92); }

        #joystick-base {
            position: absolute;
            bottom: 50px;
            left: 50px;
            width: 120px;
            height: 120px;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            z-index: 10;
            display: none;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }
        #joystick-stick {
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }

        #touch-hint {
            position: absolute;
            top: 70px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 15px;
            z-index: 5;
            text-shadow: 1px 1px 3px #000;
            text-align: center;
            width: 90%;
        }

        #start-btn { 
            position: absolute; 
            top: 50%; 
            left: 50%; 
            transform: translate(-50%, -50%); 
            padding: 16px 40px; 
            font-size: 22px; 
            font-weight: bold; 
            background: #2ecc71; 
            color: white; 
            border: 2px solid #fff; 
            border-radius: 12px; 
            z-index: 20; 
            cursor: pointer; 
            box-shadow: 0 6px 15px rgba(0,0,0,0.4);
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://sdk.minepi.com/pi-sdk.js"></script>
</head>
<body>

    <div id="score">النقاط: <span id="points">0</span></div>
    <div id="touch-hint">المس واسحب يسار الشاشة للتوجيه الحُر 🕹️ (اسحب لأسفل للصعود الشاهق ⬆️)</div>
    <button id="start-btn" onclick="startGame()">إقلاع وبدء اللعب</button>

    <div id="joystick-base"><div id="joystick-stick"></div></div>
    <div id="speed-container">
        <button class="btn" id="btn-speed">تسريع</button>
        <button class="btn" id="btn-brake">كبح</button>
    </div>

    <script>
        try { Pi.init({ version: "2.0", sandbox: true }); } catch (e) {}

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb); 
        scene.fog = new THREE.FogExp2(0x87ceeb, 0.008); 

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.85);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(30, 60, 30);
        scene.add(dirLight);

        // بناء الأرضية
        const floorGeo = new THREE.PlaneGeometry(4000, 4000);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x556b2f }); 
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.position.y = -50; 
        scene.add(floor);

        const runwayGeo = new THREE.PlaneGeometry(30, 600);
        const runwayMat = new THREE.MeshStandardMaterial({ color: 0x2c3e50, roughness: 0.9 });
        const runway = new THREE.Mesh(runwayGeo, runwayMat);
        runway.rotation.x = -Math.PI / 2;
        runway.position.set(0, -49.9, -250); 
        scene.add(runway);

        for (let i = 0; i > -600; i -= 40) {
            const lineGeo = new THREE.PlaneGeometry(1, 10);
            const lineMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
            const line = new THREE.Mesh(lineGeo, lineMat);
            line.rotation.x = -Math.PI / 2;
            line.position.set(0, -49.8, i);
            scene.add(line);
        }

        // الجبال المحيطية
        function createMountain(x, z, height, width) {
            const mGeo = new THREE.ConeGeometry(width, height, 5);
            const mMat = new THREE.MeshStandardMaterial({ color: 0x8b8c89, flatShading: true });
            const mountain = new THREE.Mesh(mGeo, mMat);
            mountain.position.set(x, -50 + height / 2, z);
            scene.add(mountain);
        }
        for(let i = 1; i <= 30; i++) {
            const h = 70 + Math.random() * 80;
            const w = 60 + Math.random() * 40;
            const sideX = (Math.random() > 0.5 ? 1 : -1) * (80 + Math.random() * 200);
            createMountain(sideX, -180 * i, h, w);
        }

        // --- بناء الطائرة الجديدة لمحاكاة الصورة ---
        const airplane = new THREE.Group();
        
        // خامات الألوان المأخوذة من صورتك
        const whiteMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.3 }); // أبيض للجسم
        const redMat = new THREE.MeshStandardMaterial({ color: 0xe74c3c, roughness: 0.3 }); // أحمر للمحركات والذيل
        const glassMat = new THREE.MeshStandardMaterial({ color: 0x3498db, metalness: 0.8, roughness: 0.1 }); // زجاج قمرة القيادة
        const blackMat = new THREE.MeshStandardMaterial({ color: 0x111111 }); // أسود للعجلات وداخل المحرك
        const metalMat = new THREE.MeshStandardMaterial({ color: 0x7f8c8d, metalness: 0.6 }); // معدن فضي لأعمدة العجلات

        // الجسم الرئيسي (أبيض وانسيابي)
        const bodyGeo = new THREE.CylinderGeometry(0.6, 0.4, 4.0, 16);
        bodyGeo.rotateX(Math.PI / 2);
        const bodyMesh = new THREE.Mesh(bodyGeo, whiteMat);
        airplane.add(bodyMesh);

        // مقدمة الطائرة
        const noseGeo = new THREE.SphereGeometry(0.6, 16, 16);
        noseGeo.scale(1, 0.9, 1.8);
        const noseMesh = new THREE.Mesh(noseGeo, whiteMat);
        noseMesh.position.set(0, 0, -2.0);
        airplane.add(noseMesh);

        // زجاج قمرة القيادة (أزرق)
        const cockpitGeo = new THREE.BoxGeometry(0.7, 0.4, 0.6);
        const cockpit = new THREE.Mesh(cockpitGeo, glassMat);
        cockpit.position.set(0, 0.4, -2.2);
        cockpit.rotation.x = 0.35;
        airplane.add(cockpit);

        // الأجنحة الرئيسية (أبيض)
        const wingGeo = new THREE.BoxGeometry(7.5, 0.08, 1.5);
        const wingMesh = new THREE.Mesh(wingGeo, whiteMat);
        wingMesh.position.set(0, -0.1, -0.2);
        airplane.add(wingMesh);

        // المحركات النفاثة الضخمة (غلاف أحمر، وداخل أسود)
        const engineGeo = new THREE.CylinderGeometry(0.35, 0.35, 1.2, 16);
        engineGeo.rotateX(Math.PI / 2);
        const leftEngine = new THREE.Mesh(engineGeo, redMat); leftEngine.position.set(-2.0, -0.3, -0.4);
        const rightEngine = new THREE.Mesh(engineGeo, redMat); rightEngine.position.set(2.0, -0.3, -0.4);
        
        const engineInsideGeo = new THREE.CylinderGeometry(0.3, 0.3, 1.25, 16);
        engineInsideGeo.rotateX(Math.PI / 2);
        const leftEngineIn = new THREE.Mesh(engineInsideGeo, blackMat); leftEngineIn.position.set(-2.0, -0.3, -0.4);
        const rightEngineIn = new THREE.Mesh(engineInsideGeo, blackMat); rightEngineIn.position.set(2.0, -0.3, -0.4);
        
        airplane.add(leftEngine, rightEngine, leftEngineIn, rightEngineIn);

        // الذيل (أحمر) وأجنحة الاتزان الخلفية (أبيض)
        const tailGeo = new THREE.BoxGeometry(0.08, 1.4, 1.0);
        const tailMesh = new THREE.Mesh(tailGeo, redMat); tailMesh.position.set(0, 0.7, 1.6);
        const tailFlapsGeo = new THREE.BoxGeometry(2.5, 0.06, 0.6);
        const tailFlaps = new THREE.Mesh(tailFlapsGeo, whiteMat); tailFlaps.position.set(0, 0.2, 1.6);
        airplane.add(tailMesh, tailFlaps);

        // عجلات الهبوط (لإضافة واقعية على المدرج)
        const wheelGeo = new THREE.CylinderGeometry(0.15, 0.15, 0.1, 16);
        wheelGeo.rotateZ(Math.PI / 2);
        const frontWheel = new THREE.Mesh(wheelGeo, blackMat); frontWheel.position.set(0, -0.8, -1.8);
        const leftWheel = new THREE.Mesh(wheelGeo, blackMat); leftWheel.position.set(-1.0, -0.8, 0);
        const rightWheel = new THREE.Mesh(wheelGeo, blackMat); rightWheel.position.set(1.0, -0.8, 0);
        
        const legGeo = new THREE.CylinderGeometry(0.04, 0.04, 0.5);
        const frontLeg = new THREE.Mesh(legGeo, metalMat); frontLeg.position.set(0, -0.5, -1.8);
        const leftLeg = new THREE.Mesh(legGeo, metalMat); leftLeg.position.set(-1.0, -0.5, 0);
        const rightLeg = new THREE.Mesh(legGeo, metalMat); rightLeg.position.set(1.0, -0.5, 0);

        airplane.add(frontWheel, leftWheel, rightWheel, frontLeg, leftLeg, rightLeg);

        // ضبط ارتفاع الطائرة لتقف العجلات على المدرج تماماً
        airplane.position.set(0, -48.9, 0); 
        scene.add(airplane);

        // توليد الحلقات
        const rings = [];
        function createRing(zPos) {
            const ringGeometry = new THREE.TorusGeometry(2.6, 0.25, 8, 24);
            const ringMaterial = new THREE.MeshStandardMaterial({ color: 0xfbc531, metalness: 0.5 });
            const ringMesh = new THREE.Mesh(ringGeometry, ringMaterial);
            
            const randomX = (Math.random() - 0.5) * 60;
            const randomY = -40 + (Math.random() * 80); 
            
            ringMesh.position.set(randomX, randomY, zPos);
            scene.add(ringMesh);
            rings.push(ringMesh);
        }
        for(let i = 1; i <= 6; i++) { createRing(-90 * i); }

        let speed = 0, maxSpeed = 0.75, points = 0, isPlaying = false;
        let moveX = 0, moveY = 0; 

        const joystickBase = document.getElementById('joystick-base');
        const joystickStick = document.getElementById('joystick-stick');

        let joyActive = false, joyStartX = 0, joyStartY = 0;
        let accelerating = false, braking = false;

        document.getElementById('btn-speed').addEventListener('touchstart', (e) => { e.preventDefault(); accelerating = true; });
        document.getElementById('btn-speed').addEventListener('touchend', () => accelerating = false);
        document.getElementById('btn-brake').addEventListener('touchstart', (e) => { e.preventDefault(); braking = true; });
        document.getElementById('btn-brake').addEventListener('touchend', () => braking = false);

        window.addEventListener('touchstart', (e) => {
            if (e.touches[0].clientX > window.innerWidth / 2) return; 
            
            joyActive = true;
            joyStartX = e.touches[0].clientX;
            joyStartY = e.touches[0].clientY;

            joystickBase.style.display = 'flex';
            joystickBase.style.left = (joyStartX - 60) + 'px';
            joystickBase.style.bottom = (window.innerHeight - joyStartY - 60) + 'px';
        });

        window.addEventListener('touchmove', (e) => {
            if (!joyActive) return;

            let touchX = e.touches[0].clientX;
            let touchY = e.touches[0].clientY;

            let deltaX = touchX - joyStartX;
            let deltaY = touchY - joyStartY;
            let dist = Math.sqrt(deltaX * deltaX + deltaY * deltaY);

            if (dist > 50) {
                deltaX = (deltaX / dist) * 50;
                deltaY = (deltaY / dist) * 50;
            }

            joystickStick.style.transform = `translate(${deltaX}px, ${deltaY}px)`;

            moveX = deltaX / 50;
            moveY = deltaY / 50; 
        });

        window.addEventListener('touchend', () => {
            joyActive = false;
            moveX = 0; moveY = 0;
            joystickBase.style.display = 'none'; 
            joystickStick.style.transform = 'translate(0px, 0px)';
        });

        function startGame() {
            document.getElementById('start-btn').style.display = 'none';
            isPlaying = true;
        }

        function animate() {
            requestAnimationFrame(animate);

            if (isPlaying) {
                if (accelerating) speed = Math.min(speed + 0.005, maxSpeed);
                if (braking) speed = Math.max(speed - 0.01, 0);

                airplane.position.z -= speed;

                if (speed > 0.02) {
                    airplane.position.x += moveX * 0.45;
                    airplane.rotation.z = -moveX * 0.7; 

                    airplane.position.y -= moveY * 0.45; 
                    airplane.rotation.x = moveY * 0.45; 

                    // تأمين مستوى الأرض (لمنع غوص العجلات)
                    if (airplane.position.y < -48.9) airplane.position.y = -48.9;
                    if (airplane.position.y > 100) airplane.position.y = 100;

                    if (!joyActive) {
                        airplane.rotation.z *= 0.85;
                        airplane.rotation.x *= 0.85;
                    }
                }

                // الكاميرا تتبع الطائرة
                camera.position.z = airplane.position.z + 8.5; // تم إرجاع الكاميرا لتظهر الطائرة كاملة
                camera.position.x = THREE.MathUtils.lerp(camera.position.x, airplane.position.x, 0.15);
                camera.position.y = THREE.MathUtils.lerp(camera.position.y, airplane.position.y + 2.5, 0.15);
                camera.lookAt(new THREE.Vector3(airplane.position.x, airplane.position.y + 0.5, airplane.position.z - 5));

                rings.forEach((ring) => {
                    let distance = airplane.position.distanceTo(ring.position);
                    if (distance < 3.0 && Math.abs(airplane.position.z - ring.position.z) < 0.6) {
                        points += 10;
                        document.getElementById('points').innerText = points;
                        
                        ring.position.z -= 500; 
                        ring.position.x = airplane.position.x + (Math.random() - 0.5) * 60;
                        ring.position.y = airplane.position.y + (Math.random() - 0.5) * 30;
                    }

                    if (airplane.position.z < ring.position.z - 25) {
                        ring.position.z -= 500;
                        ring.position.x = airplane.position.x + (Math.random() - 0.5) * 60;
                        ring.position.y = airplane.position.y + (Math.random() - 0.5) * 30;
                    }
                });
            }

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
