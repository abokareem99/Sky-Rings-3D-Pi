<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محاكي الطيران - مرآب الطائرات المتطور</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #bae1ff; user-select: none; }
        
        #hud-container {
            position: absolute;
            top: 25px;
            left: 25px;
            right: 25px;
            display: flex;
            justify-content: space-between;
            z-index: 10;
            pointer-events: none;
        }
        .hud-card {
            color: #ffffff; 
            font-size: 24px; 
            font-weight: bold; 
            text-shadow: 2px 2px 8px rgba(0,0,0,0.8); 
            background: rgba(0, 0, 0, 0.5); 
            padding: 10px 25px; 
            border-radius: 30px; 
            border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(5px);
        }
        #time-card { color: #ff4757; }
        #total-score-card { color: #f1c40f; font-size: 18px; margin-top: 10px; text-align: left; }

        #loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; font-size: 24px; font-weight: bold; text-shadow: 2px 2px 5px #000; z-index: 20; }
        
        .overlay-mask { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.75); z-index: 15; display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; text-align: center; }
        
        .main-btn { padding: 18px 45px; font-size: 24px; font-weight: bold; background: #e67e22; color: white; border: none; border-radius: 50px; cursor: pointer; box-shadow: 0 8px 20px rgba(0,0,0,0.5); transition: 0.3s; margin-top: 20px; }
        .main-btn:hover { background: #f39c12; transform: translateY(-3px); }
        .main-btn:disabled { background: #7f8c8d; cursor: not-allowed; transform: none; opacity: 0.6; }
        
        /* تصميم معرض الطائرات */
        #shop-carousel { display: flex; align-items: center; justify-content: center; gap: 20px; margin-top: 20px; background: rgba(255,255,255,0.1); padding: 15px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.2); }
        .carousel-btn { background: #3498db; color: white; border: none; width: 50px; height: 50px; border-radius: 50%; font-size: 24px; cursor: pointer; transition: 0.2s; }
        .carousel-btn:hover { background: #2980b9; transform: scale(1.1); }
        .plane-info { width: 280px; }
        .plane-name { font-size: 22px; color: #34dbcc; margin: 0 0 5px 0; }
        .plane-status { font-size: 16px; font-weight: bold; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

    <div id="hud-container">
        <div>
            <div id="time-card" class="hud-card">⏱️ الوقت: <span id="time-left">30</span> ثانية</div>
            <div id="total-score-card">الرصيد الإجمالي: <span id="total-points">0</span> نقطة</div>
        </div>
        <div id="score-card" class="hud-card">🪙 النقاط: <span id="points">0</span></div>
    </div>
    
    <div id="loading">جاري جلب أسطول الطائرات وإعداد المدرج...</div>
    
    <div id="start-mask" class="overlay-mask" style="display:none;">
        <h1 style="font-size: 42px; margin-bottom: 5px; color: #e67e22;">مرآب طائرات الباشمهندس عطية 🏁</h1>
        <p style="font-size: 18px; color: #bdc3c7;">اجمع الحلقات الذهبية لزيادة رصيدك وفتح طائرات جديدة!</p>
        
        <div id="shop-carousel">
            <button class="carousel-btn" onclick="prevPlane()">◀</button>
            <div class="plane-info">
                <h3 id="cp-name" class="plane-name">جاري التحميل...</h3>
                <p id="cp-status" class="plane-status">-</p>
            </div>
            <button class="carousel-btn" onclick="nextPlane()">▶</button>
        </div>

        <button id="start-btn" class="main-btn" onclick="startGame()">تشغيل المحرك والإقلاع</button>
    </div>

    <div id="gameover-mask" class="overlay-mask" style="display:none;">
        <h1 style="font-size: 48px; color: #ff4757; margin-bottom: 5px;">انتهى الوقت! ⏱️❌</h1>
        <p style="font-size: 22px;">المحرك بحاجة إلى وقود الحلقات الذهبية.</p>
        <h2 style="font-size: 28px; color: #f1c40f; margin-top: 10px;">نقاط هذه الجولة: <span id="final-score">0</span></h2>
        <button class="main-btn" style="background: #2ecc71;" onclick="restartGame()">العودة للمرآب 🔄</button>
    </div>

    <script>
        // إعداد المشهد
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xa3d2f7);
        const fog = new THREE.FogExp2(0xa3d2f7, 0.0008);
        scene.fog = fog;

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 4000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.outputEncoding = THREE.sRGBEncoding;
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.5));
        const sunLight = new THREE.DirectionalLight(0xffffff, 1.5);
        sunLight.position.set(300, 500, 200);
        sunLight.castShadow = true;
        scene.add(sunLight);

        // متغيرات النظام
        // استخدمنا localStorage لحفظ النقاط حتى لو تم تحديث الصفحة
        let totalPoints = parseInt(localStorage.getItem('flight_totalPoints')) || 0;
        document.getElementById('total-points').innerText = totalPoints;

        let basePassengerModel = null; 
        let baseFighterModel = null;     
        let currentActiveAirplane = null; 
        
        let isPlaying = false;
        let hasTakenOff = false;
        let score = 0;
        let timeLeft = 30;
        let currentSpeed = 1.5;
        let timerInterval = null;
        const rings = [];
        const environmentObjects = [];
        
        // تم تحديث الأزرار لدعم لغة الكيبورد العربية والأسهم
        const keys = { w: false, s: false, a: false, d: false, space: false };

        // --- قائمة الطائرات والألوان والأسعار ---
        const fleet = [
            { id: 0, type: 'passenger', name: '✈️ طائرة ركاب (بيضاء)', unlockCost: 0, colorHex: null },
            { id: 1, type: 'passenger', name: '✈️ طائرة ركاب (حمراء)', unlockCost: 50, colorHex: 0xff3333 },
            { id: 2, type: 'passenger', name: '✈️ طائرة ركاب (زرقاء)', unlockCost: 100, colorHex: 0x3366ff },
            { id: 3, type: 'passenger', name: '✈️ طائرة ركاب (خضراء)', unlockCost: 150, colorHex: 0x33ff33 },
            { id: 4, type: 'passenger', name: '✈️ طائرة ركاب (ذهبية)', unlockCost: 200, colorHex: 0xffd700 },
            { id: 5, type: 'fighter', name: '🚀 مقاتلة (رمادية)', unlockCost: 300, colorHex: null },
            { id: 6, type: 'fighter', name: '🚀 مقاتلة (شبح سوداء)', unlockCost: 400, colorHex: 0x222222 },
            { id: 7, type: 'fighter', name: '🚀 مقاتلة (صحراوية)', unlockCost: 500, colorHex: 0xcc9955 },
            { id: 8, type: 'fighter', name: '🚀 مقاتلة (بحرية)', unlockCost: 600, colorHex: 0x003366 },
            { id: 9, type: 'fighter', name: '🚀 مقاتلة (أوميجا حمراء)', unlockCost: 750, colorHex: 0x8b0000 }
        ];
        let currentSelectionIndex = 0;

        // إعداد الصوت
        let audioCtx, engineOsc, engineOsc2, engineFilter, engineGain;
        function initEngineSound() {
            if (audioCtx) return;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            engineOsc = audioCtx.createOscillator(); engineOsc2 = audioCtx.createOscillator();
            engineFilter = audioCtx.createBiquadFilter(); engineGain = audioCtx.createGain();
            engineOsc.type = 'sawtooth'; engineOsc.frequency.setValueAtTime(45, audioCtx.currentTime); 
            engineOsc2.type = 'triangle'; engineOsc2.frequency.setValueAtTime(90, audioCtx.currentTime); 
            engineFilter.type = 'lowpass'; engineFilter.frequency.setValueAtTime(200, audioCtx.currentTime);
            engineGain.gain.setValueAtTime(0.25, audioCtx.currentTime);
            engineOsc.connect(engineFilter); engineOsc2.connect(engineFilter);
            engineFilter.connect(engineGain); engineGain.connect(audioCtx.destination);
            engineOsc.start(); engineOsc2.start();
        }

        function updateEngineSound(speedUp) {
            if (!engineOsc) return;
            let isFighter = fleet[currentSelectionIndex].type === 'fighter';
            let baseFreq = isFighter ? 60 : 45;
            const targetFreq = speedUp ? (baseFreq + 35) : baseFreq;
            const targetFilter = speedUp ? 500 : 200;
            engineOsc.frequency.setTargetAtTime(targetFreq, audioCtx.currentTime, 0.2);
            engineFilter.frequency.setTargetAtTime(targetFilter, audioCtx.currentTime, 0.3);
        }

        function stopEngineSound() { if(audioCtx) engineGain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.1); }

        // بيئة اللعب
        const terrainGroup = new THREE.Group(); scene.add(terrainGroup);
        const envColors = { desert: 0xdfb175, mountain: 0x7a8b99, forest: 0x1e5631 };
        let currentEnv = 'desert';

        function addEnvironmentDecorations(zPos, envType) {
            const count = 20;
            for(let i=0; i<count; i++) {
                let mesh; const side = Math.random() > 0.5 ? 1 : -1; const x = (Math.random() * 350 + 90) * side;
                if (envType === 'desert') {
                    mesh = new THREE.Mesh(new THREE.DodecahedronGeometry(Math.random() * 14 + 6), new THREE.MeshStandardMaterial({ color: 0xc68642, roughness: 0.9, flatShading: true }));
                    mesh.position.set(x, -8, zPos + (Math.random() * 1000 - 500)); mesh.scale.set(1, Math.random() * 2 + 1, 1);
                } else if (envType === 'forest') {
                    const tree = new THREE.Group();
                    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(1.5, 2.5, 15, 6), new THREE.MeshStandardMaterial({ color: 0x4a3728 })); trunk.position.y = 7.5; tree.add(trunk);
                    const leaves = new THREE.Mesh(new THREE.ConeGeometry(10, 24, 6), new THREE.MeshStandardMaterial({ color: 0x145a32, flatShading:true })); leaves.position.y = 22; tree.add(leaves); 
                    mesh = tree; mesh.position.set(x, -10, zPos + (Math.random() * 1000 - 500));
                } else if (envType === 'mountain') {
                    mesh = new THREE.Mesh(new THREE.ConeGeometry(Math.random() * 40 + 20, Math.random() * 90 + 40, 5), new THREE.MeshStandardMaterial({ color: 0x566573, flatShading:true }));
                    mesh.position.set(x * 1.5, Math.random() * 10 - 10, zPos + (Math.random() * 1000 - 500));
                }
                if(mesh) { mesh.castShadow = true; mesh.receiveShadow = true; scene.add(mesh); environmentObjects.push(mesh); }
            }
        }

        function createTerrainSegment(zPos, colorHex, isRunway = false) {
            const width = 1200; const length = 1000;
            const geometry = new THREE.PlaneGeometry(width, length, 16, 16);
            const pos = geometry.attributes.position;
            for (let i = 0; i < pos.count; i++) {
                const x = pos.getX(i); const y = pos.getY(i);
                if (Math.abs(x) > 120 && !isRunway) {
                    let heightFactor = currentEnv === 'mountain' ? 140 : (currentEnv === 'forest' ? 60 : 30);
                    pos.setZ(i, Math.abs(Math.sin(x * 0.02) * Math.cos(y * 0.02) * heightFactor));
                }
            }
            geometry.computeVertexNormals();
            const terrain = new THREE.Mesh(geometry, new THREE.MeshStandardMaterial({ color: colorHex, roughness: 0.95, flatShading: true }));
            terrain.rotation.x = -Math.PI / 2; terrain.position.set(0, -10, zPos); terrain.receiveShadow = true; terrainGroup.add(terrain);

            if (isRunway) {
                const runway = new THREE.Mesh(new THREE.PlaneGeometry(60, 800), new THREE.MeshStandardMaterial({ color: 0x212121 }));
                runway.rotation.x = -Math.PI / 2; runway.position.set(0, -9.8, zPos + 100); runway.receiveShadow = true; scene.add(runway);
            } else { addEnvironmentDecorations(zPos, currentEnv); }
        }

        createTerrainSegment(0, envColors.desert, true);
        createTerrainSegment(-1000, envColors.desert);
        createTerrainSegment(-2000, envColors.desert);

        // تحميل النماذج
        const loader = new THREE.GLTFLoader();
        
        loader.load('airplane.glb', (gltf) => {
            basePassengerModel = gltf.scene;
            basePassengerModel.scale.set(3.0, 3.0, 3.0);
            basePassengerModel.traverse(c => { if(c.isMesh) { c.castShadow = true; c.receiveShadow = true; } });
            checkAllLoaded();
        }, undefined, (err) => { document.getElementById('loading').innerText = "خطأ: لم يتم العثور على airplane.glb"; });

        loader.load('Fighter.glb.glb', (gltf) => { 
            baseFighterModel = gltf.scene;
            baseFighterModel.scale.set(3.0, 3.0, 3.0); 
            baseFighterModel.traverse(c => { if(c.isMesh) { c.castShadow = true; c.receiveShadow = true; } });
            checkAllLoaded();
        }, undefined, (err) => { console.error("لم يتم العثور على Fighter.glb.glb"); checkAllLoaded(); });

        let loadedCount = 0;
        function checkAllLoaded() {
            loadedCount++;
            if(loadedCount >= 1) { // نظهر اللعبة حتى لو لم تحمل المقاتلة بعد، لكن يفضل انتظار الاثنين
                document.getElementById('loading').style.display = 'none';
                document.getElementById('start-mask').style.display = 'flex';
                updateShopUI();
            }
        }

        // --- نظام المتجر ومعرض الطائرات ---
        function nextPlane() {
            currentSelectionIndex = (currentSelectionIndex + 1) % fleet.length;
            updateShopUI();
        }

        function prevPlane() {
            currentSelectionIndex = (currentSelectionIndex - 1 + fleet.length) % fleet.length;
            updateShopUI();
        }

        function updateShopUI() {
            const planeData = fleet[currentSelectionIndex];
            document.getElementById('cp-name').innerText = planeData.name;
            
            const statusEl = document.getElementById('cp-status');
            const startBtn = document.getElementById('start-btn');

            if (totalPoints >= planeData.unlockCost) {
                statusEl.innerText = "مفتوحة ومتاحة للإقلاع ✔️";
                statusEl.style.color = "#2ecc71";
                startBtn.disabled = false;
                startBtn.innerText = "تشغيل المحرك والإقلاع";
                renderPlaneInMenu(planeData);
            } else {
                statusEl.innerText = `مغلقة (تحتاج ${planeData.unlockCost} نقطة إجمالية) 🔒`;
                statusEl.style.color = "#e74c3c";
                startBtn.disabled = true;
                startBtn.innerText = "لا تملك نقاطاً كافية";
                if(currentActiveAirplane) scene.remove(currentActiveAirplane);
            }
        }

        function renderPlaneInMenu(planeData) {
            if (currentActiveAirplane) scene.remove(currentActiveAirplane);

            let baseModel = planeData.type === 'passenger' ? basePassengerModel : baseFighterModel;
            if (!baseModel) return;

            // استنساخ المجسم لتطبيق الألوان دون تدمير الأصل
            currentActiveAirplane = baseModel.clone();

            if (planeData.colorHex !== null) {
                currentActiveAirplane.traverse(c => {
                    if (c.isMesh && c.material) {
                        c.material = c.material.clone();
                        c.material.color.setHex(planeData.colorHex);
                    }
                });
            }

            currentActiveAirplane.position.set(0, -9.8, 300);
            currentActiveAirplane.rotation.set(0, Math.PI, 0);
            scene.add(currentActiveAirplane);
        }

        // الحلقات الذهبية
        function createRing(zPos) {
            const geometry = new THREE.TorusGeometry(13, 1.4, 16, 40);
            const ring = new THREE.Mesh(geometry, new THREE.MeshStandardMaterial({ color: 0xffd700, metalness: 0.9, emissive: 0xd4af37, emissiveIntensity: 0.2 }));
            ring.position.set((Math.random() - 0.5) * 180, Math.random() * 65 + 25, zPos);
            scene.add(ring); rings.push(ring);
        }
        for (let i = 1; i <= 20; i++) { createRing(-i * 160); }

        // --- إصلاح مشكلة التحكم ---
        // استخدام e.code يتجاهل لغة الكيبورد ويعتمد على الزر الفعلي (كما يدعم الأسهم)
        window.addEventListener('keydown', (e) => {
            if(e.code === 'KeyW' || e.code === 'ArrowUp') keys.w = true;
            if(e.code === 'KeyS' || e.code === 'ArrowDown') keys.s = true;
            if(e.code === 'KeyA' || e.code === 'ArrowLeft') keys.a = true;
            if(e.code === 'KeyD' || e.code === 'ArrowRight') keys.d = true;
            if(e.code === 'Space') keys.space = true;
        });
        window.addEventListener('keyup', (e) => {
            if(e.code === 'KeyW' || e.code === 'ArrowUp') keys.w = false;
            if(e.code === 'KeyS' || e.code === 'ArrowDown') keys.s = false;
            if(e.code === 'KeyA' || e.code === 'ArrowLeft') keys.a = false;
            if(e.code === 'KeyD' || e.code === 'ArrowRight') keys.d = false;
            if(e.code === 'Space') keys.space = false;
        });

        function startGame() {
            document.getElementById('start-mask').style.display = 'none';
            initEngineSound();
            if(audioCtx) engineGain.gain.setValueAtTime(0.25, audioCtx.currentTime);
            isPlaying = true;
            score = 0;
            document.getElementById('points').innerText = score;

            timeLeft = 30;
            document.getElementById('time-left').innerText = timeLeft;
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if(isPlaying) {
                    timeLeft--; document.getElementById('time-left').innerText = timeLeft;
                    if(timeLeft <= 0) { endGame(); }
                }
            }, 1000);
        }

        function endGame() {
            isPlaying = false; stopEngineSound(); clearInterval(timerInterval);
            
            // حفظ النقاط الإجمالية
            totalPoints += score;
            localStorage.setItem('flight_totalPoints', totalPoints);
            document.getElementById('total-points').innerText = totalPoints;
            
            document.getElementById('final-score').innerText = score;
            document.getElementById('gameover-mask').style.display = 'flex';
        }

        function restartGame() {
            document.getElementById('gameover-mask').style.display = 'none';
            hasTakenOff = false; currentSpeed = 1.5;
            
            // إعادة تعيين الطائرة المحددة
            updateShopUI(); 
            
            rings.forEach(r => scene.remove(r)); rings.length = 0;
            for (let i = 1; i <= 20; i++) { createRing(-i * 160); }
            document.getElementById('start-mask').style.display = 'flex';
        }

        let distanceTraveled = 0; let lastTerrainZ = -2000;

        function animate() {
            requestAnimationFrame(animate);

            if (isPlaying && currentActiveAirplane) {
                let isFighter = fleet[currentSelectionIndex].type === 'fighter';
                let speedMultiplier = keys.space ? (isFighter ? 5.5 : 4.2) : (isFighter ? 2.8 : 2.2);
                currentSpeed += (speedMultiplier - currentSpeed) * 0.1;
                updateEngineSound(keys.space);

                currentActiveAirplane.position.z -= currentSpeed;
                distanceTraveled = Math.abs(currentActiveAirplane.position.z);

                // منطق الإقلاع والتحليق المعدّل
                if (!hasTakenOff) {
                    if (keys.w) {
                        currentActiveAirplane.position.y += 0.25;
                        currentActiveAirplane.rotation.x = 0.1;
                        if (currentActiveAirplane.position.y > -1) { hasTakenOff = true; }
                    } else { currentActiveAirplane.rotation.x = 0; }
                } else {
                    if (keys.w) currentActiveAirplane.position.y += 0.55;
                    if (keys.s) currentActiveAirplane.position.y -= 0.55;
                    if(currentActiveAirplane.position.y < -7) currentActiveAirplane.position.y = -7;

                    if (keys.a) { currentActiveAirplane.position.x -= 0.9; currentActiveAirplane.rotation.z = THREE.MathUtils.lerp(currentActiveAirplane.rotation.z, 0.45, 0.08); }
                    if (keys.d) { currentActiveAirplane.position.x += 0.9; currentActiveAirplane.rotation.z = THREE.MathUtils.lerp(currentActiveAirplane.rotation.z, -0.45, 0.08); }
                    if (!keys.a && !keys.d) { currentActiveAirplane.rotation.z = THREE.MathUtils.lerp(currentActiveAirplane.rotation.z, 0, 0.08); }
                }

                camera.position.x = THREE.MathUtils.lerp(camera.position.x, currentActiveAirplane.position.x, 0.07);
                camera.position.y = THREE.MathUtils.lerp(camera.position.y, currentActiveAirplane.position.y + 7.5, 0.07);
                camera.position.z = currentActiveAirplane.position.z + 45; 
                camera.lookAt(new THREE.Vector3(currentActiveAirplane.position.x, currentActiveAirplane.position.y + 1.5, currentActiveAirplane.position.z - 45));

                sunLight.position.set(currentActiveAirplane.position.x + 300, currentActiveAirplane.position.y + 500, currentActiveAirplane.position.z + 200);

                if (distanceTraveled > 3500 && currentEnv === 'desert') {
                    currentEnv = 'mountain'; scene.background.setHex(0x8ba3b5); fog.color.setHex(0x8ba3b5);
                } else if (distanceTraveled > 7500 && currentEnv === 'mountain') {
                    currentEnv = 'forest'; scene.background.setHex(0x7ecbb3); fog.color.setHex(0x7ecbb3);
                }

                if (currentActiveAirplane.position.z < lastTerrainZ + 1500) {
                    lastTerrainZ -= 1000; createTerrainSegment(lastTerrainZ, envColors[currentEnv]);
                }

                for (let i = rings.length - 1; i >= 0; i--) {
                    const ring = rings[i]; ring.rotation.y += 0.015;
                    const dist = currentActiveAirplane.position.distanceTo(ring.position);

                    if (dist < 20 && Math.abs(currentActiveAirplane.position.z - ring.position.z) < 8) { 
                        scene.remove(ring); rings.splice(i, 1);
                        score += 10; timeLeft += 3;
                        document.getElementById('points').innerText = score;
                        document.getElementById('time-left').innerText = timeLeft;
                        const lowestZ = rings.reduce((min, r) => r.position.z < min ? r.position.z : min, currentActiveAirplane.position.z);
                        createRing(lowestZ - 160);
                    } 
                    else if (currentActiveAirplane.position.z < ring.position.z - 80) {
                        scene.remove(ring); rings.splice(i, 1);
                        const lowestZ = rings.reduce((min, r) => r.position.z < min ? r.position.z : min, currentActiveAirplane.position.z);
                        createRing(lowestZ - 160);
                    }
                }
                for (let i = environmentObjects.length - 1; i >= 0; i--) {
                    const obj = environmentObjects[i];
                    if (obj.position.z > currentActiveAirplane.position.z + 120) { scene.remove(obj); environmentObjects.splice(i, 1); }
                }
            }
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
