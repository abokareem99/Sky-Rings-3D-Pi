<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>لعبة الطائرة ثلاثية الأبعاد - Sky Rings 3D</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: Arial, sans-serif; user-select: none; background-color: #87ceeb; touch-action: none; }
        #score { position: absolute; top: 20px; right: 20px; color: white; font-size: 24px; font-weight: bold; z-index: 10; text-shadow: 2px 2px 4px #000; }
        #speed-container { position: absolute; bottom: 40px; right: 30px; display: flex; flex-direction: column; gap: 20px; z-index: 10; }
        .btn { width: 85px; height: 85px; border-radius: 50%; border: 3px solid #fff; font-size: 18px; font-weight: bold; cursor: pointer; color: white; box-shadow: 0 6px 12px rgba(0,0,0,0.4); outline: none; -webkit-tap-highlight-color: transparent; }
        #btn-speed { background: rgba(46, 204, 113, 0.9); } 
        #btn-brake { background: rgba(231, 76, 60, 0.9); } 
        .btn:active { transform: scale(0.92); }
        #joystick-base { position: absolute; bottom: 50px; left: 50px; width: 120px; height: 120px; background: rgba(255, 255, 255, 0.2); border: 2px solid rgba(255, 255, 255, 0.6); border-radius: 50%; z-index: 10; display: none; justify-content: center; align-items: center; pointer-events: none; }
        #joystick-stick { width: 50px; height: 50px; background: rgba(255, 255, 255, 0.8); border-radius: 50%; box-shadow: 0 4px 8px rgba(0,0,0,0.3); }
        #touch-hint { position: absolute; top: 70px; left: 50%; transform: translateX(-50%); color: white; font-size: 15px; z-index: 5; text-shadow: 1px 1px 3px #000; text-align: center; width: 90%; }
        #start-btn { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); padding: 16px 40px; font-size: 22px; font-weight: bold; background: #2ecc71; color: white; border: 2px solid #fff; border-radius: 12px; z-index: 20; cursor: pointer; box-shadow: 0 6px 15px rgba(0,0,0,0.4); }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://sdk.minepi.com/pi-sdk.js"></script>
</head>
<body>

    <div id="score">النقاط: <span id="points">0</span></div>
    <div id="touch-hint">المس واسحب يسار الشاشة للتوجيه 🕹️</div>
    <button id="start-btn" onclick="startGame()">إقلاع وبدء اللعب</button>
    <div id="joystick-base"><div id="joystick-stick"></div></div>
    <div id="speed-container">
        <button class="btn" id="btn-speed">تسريع</button>
        <button class="btn" id="btn-brake">كبح</button>
    </div>

    <script>
        try { Pi.init({ version: "2.0", sandbox: true }); } catch (e) {}

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb);
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.85));
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(30, 60, 30);
        scene.add(dirLight);

        // --- نظام تحميل الطائرة مع مراقب أخطاء ---
        let airplane = null;
        const loader = new THREE.GLTFLoader();
        
        loader.load('airplane.glb', 
            (gltf) => {
                airplane = gltf.scene;
                airplane.scale.set(0.6, 0.6, 0.6);
                airplane.position.set(0, -48.9, 0);
                scene.add(airplane);
            }, 
            (xhr) => { console.log((xhr.loaded / xhr.total * 100) + '% تم التحميل'); },
            (error) => {
                alert("خطأ: لم يتم العثور على ملف airplane.glb تأكد من وجوده في نفس المجلد!");
                console.error('خطأ في تحميل الطائرة:', error);
            }
        );

        // [بقية منطق اللعبة: الحلقات، الحركة، والتحكم تبقى كما هي]
        // (ملاحظة: لضيق المساحة تم اختصار الدوال المتكررة، تأكد من إبقاء دوال createRing و animate كما كانت في كودك السابق)

        function animate() {
            requestAnimationFrame(animate);
            if (isPlaying && airplane) {
                // منطق الحركة
                // ... (أبقِ منطق الحركة الخاص بك هنا)
            }
            renderer.render(scene, camera);
        }
        
        // أضف بقية الدوال (startGame, Touch Events, إلخ) هنا...
        animate();
    </script>
</body>
</html>
