<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>لعبة الطائرة ثلاثية الأبعاد - Sky Rings 3D</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: Arial, sans-serif; user-select: none; background-color: #87ceeb; touch-action: none; }
        #top-bar { position: absolute; top: 20px; left: 20px; right: 20px; display: flex; justify-content: space-between; z-index: 10; color: white; font-size: 20px; font-weight: bold; text-shadow: 2px 2px 4px #000; }
        #speed-container { position: absolute; bottom: 40px; right: 30px; display: flex; flex-direction: column; gap: 20px; z-index: 10; }
        .btn { width: 85px; height: 85px; border-radius: 50%; border: 3px solid #fff; font-size: 18px; font-weight: bold; cursor: pointer; color: white; box-shadow: 0 6px 12px rgba(0,0,0,0.4); outline: none; -webkit-tap-highlight-color: transparent; }
        #btn-speed { background: rgba(46, 204, 113, 0.9); } 
        #btn-brake { background: rgba(231, 76, 60, 0.9); } 
        .btn:active { transform: scale(0.92); }
        #joystick-base { position: absolute; bottom: 50px; left: 50px; width: 120px; height: 120px; background: rgba(255, 255, 255, 0.2); border: 2px solid rgba(255, 255, 255, 0.6); border-radius: 50%; z-index: 10; display: flex; justify-content: center; align-items: center; }
        #joystick-stick { width: 50px; height: 50px; background: rgba(255, 255, 255, 0.8); border-radius: 50%; box-shadow: 0 4px 8px rgba(0,0,0,0.3); position: absolute; pointer-events: none; }
        #touch-hint { position: absolute; top: 70px; left: 50%; transform: translateX(-50%); color: white; font-size: 15px; z-index: 5; text-shadow: 1px 1px 3px #000; text-align: center; width: 90%; }
        #start-btn { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); padding: 16px 40px; font-size: 22px; font-weight: bold; background: #2ecc71; color: white; border: 2px solid #fff; border-radius: 12px; z-index: 20; cursor: pointer; box-shadow: 0 6px 15px rgba(0,0,0,0.4); }
        #loading { position: absolute; top: 60%; left: 50%; transform: translate(-50%, -50%); color: white; font-size: 18px; z-index: 20; display: none; text-shadow: 1px 1px 3px #000; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://sdk.minepi.com/pi-sdk.js"></script>
</head>
<body>

    <div id="top-bar">
        <div id="player-name">الطيار: جاري التحميل...</div>
        <div id="score">النقاط: <span id="points">0</span></div>
    </div>
    
    <div id="touch-hint">قم بإمالة الهاتف أو استخدم عصا التحكم للتوجيه ✈️</div>
    <button id="start-btn" onclick="startGame()">إقلاع وبدء اللعب</button>
    <div id="loading">جاري تحميل الطائرة...</div>
    
    <div id="joystick-base"><div id="joystick-stick"></div></div>
    
    <div id="speed-container">
        <button class="btn" id="btn-speed">تسريع</button>
        <button class="btn" id="btn-brake">كبح</button>
    </div>

    <script>
        // ==========================================
        // 1. إعدادات Pi Network
        // ==========================================
        let currentUser = null;
        async function initPiNetwork() {
            try {
                Pi.init({ version: "2.0", sandbox: true });
                const scopes = ['username', 'payments'];
                function onIncompletePaymentFound(payment) { console.log("دفعة غير مكتملة:", payment); }
                const auth = await Pi.authenticate(scopes, onIncompletePaymentFound);
                currentUser = auth.user;
                document.getElementById('player-name').innerText = `الطيار: ${currentUser.username}`;
            } catch (error) {
                console.warn("تعذر الاتصال بـ Pi Network. اللعب كضيف.");
                document.getElementById('player-name').innerText = "الطيار: ضيف";
            }
        }
        window.addEventListener('load', initPiNetwork);

        // ==========================================
        // 2. إعدادات المشهد والكاميرا
        // ==========================================
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb);
        scene.fog = new THREE.Fog(0x87ceeb, 100, 1000);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.8));
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(50, 100, 50);
        scene.add(dirLight);

        // ==========================================
        // 3. متغيرات اللعبة الأساسية
        // ==========================================
        let airplane = null;
        let isPlaying = false;
        let score = 0;
        let speed = 1.5; 
        let targetRotationX = 0;
        let targetRotationZ = 0;
        const rings = [];

        // تحميل الطائرة وضبط اتجاه الحركة والأبعاد التلقائية
        document.getElementById('loading').style.display = 'block';
        const loader = new THREE.GLTFLoader();
        loader.load('airplane.glb_', 
            (gltf) => {
                airplane = gltf.scene;
                
                // تعيين الحجم المباشر المتوافق مع أبعاد المجسم المرفوع
                airplane.scale.set(5.0, 5.0, 5.0);
                airplane.position.set(0, 0, 0);
                
                // تصحيح اتجاه الطائرة الافتراضي لتنظر للأمام مباشرة باتجاه الحلقات
                airplane.rotation.set(0, 0, 0);
                
                scene.add(airplane);
                document.getElementById('loading').style.display = 'none';
                
                // ضبط موضع الكاميرا الأولي خلف الطائرة مباشرة
                camera.position.set(0, 8, 25);
                camera.lookAt(airplane.position);
            }, 
            undefined, 
            (error) => {
                console.error('خطأ في تحميل الطائرة:', error);
                document.getElementById('loading').innerText = "خطأ في قراءة ملف المجسم";
            }
        );

        // ==========================================
        // 4. توليد الحلقات (Rings) في الاتجاه السلبي للمحور Z
        // ==========================================
        function createRing(zPos) {
            const geometry = new THREE.TorusGeometry(10, 0.9, 16, 50);
            const material = new THREE.MeshStandardMaterial({ color: 0xffd700, roughness: 0.3, metalness: 0.8 });
            const ring = new THREE.Mesh(geometry, material);
            
            ring.position.set(
                (Math.random() - 0.5) * 100, 
                (Math.random() - 0.5) * 60, 
                zPos
            );
            scene.add(ring);
            rings.push(ring);
        }

        // توزيع الحلقات أمام الطائرة في المسار الممتد سالب Z
        for (let i = 1; i <= 25; i++) {
            createRing(-i * 120);
        }

        // ==========================================
        // 5. التحكم باللعبة (الجيروسكوب وعصا التحكم)
        // ==========================================
        const btnSpeed = document.getElementById('btn-speed');
        const btnBrake = document.getElementById('btn-brake');
        
        btnSpeed.addEventListener('touchstart', () => speed = 3.5);
        btnSpeed.addEventListener('touchend', () => speed = 1.5);
        btnBrake.addEventListener('touchstart', () => speed = 0.5);
        btnBrake.addEventListener('touchend', () => speed = 1.5);

        const joystickBase = document.getElementById('joystick-base');
        const joystickStick = document.getElementById('joystick-stick');
        let isDragging = false;

        joystickBase.addEventListener('touchstart', (e) => isDragging = true);
        joystickBase.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            const touch = e.touches[0];
            const rect = joystickBase.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            
            let deltaX = touch.clientX - centerX;
            let deltaY = touch.clientY - centerY;
            const maxRadius = rect.width / 2;
            
            const distance = Math.sqrt(deltaX * deltaX + deltaY * deltaY);
            if (distance > maxRadius) {
                deltaX = (deltaX / distance) * maxRadius;
                deltaY = (deltaY / distance) * maxRadius;
            }
            
            joystickStick.style.transform = `translate(${deltaX}px, ${deltaY}px)`;
            
            targetRotationZ = -(deltaX / maxRadius) * 0.6;
            targetRotationX = -(deltaY / maxRadius) * 0.5;
        });
        joystickBase.addEventListener('touchend', () => {
            isDragging = false;
            joystickStick.style.transform = `translate(0px, 0px)`;
            targetRotationX = 0;
            targetRotationZ = 0;
        });

        function handleOrientation(event) {
            if (!isPlaying || isDragging) return;
            let pitch = event.beta; 
            let roll = event.gamma; 

            if (pitch !== null && roll !== null) {
                targetRotationX = THREE.MathUtils.clamp(-(pitch - 45) * 0.02, -0.6, 0.6);
                targetRotationZ = THREE.MathUtils.clamp(-roll * 0.02, -0.7, 0.7);
            }
        }

        function startGame() {
            if (!airplane) return;
            document.getElementById('start-btn').style.display = 'none';
            isPlaying = true;

            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission().then(permissionState => {
                    if (permissionState === 'granted') {
                        window.addEventListener('deviceorientation', handleOrientation);
                    }
                }).catch(console.error);
            } else {
                window.addEventListener('deviceorientation', handleOrientation);
            }
        }

        // ==========================================
        // 6. حلقة الفيزياء والمحاكاة الحركة للأمام (-Z)
        // ==========================================
        function animate() {
            requestAnimationFrame(animate);

            if (isPlaying && airplane) {
                // تدوير الطائرة بسلاسة بناء على المدخلات
                airplane.rotation.x += (targetRotationX - airplane.rotation.x) * 0.1;
                airplane.rotation.z += (targetRotationZ - airplane.rotation.z) * 0.1;
                airplane.rotation.y += targetRotationZ * 0.02;

                // تحريك الطائرة للأمام بشكل مباشر في الفضاء العالمي لضمان التوجه الصحيح نحو الحلقات
                airplane.translateZ(-speed);

                // الكاميرا تتبع الطائرة بنعومة فائقة من الخلف والارتفاع المناسب للمشهد
                const relativeCameraOffset = new THREE.Vector3(0, 6, 25);
                const cameraPosition = relativeCameraOffset.applyMatrix4(airplane.matrixWorld);
                camera.position.lerp(cameraPosition, 0.1);
                camera.lookAt(new THREE.Vector3(airplane.position.x, airplane.position.y + 2, airplane.position.z - 20));

                // فحص الاصطدامات وتدمير الحلقات الخلفية
                for (let i = rings.length - 1; i >= 0; i--) {
                    const ring = rings[i];
                    const distance = airplane.position.distanceTo(ring.position);

                    // معيار الاصطدام الدقيق بداخل قطر الحلقة الافتراضي
                    if (distance < 14 && Math.abs(airplane.position.z - ring.position.z) < 6) {
                        scene.remove(ring);
                        rings.splice(i, 1);
                        score += 10;
                        document.getElementById('points').innerText = score;
                        
                        // إضافة حلقة جديدة في مدى بعيد مستقبلي للمسار
                        const furthestZ = rings.reduce((min, r) => r.position.z < min ? r.position.z : min, airplane.position.z);
                        createRing(furthestZ - 120);
                    } 
                    // تدمير الحلقات إذا تجاوزتها الطائرة للخلف لمنع استهلاك الذاكرة
                    else if (airplane.position.z < ring.position.z - 40) {
                        scene.remove(ring);
                        rings.splice(i, 1);
                        const furthestZ = rings.reduce((min, r) => r.position.z < min ? r.position.z : min, airplane.position.z);
                        createRing(furthestZ - 120);
                    }
                }
            }

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
