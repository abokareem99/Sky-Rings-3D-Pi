<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محاكي الطيران المتقدم - التحكم المطلق</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00d2ff;
            --secondary: #2ecc71;
            --accent: #ff9f43;
            --danger: #ff4757;
            --bg-glass: rgba(10, 15, 30, 0.8);
            --border-glass: rgba(0, 210, 255, 0.25);
        }

        body { 
            margin: 0; 
            overflow: hidden; 
            font-family: 'Cairo', sans-serif; 
            background-color: #050814; 
            user-select: none;
            -webkit-user-select: none;
        }
        
        /* واجهة اللعب العليا (HUD) */
        #hud-container {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            z-index: 10;
            pointer-events: none;
        }

        .glass-panel {
            background: var(--bg-glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-glass);
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 210, 255, 0.15);
        }

        .hud-card {
            color: #ffffff; 
            font-size: 18px; 
            font-weight: 700; 
            padding: 10px 20px; 
            display: flex;
            align-items: center;
            gap: 8px;
        }

        #time-card { color: #ff4757; border-color: rgba(255, 71, 87, 0.3); }
        #score-card { color: #ffd32a; font-size: 22px; border-color: rgba(255, 211, 42, 0.3); }
        #total-score-card { 
            color: #00d2ff; 
            font-size: 14px; 
            margin-top: 6px; 
            padding: 6px 14px;
            display: inline-block;
        }

        /* شاشات الواجهة الأوفرلاي */
        .overlay-mask { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            background: radial-gradient(circle at center, rgba(5, 8, 20, 0.45) 0%, rgba(5, 8, 20, 0.9) 100%);
            backdrop-filter: blur(6px);
            z-index: 15; 
            display: flex; flex-direction: column; justify-content: center; align-items: center; 
            color: white; text-align: center; 
        }

        .main-title {
            font-size: 3rem;
            font-weight: 900;
            margin-bottom: 5px;
            background: linear-gradient(45deg, #00d2ff 0%, #00e676 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0px 4px 15px rgba(0, 210, 255, 0.3));
        }

        .subtitle { font-size: 1.1rem; color: #a4b0be; margin-bottom: 25px; }

        .main-btn { 
            padding: 14px 45px; 
            font-size: 20px; 
            font-family: 'Cairo', sans-serif;
            font-weight: 700; 
            background: linear-gradient(135deg, #00d2ff, #0056b3); 
            color: white; 
            border: none; 
            border-radius: 50px; 
            cursor: pointer; 
            box-shadow: 0 8px 25px rgba(0, 210, 255, 0.4); 
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            margin-top: 20px; 
        }
        .main-btn:hover { transform: scale(1.05); box-shadow: 0 12px 30px rgba(0, 210, 255, 0.6); }
        .main-btn:disabled { background: #57606f; cursor: not-allowed; transform: none; box-shadow: none; opacity: 0.5; }
        
        /* معرض اختيار الطائرات */
        #shop-carousel { 
            display: flex; align-items: center; justify-content: center; gap: 20px; 
            padding: 20px 30px; 
            width: 380px;
            max-width: 90vw;
            border: 1px solid rgba(0, 210, 255, 0.3);
        }
        .carousel-btn { 
            background: rgba(0, 210, 255, 0.1); color: #00d2ff; border: 1px solid rgba(0, 210, 255, 0.3); 
            width: 45px; height: 45px; border-radius: 50%; font-size: 18px; cursor: pointer; 
            transition: 0.2s; display: flex; justify-content: center; align-items: center;
        }
        .carousel-btn:hover { background: var(--primary); color: #000; box-shadow: 0 0 15px var(--primary); }
        .plane-info { flex-grow: 1; }
        .plane-name { font-size: 22px; color: #ffffff; margin: 0 0 5px 0; font-weight: 700; text-shadow: 0 2px 8px rgba(0,210,255,0.4); }
        .plane-status { font-size: 15px; font-weight: 700; margin: 0; }

        #loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #00d2ff; font-size: 24px; font-weight: 700; z-index: 20; text-shadow: 0 0 10px rgba(0,210,255,0.5); }

        /* عناصر التحكم باللمس */
        #touch-controls { display: none; }
        #joystick-zone {
            position: absolute; bottom: 40px; left: 40px; width: 140px; height: 140px;
            background: rgba(0, 210, 255, 0.05); border: 2px solid rgba(0, 210, 255, 0.3);
            border-radius: 50%; z-index: 100; backdrop-filter: blur(4px);
            box-shadow: inset 0 0 20px rgba(0,210,255,0.15);
        }
        #joystick-knob {
            position: absolute; top: 40px; left: 40px; width: 60px; height: 60px;
            background: linear-gradient(135deg, #00d2ff, #0056b3); border-radius: 50%;
            box-shadow: 0 6px 20px rgba(0,0,0,0.6), 0 0 10px rgba(0,210,255,0.5); 
            transform: translate(0px, 0px); pointer-events: none;
        }
        #speed-btn {
            position: absolute; bottom: 50px; right: 40px; width: 90px; height: 90px;
            background: linear-gradient(135deg, #ff9f43, #ff4757); border-radius: 50%; border: 2px solid rgba(255,255,255,0.3);
            color: white; font-weight: 900; font-family: 'Cairo', sans-serif; font-size: 18px;
            z-index: 100; backdrop-filter: blur(4px); box-shadow: 0 6px 20px rgba(255,71,87,0.4);
            display: flex; justify-content: center; align-items: center; cursor: pointer;
        }

        @media (max-width: 768px) {
            #touch-controls { display: block; }
            .main-title { font-size: 2rem; }
            #shop-carousel { width: 280px; padding: 12px; }
            .plane-name { font-size: 18px; }
            #joystick-zone { width: 120px; height: 120px; bottom: 30px; left: 30px; }
            #joystick-knob { width: 50px; height: 50px; top: 35px; left: 35px; }
            #speed-btn { width: 80px; height: 80px; bottom: 40px; right: 30px; font-size: 15px; }
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

    <div id="hud-container">
        <div>
            <div id="time-card" class="glass-panel hud-card">⏱️ الوقت: <span id="time-left">30</span>ث</div>
            <div id="total-score-card" class="glass-panel">الرصيد الإجمالي: <span id="total-points" style="font-weight: 700;">0</span></div>
        </div>
        <div id="score-card" class="glass-panel hud-card">🪙 <span id="points">0</span></div>
    </div>
    
    <div id="touch-controls">
        <div id="joystick-zone">
            <div id="joystick-knob"></div>
        </div>
        <div id="speed-btn">تيربو 🚀</div>
    </div>

    <div id="loading">جاري فحص أنظمة الدفع النفاث...</div>
    
    <div id="start-mask" class="overlay-mask" style="display:none;">
        <h1 class="main-title">محاكي الطيران المتقدم ✈️</h1>
        <p class="subtitle">تحكم مطلق وحرية إقلاع كاملة فورية</p>
        
        <div id="shop-carousel" class="glass-panel">
            <button class="carousel-btn" onclick="prevPlane()">◀</button>
            <div class="plane-info">
                <h3 id="cp-name" class="plane-name">جاري الفحص...</h3>
                <p id="cp-status" class="plane-status">-</p>
            </div>
            <button class="carousel-btn" onclick="nextPlane()">▶</button>
        </div>

        <button id="start-btn" class="main-btn" onclick="startGame()">انطلاق حر فوراً</button>
    </div>

    <div id="gameover-mask" class="overlay-mask" style="display:none;">
        <h1 class="main-title" style="background: linear-gradient(45deg, #ff4757, #ff6b81); -webkit-background-clip: text;">انتهت الجولة! ⏱️</h1>
        <p class="subtitle">لقد نفد وقود المحرك.</p>
        <div class="glass-panel" style="padding: 15px 35px; margin-bottom: 20px; border-color: rgba(255,71,87,0.4)">
            <h2 style="font-size: 22px; color: #ffd32a; margin: 0;">النقاط المكتسبة: <span id="final-score" style="font-size: 30px;">0</span></h2>
        </div>
        <button class="main-btn" style="background: linear-gradient(135deg, #2ecc71, #218c74); box-shadow: 0 8px 25px rgba(46,204,113,0.4);" onclick="restartGame()">العودة للمرآب 🔄</button>
    </div>

    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a1128);
        const fog = new THREE.FogExp2(0x0a1128, 0.0005);
        scene.fog = fog;

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 4000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.outputEncoding = THREE.sRGBEncoding;
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.6));
        const sunLight = new THREE.DirectionalLight(0x00d2ff, 1.4);
        sunLight.position.set(200, 500, 200);
        sunLight.castShadow = true;
        scene.add(sunLight);

        let totalPoints = parseInt(localStorage.getItem('flight_totalPoints')) || 0;
        document.getElementById('total-points').innerText = totalPoints;

        let basePassengerModel = null; 
        let baseFighterModel = null;     
        let currentActiveAirplane = null; 
        
        let isPlaying = false;
        let score = 0;
        let timeLeft = 30;
        let currentSpeed = 7.0; // زيادة سرعة البدء الافتراضية بشكل كبير
        let timerInterval = null;
        const rings = [];
        const environmentObjects = [];
        const hangarGroup = new THREE.Group();
        scene.add(hangarGroup);
        
        const keys = { w: false, s: false, a: false, d: false, space: false };
        const joyState = { x: 0, y: 0, active: false };

        const fleet = [
            { id: 0, type: 'passenger', name: '✈️ ركاب كلاسيك بيضاء', unlockCost: 0, colorHex: null },
            { id: 1, type: 'passenger', name: '✈️ ركاب الجناح الأحمر', unlockCost: 30, colorHex: 0xff3333 },
            { id: 2, type: 'passenger', name: '✈️ الصقر الأزرق النفاث', unlockCost: 60, colorHex: 0x3366ff },
            { id: 3, type: 'passenger', name: '✈️ زمردة الأجواء الخضراء', unlockCost: 100, colorHex: 0x2ecc71 },
            { id: 4, type: 'passenger', name: '✈️ الإمبراطور الذهبي الملكي', unlockCost: 150, colorHex: 0xf1c40f },
            { id: 5, type: 'fighter', name: '🚀 مقاتلة الاعتراض العسكري', unlockCost: 200, colorHex: null },
            { id: 6, type: 'fighter', name: '🚀 شبح التخفي السوداء Stealth', unlockCost: 280, colorHex: 0x111111 },
            { id: 7, type: 'fighter', name: '🚀 مقاتلة العاصفة الرملية', unlockCost: 350, colorHex: 0xe67e22 },
            { id: 8, type: 'fighter', name: '🚀 نسر المارينز البحري الأدكن', unlockCost: 450, colorHex: 0x130f40 },
            { id: 9, type: 'fighter', name: '🚀 أوميجا الفضاء الهجومية Red', unlockCost: 600, colorHex: 0xd63031 }
        ];
        let currentSelectionIndex = 0;

        // إعداد الصوت
        let audioCtx, engineOsc, engineOsc2, engineFilter, engineGain;
        function initEngineSound() {
            if (audioCtx) return;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            engineOsc = audioCtx.createOscillator(); engineOsc2 = audioCtx.createOscillator();
            engineFilter = audioCtx.createBiquadFilter(); engineGain = audioCtx.createGain();
            engineOsc.type = 'sawtooth'; engineOsc.frequency.setValueAtTime(65, audioCtx.currentTime); 
            engineOsc2.type = 'triangle'; engineOsc2.frequency.setValueAtTime(130, audioCtx.currentTime); 
            engineFilter.type = 'lowpass'; engineFilter.frequency.setValueAtTime(300, audioCtx.currentTime);
            engineGain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            engineOsc.connect(engineFilter); engineOsc2.connect(engineFilter);
            engineFilter.connect(engineGain); engineGain.connect(audioCtx.destination);
            engineOsc.start(); engineOsc2.start();
        }

        function updateEngineSound(speedUp) {
            if (!engineOsc) return;
            let isFighter = fleet[currentSelectionIndex].type === 'fighter';
            let baseFreq = isFighter ? 85 : 65;
            const targetFreq = speedUp ? (baseFreq + 60) : baseFreq;
            const targetFilter = speedUp ? 800 : 300;
            engineOsc.frequency.setTargetAtTime(targetFreq, audioCtx.currentTime, 0.1);
            engineFilter.frequency.setTargetAtTime(targetFilter, audioCtx.currentTime, 0.15);
        }

        function stopEngineSound() { if(audioCtx) engineGain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.1); }

        // بناء الحظيرة الاحترافية ثلاثية الأبعاد
        function build3DHangar() {
            hangarGroup.clear();
            const hangarWidth = 160; const hangarHeight = 90; const hangarLength = 200;
            const wallMat = new THREE.MeshStandardMaterial({ color: 0x1c2429, roughness: 0.4, metalness: 0.7, side: THREE.BackSide });
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x242b35, roughness: 0.2, metalness: 0.7 });
            
            const boxGeo = new THREE.BoxGeometry(hangarWidth, hangarHeight, hangarLength);
            const structure = new THREE.Mesh(boxGeo, wallMat);
            structure.position.set(0, hangarHeight/2 - 10, 300);
            structure.receiveShadow = true;
            hangarGroup.add(structure);

            const floorGeo = new THREE.PlaneGeometry(hangarWidth, hangarLength);
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.position.set(0, -9.9, 300);
            floor.receiveShadow = true;
            hangarGroup.add(floor);

            for(let i = -2; i <= 2; i++) {
                const lineGeo = new THREE.BoxGeometry(2.5, 0.1, hangarLength);
                const lineMat = new THREE.MeshBasicMaterial({ color: 0xffb300 });
                const line = new THREE.Mesh(lineGeo, lineMat);
                line.position.set(i * 35, -9.85, 300);
                hangarGroup.add(line);

                const lightGeo = new THREE.CylinderGeometry(0.6, 0.6, 50);
                const lightMat = new THREE.MeshBasicMaterial({ color: 0x00d2ff });
                const neon = new THREE.Mesh(lightGeo, lightMat);
                neon.rotation.z = Math.PI / 2;
                neon.position.set(0, 50, 300 + (i * 40));
                hangarGroup.add(neon);
            }
        }
        build3DHangar();

        // البيئة والتضاريس
        const terrainGroup = new THREE.Group(); scene.add(terrainGroup);
        const envColors = { desert: 0xdfb175, mountain: 0x3d4a5d, forest: 0x05c46b };
        let currentEnv = 'desert';

        function addEnvironmentDecorations(zPos, envType) {
            const count = 25;
            for(let i=0; i<count; i++) {
                let mesh; const side = Math.random() > 0.5 ? 1 : -1; const x = (Math.random() * 380 + 100) * side;
                if (envType === 'desert') {
                    mesh = new THREE.Mesh(new THREE.DodecahedronGeometry(Math.random() * 16 + 6), new THREE.MeshStandardMaterial({ color: 0xcc7a29, roughness: 0.9, flatShading: true }));
                    mesh.position.set(x, -8, zPos + (Math.random() * 1000 - 500)); mesh.scale.set(1, Math.random() * 3 + 1, 1);
                } else if (envType === 'forest') {
                    const tree = new THREE.Group();
                    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(2, 3, 18, 6), new THREE.MeshStandardMaterial({ color: 0x5c3d2e })); trunk.position.y = 9; tree.add(trunk);
                    const leaves = new THREE.Mesh(new THREE.ConeGeometry(12, 28, 6), new THREE.MeshStandardMaterial({ color: 0x019031, flatShading:true })); leaves.position.y = 26; tree.add(leaves); 
                    mesh = tree; mesh.position.set(x, -10, zPos + (Math.random() * 1000 - 500));
                } else if (envType === 'mountain') {
                    mesh = new THREE.Mesh(new THREE.ConeGeometry(Math.random() * 50 + 25, Math.random() * 110 + 50, 5), new THREE.MeshStandardMaterial({ color: 0x2c3e50, flatShading:true }));
                    mesh.position.set(x * 1.6, Math.random() * 15 - 10, zPos + (Math.random() * 1000 - 500));
                }
                if(mesh) { mesh.castShadow = true; mesh.receiveShadow = true; scene.add(mesh); environmentObjects.push(mesh); }
            }
        }

        function createTerrainSegment(zPos, colorHex, isRunway = false) {
            const width = 1500; const length = 1000;
            const geometry = new THREE.PlaneGeometry(width, length, 20, 20);
            const pos = geometry.attributes.position;
            for (let i = 0; i < pos.count; i++) {
                const x = pos.getX(i); const y = pos.getY(i);
                if (Math.abs(x) > 140 && !isRunway) {
                    let heightFactor = currentEnv === 'mountain' ? 170 : (currentEnv === 'forest' ? 75 : 35);
                    pos.setZ(i, Math.abs(Math.sin(x * 0.015) * Math.cos(y * 0.015) * heightFactor));
                }
            }
            geometry.computeVertexNormals();
            const terrain = new THREE.Mesh(geometry, new THREE.MeshStandardMaterial({ color: colorHex, roughness: 0.9, flatShading: true }));
            terrain.rotation.x = -Math.PI / 2; terrain.position.set(0, -10, zPos); terrain.receiveShadow = true; terrainGroup.add(terrain);

            if (isRunway) {
                const runway = new THREE.Mesh(new THREE.PlaneGeometry(80, 900), new THREE.MeshStandardMaterial({ color: 0x1e272e, roughness: 0.5 }));
                runway.rotation.x = -Math.PI / 2; runway.position.set(0, -9.8, zPos + 50); runway.receiveShadow = true; scene.add(runway);
            } else { addEnvironmentDecorations(zPos, currentEnv); }
        }

        createTerrainSegment(0, envColors.desert, true);
        createTerrainSegment(-1000, envColors.desert);
        createTerrainSegment(-2000, envColors.desert);

        // نماذج الطائرات الاحتياطية (توليد داخلي سريع)
        function buildMockPassenger() {
            const group = new THREE.Group();
            const body = new THREE.Mesh(new THREE.CylinderGeometry(1.8, 1.8, 16, 8), new THREE.MeshStandardMaterial({color: 0xffffff}));
            body.rotation.x = Math.PI / 2; group.add(body);
            const wings = new THREE.Mesh(new THREE.BoxGeometry(18, 0.3, 3.5), new THREE.MeshStandardMaterial({color: 0xffffff}));
            wings.position.set(0, 0, -1); group.add(wings);
            const tail = new THREE.Mesh(new THREE.BoxGeometry(0.3, 4.5, 2.5), new THREE.MeshStandardMaterial({color: 0x00d2ff}));
            tail.position.set(0, 2, 6); group.add(tail);
            group.scale.set(3.5, 3.5, 3.5);
            return group;
        }

        function buildMockFighter() {
            const group = new THREE.Group();
            const body = new THREE.Mesh(new THREE.ConeGeometry(2.2, 15, 4), new THREE.MeshStandardMaterial({color: 0x4f5d75, metalness: 0.8}));
            body.rotation.x = Math.PI / 2; group.add(body);
            const wings = new THREE.Mesh(new THREE.BoxGeometry(13, 0.2, 4.5), new THREE.MeshStandardMaterial({color: 0x2d3748, metalness: 0.7}));
            wings.position.set(0, -0.2, 1); group.add(wings);
            group.scale.set(3.5, 3.5, 3.5);
            return group;
        }

        const loader = new THREE.GLTFLoader();
        loader.load('airplane.glb', (gltf) => {
            basePassengerModel = gltf.scene; basePassengerModel.scale.set(3.8, 3.8, 3.8);
            basePassengerModel.traverse(c => { if(c.isMesh) { c.castShadow = true; c.receiveShadow = true; } });
            checkInit();
        }, undefined, (err) => { basePassengerModel = buildMockPassenger(); checkInit(); });

        loader.load('Fighter.glb.glb', (gltf) => { 
            baseFighterModel = gltf.scene; baseFighterModel.scale.set(3.8, 3.8, 3.8); 
            baseFighterModel.traverse(c => { if(c.isMesh) { c.castShadow = true; c.receiveShadow = true; } });
            checkInit();
        }, undefined, (err) => { baseFighterModel = buildMockFighter(); checkInit(); });

        let loadedModels = 0;
        function checkInit() {
            loadedModels++;
            if(loadedModels >= 2) { 
                document.getElementById('loading').style.display = 'none';
                document.getElementById('start-mask').style.display = 'flex';
                updateShopUI();
            }
        }

        function nextPlane() { currentSelectionIndex = (currentSelectionIndex + 1) % fleet.length; updateShopUI(); }
        function prevPlane() { currentSelectionIndex = (currentSelectionIndex - 1 + fleet.length) % fleet.length; updateShopUI(); }

        function updateShopUI() {
            const planeData = fleet[currentSelectionIndex];
            document.getElementById('cp-name').innerText = planeData.name;
            const statusEl = document.getElementById('cp-status');
            const startBtn = document.getElementById('start-btn');

            if (totalPoints >= planeData.unlockCost) {
                statusEl.innerText = "جاهزة للانطلاق من داخل الحظيرة ✔️";
                statusEl.style.color = "#2ecc71";
                startBtn.disabled = false;
                startBtn.innerText = "تشغيل النفاث والتحليق الحر";
                renderPlaneInMenu(planeData);
            } else {
                statusEl.innerText = `مغلقة (تتطلب رصيد إجمالي ${planeData.unlockCost} نقطة) 🔒`;
                statusEl.style.color = "#ff4757";
                startBtn.disabled = true;
                startBtn.innerText = "الرصيد غير كافٍ";
                if(currentActiveAirplane) scene.remove(currentActiveAirplane);
            }
        }

        function renderPlaneInMenu(planeData) {
            if (currentActiveAirplane) scene.remove(currentActiveAirplane);
            let baseModel = planeData.type === 'passenger' ? basePassengerModel : baseFighterModel;
            if (!baseModel) return;
            currentActiveAirplane = baseModel.clone();

            if (planeData.colorHex !== null) {
                currentActiveAirplane.traverse(c => {
                    if (c.isMesh && c.material) {
                        c.material = c.material.clone();
                        c.material.color.setHex(planeData.colorHex);
                        c.material.metalness = 0.85;
                    }
                });
            }
            currentActiveAirplane.position.set(0, -9.5, 300);
            currentActiveAirplane.rotation.set(0, Math.PI, 0);
            scene.add(currentActiveAirplane);
        }

        // الحلقات مرتفعة لزيادة التحدي
        function createRing(zPos) {
            const geometry = new THREE.TorusGeometry(15, 1.8, 16, 40);
            const ring = new THREE.Mesh(geometry, new THREE.MeshStandardMaterial({ color: 0xffd700, metalness: 0.9, emissive: 0xffb300, emissiveIntensity: 0.4 }));
            // ضبط الارتفاع ليكون ممتداً لأعلى وبشكل ديناميكي ملحوظ
            ring.position.set((Math.random() - 0.5) * 220, Math.random() * 85 + 25, zPos);
            scene.add(ring); rings.push(ring);
        }
        for (let i = 1; i <= 20; i++) { createRing(-i * 170); }

        // أحداث الكيبورد
        window.addEventListener('keydown', (e) => {
            if(e.code === 'KeyW' || e.code === 'ArrowUp') keys.w = true;
            if(e.code === 'KeyS' || e.code === 'ArrowDown') keys.s = true;
            if(e.code === 'KeyA' || e.code === 'ArrowLeft') keys.a = true;
            if(e.code === 'KeyD' || e.code === 'ArrowRight') keys.d = true;
            if(e.code === 'Space') keys.space = true;
        });
        window.addEventListener('keyup', (e) => {
            if(e.code === 'KeyW' || e.code === 'ArrowUp') keys.w = false;
            if(e.code === 'KeyS' || e.code === 'ArrowDown') keys.s = false;
            if(e.code === 'KeyA' || e.code === 'ArrowLeft') keys.a = false;
            if(e.code === 'KeyD' || e.code === 'ArrowRight') keys.d = false;
            if(e.code === 'Space') keys.space = false;
        });

        // نظام عصا التحكم المحسن بالكامل (حساسية لمس فائقة ومباشرة)
        const joyZone = document.getElementById('joystick-zone');
        const joyKnob = document.getElementById('joystick-knob');
        let joyCenter = { x: 0, y: 0 };
        const maxJoyRadius = 45; 

        function handleTouchMove(e) {
            e.preventDefault();
            if(!joyState.active) return;
            const touch = e.touches[0];
            let dx = touch.clientX - joyCenter.x;
            let dy = touch.clientY - joyCenter.y;
            let dist = Math.sqrt(dx*dx + dy*dy);
            
            if(dist > maxJoyRadius) {
                dx = (dx / dist) * maxJoyRadius;
                dy = (dy / dist) * maxJoyRadius;
            }
            
            joyKnob.style.transform = `translate(${dx}px, ${dy}px)`;
            joyState.x = dx / maxJoyRadius;
            joyState.y = dy / maxJoyRadius; 
        }

        joyZone.addEventListener('touchstart', (e) => {
            e.preventDefault();
            joyState.active = true;
            const rect = joyZone.getBoundingClientRect();
            joyCenter = { x: rect.left + rect.width/2, y: rect.top + rect.height/2 };
            handleTouchMove(e);
        }, {passive: false});

        joyZone.addEventListener('touchmove', handleTouchMove, {passive: false});

        joyZone.addEventListener('touchend', (e) => {
            e.preventDefault();
            joyState.active = false; joyState.x = 0; joyState.y = 0;
            joyKnob.style.transform = `translate(0px, 0px)`;
        });

        const speedBtn = document.getElementById('speed-btn');
        speedBtn.addEventListener('touchstart', (e) => { e.preventDefault(); keys.space = true; }, {passive: false});
        speedBtn.addEventListener('touchend', (e) => { e.preventDefault(); keys.space = false; });

        function startGame() {
            document.getElementById('start-mask').style.display = 'none';
            initEngineSound();
            if(audioCtx) engineGain.gain.setValueAtTime(0.25, audioCtx.currentTime);
            isPlaying = true;
            score = 0;
            document.getElementById('points').innerText = score;
            timeLeft = 30;
            document.getElementById('time-left').innerText = timeLeft;
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if(isPlaying) {
                    timeLeft--; document.getElementById('time-left').innerText = timeLeft;
                    if(timeLeft <= 0) { endGame(); }
                }
            }, 1000);
        }

        function endGame() {
            isPlaying = false; stopEngineSound(); clearInterval(timerInterval);
            totalPoints += score;
            localStorage.setItem('flight_totalPoints', totalPoints);
            document.getElementById('total-points').innerText = totalPoints;
            document.getElementById('final-score').innerText = score;
            document.getElementById('gameover-mask').style.display = 'flex';
        }

        function restartGame() {
            document.getElementById('gameover-mask').style.display = 'none';
            currentSpeed = 7.0;
            updateShopUI(); 
            rings.forEach(r => scene.remove(r)); rings.length = 0;
            for (let i = 1; i <= 20; i++) { createRing(-i * 170); }
            document.getElementById('start-mask').style.display = 'flex';
        }

        let distanceTraveled = 0; let lastTerrainZ = -2000;

        // حلقة التحديث والمحاكاة الفيزيائية فائقة الاستجابة والسرعة
        function animate() {
            requestAnimationFrame(animate);

            if (isPlaying && currentActiveAirplane) {
                let isFighter = fleet[currentSelectionIndex].type === 'fighter';
                
                // مضاعفة معاملات السرعة النفاثة والتيربو لحل مشكلة البطء
                let speedMultiplier = keys.space ? (isFighter ? 19.0 : 15.0) : (isFighter ? 11.5 : 9.0);
                currentSpeed += (speedMultiplier - currentSpeed) * 0.15;
                updateEngineSound(keys.space);

                currentActiveAirplane.position.z -= currentSpeed;
                distanceTraveled = Math.abs(currentActiveAirplane.position.z);

                let inputY = 0;
                let inputX = 0;

                // قراءة الكيبورد
                if (keys.w) inputY += 1.0;     // W أو السهم العلوي للارتفاع المباشر السريع
                if (keys.s) inputY -= 1.0;     // S أو السهم السفلي للهبوط
                if (keys.a) inputX -= 1.0;
                if (keys.d) inputX += 1.0;

                // قراءة عصا التحكم باللمس التناظرية
                if (joyState.active) {
                    inputX += joyState.x;
                    inputY -= joyState.y; // سحب العصا للأعلى يحرك الطائرة للأعلى فوراً وسلاسة كاجوال هاتفية
                }

                inputX = Math.max(-1, Math.min(1, inputX));
                inputY = Math.max(-1, Math.min(1, inputY));

                // حركات فيزيائية حرة ومباشرة بدون شروط تأخير أو قفل
                currentActiveAirplane.position.y += 2.2 * inputY; // رفع القوة الرأسية لقفز الارتفاعات بنسبة 2.2
                currentActiveAirplane.position.x += 2.6 * inputX; // زيادة حساسية الدوران الأفقي

                // حماية الأرضية والسقف والاصطدام التضاريسي
                if(currentActiveAirplane.position.y < -9.5) currentActiveAirplane.position.y = -9.5;
                if(currentActiveAirplane.position.y > 180) currentActiveAirplane.position.y = 180;

                // محاكاة زوايا الطيران الانسيابية (Pitch & Roll Rotation) بشكل ديناميكي مرن
                currentActiveAirplane.rotation.x = THREE.MathUtils.lerp(currentActiveAirplane.rotation.x, inputY * 0.4, 0.15);
                if (inputX !== 0) {
                    currentActiveAirplane.rotation.z = THREE.MathUtils.lerp(currentActiveAirplane.rotation.z, -0.65 * inputX, 0.12);
                } else {
                    currentActiveAirplane.rotation.z = THREE.MathUtils.lerp(currentActiveAirplane.rotation.z, 0, 0.1);
                }

                // الكاميرا السينمائية الملاحقة بدقة وسرعة
                camera.position.x = THREE.MathUtils.lerp(camera.position.x, currentActiveAirplane.position.x, 0.12);
                camera.position.y = THREE.MathUtils.lerp(camera.position.y, currentActiveAirplane.position.y + 8.5, 0.12);
                camera.position.z = currentActiveAirplane.position.z + 40; 
                camera.lookAt(new THREE.Vector3(currentActiveAirplane.position.x, currentActiveAirplane.position.y + 1.0, currentActiveAirplane.position.z - 40));

                sunLight.position.set(currentActiveAirplane.position.x + 200, currentActiveAirplane.position.y + 400, currentActiveAirplane.position.z + 100);

                // تغيير تدرجات الألوان الجوية والضباب عند قطع مسافات معينة خارج الحظيرة
                if (distanceTraveled > 4000 && currentEnv === 'desert') {
                    currentEnv = 'mountain'; scene.background.setHex(0x1e272e); fog.color.setHex(0x1e272e);
                } else if (distanceTraveled > 8500 && currentEnv === 'mountain') {
                    currentEnv = 'forest'; scene.background.setHex(0x05c46b); fog.color.setHex(0x05c46b);
                }

                if (currentActiveAirplane.position.z < lastTerrainZ + 1500) {
                    lastTerrainZ -= 1000; createTerrainSegment(lastTerrainZ, envColors[currentEnv]);
                }

                // كشف التقاط الحلقات المرتفعة
                for (let i = rings.length - 1; i >= 0; i--) {
                    const ring = rings[i]; ring.rotation.y += 0.025;
                    const dist = currentActiveAirplane.position.distanceTo(ring.position);

                    if (dist < 25 && Math.abs(currentActiveAirplane.position.z - ring.position.z) < 12) { 
                        scene.remove(ring); rings.splice(i, 1);
                        score += 10; timeLeft += 3;
                        document.getElementById('points').innerText = score;
                        document.getElementById('time-left').innerText = timeLeft;
                        const lowestZ = rings.reduce((min, r) => r.position.z < min ? r.position.z : min, currentActiveAirplane.position.z);
                        createRing(lowestZ - 170);
                    } 
                    else if (currentActiveAirplane.position.z < ring.position.z - 90) {
                        scene.remove(ring); rings.splice(i, 1);
                        const lowestZ = rings.reduce((min, r) => r.position.z < min ? r.position.z : min, currentActiveAirplane.position.z);
                        createRing(lowestZ - 170);
                    }
                }
                for (let i = environmentObjects.length - 1; i >= 0; i--) {
                    const obj = environmentObjects[i];
                    if (obj.position.z > currentActiveAirplane.position.z + 150) { scene.remove(obj); environmentObjects.splice(i, 1); }
                }
            }
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
